/* Putting a roster on the calendar, or taking it back off.

   The Hub's calendar and My Duties both read confirmed events only, so
   this flag is the difference between a roster three hundred people can
   see and one only the leads can. It used to be set locally and then
   written, ignoring the answer — so a refused write left the screen
   saying "Confirmed" over a database that still held a draft. The flag
   moves only once the database has taken it.

   Shared by generateEvent, which does this automatically, and by the
   button, which is now only needed to hide a roster deliberately. */
/* Names what is short rather than counting it. "7 slots unfilled" gives a
   lead nothing to act on; "Nandi Line — 1 male, 3 female" tells them whether
   it is worth chasing somebody before it goes out. */
function confirmPublishWithGaps(ev,gaps){
  const list=gapsFor(ev,ROSTERS[ev.id]||{});
  const shown=list.slice(0,8).map(g=>'<li>'+esc(g.duty)+' — '+esc(g.why)+'</li>').join('');
  oM('<h3>Put it on the calendar with gaps?</h3>'+
    '<p style="font-size:14px;color:var(--dm);line-height:1.6">'+
      esc(ev.name)+' on '+esc(fmtShort(ev.date))+' has <b style="color:var(--gold-lt)">'+gaps+
      '</b> unfilled slot'+(gaps===1?'':'s')+'. Everyone will see the roster, and '+
      (gaps===1?'that slot':'those slots')+' will simply show nobody.</p>'+
    '<ul style="font-size:13px;color:var(--dm);line-height:1.7;margin:0 0 14px;padding-left:20px">'+shown+
      (list.length>8?'<li>…and '+(list.length-8)+' more</li>':'')+'</ul>'+
    '<div class="macts"><button class="btn btn-ol" onclick="cM()">Cancel</button>'+
    '<button class="btn btn-gd" onclick="cM();doPublishWithGaps('+ev.id+')">Put it on the calendar anyway</button></div>');
}
async function doPublishWithGaps(id){
  const ev=EVENTS.find(e=>e.id===id); if(!ev) return;
  const gaps=slotCounts(ev).missing;
  const ok=await publishIfComplete(ev,{force:true});
  renderRoster(); refreshBadges();
  if(ok) toast('On the calendar — everyone can see it, with '+gaps+' slot'+(gaps===1?'':'s')+' still open');
}
async function setOnCalendar(ev, want){
  if(want && unsavedCount()){
    toast('The roster is not stored yet, so there is nothing to put on the calendar.','err'); return false;
  }
  pauseRT(4000);
  const ok=await dbWrite(want?'Putting the roster on the calendar':'Taking the roster off the calendar',
    ()=>sb.from('iv_events').update({confirmed:want}).eq('id',ev.id));
  if(!ok) return false;
  ev.confirmed=want;
  auditLog(want?'confirm':'unconfirm','events',ev.name+' '+ev.date);
  return true;
}
/* Publishing is gated on the roster being complete.

   A roster with holes in it is not something anybody can turn up to, so
   it does not go in front of three hundred people. The moment the last
   hole is filled it goes out on its own — nobody has to remember a
   button, which is the whole point of the change.

   The gate is one way. A roster that is already live and then develops a
   gap — somebody pulled off on the Thursday — stays on the calendar,
   because taking a published roster back out from under everybody is
   worse than the gap itself. The lead is told instead. */
async function publishIfComplete(ev, opts){
  const o = opts || {};
  if(ev.confirmed) return true;                       // already there
  /* Unsaved beats unfilled. If the roster never reached the database there
     is nothing to publish at all, and reporting "38 slots unfilled" would
     send a lead off filling slots that are not being stored either.
     setOnCalendar refuses in that case and says so. */
  if(unsavedCount()) return await setOnCalendar(ev, true);
  const gaps = slotCounts(ev).missing;
  /* o.force is a lead saying "I know — publish it anyway". Some shortfalls
     cannot be filled at all: two Nandi-certified members cannot cover four
     Nandi slots. Without this, a roster that is 41 of 48 filled stays
     invisible for ever and three hundred people see nothing rather than
     most of it. Only a deliberate press sets it — every automatic publish
     calls this without force and still refuses. */
  if(gaps > 0 && !o.force){
    if(!o.quiet) toast(gaps + ' slot' + (gaps===1?'':'s') + ' still unfilled — fill ' +
      (gaps===1?'it':'them') + ', or use Put on the calendar to publish it as it is', 'err');
    return false;
  }
  const ok = await setOnCalendar(ev, true);
  if(ok && gaps > 0) auditLog('confirm-incomplete','events',
    ev.name+' '+ev.date+' — put on the calendar with '+gaps+' slot'+(gaps===1?'':'s')+' unfilled');
  return ok;
}
async function toggleConfirm(){
  const ev=selEvent(); if(!ev||!IS_EDIT||isHistoricEvent(ev)) return;
  if(!ev.confirmed){
    /* Publishing with holes in it is a real decision, so it gets made once,
       with the duties named, rather than guessed at from a slot count. */
    /* Unfilled slots simply show blank on the calendar now, so putting a
       day back up needs no second question. */
    const ok=await publishIfComplete(ev,{force:true});
    renderRoster();
    if(ok) toast('On the calendar — everyone can see it now');
    return;
  }
  const ok=await setOnCalendar(ev, false);
  renderRoster();
  if(ok) toast('Taken off the calendar — only the leads can see it now');
}

/* ── ADD / DELETE / RESET EVENTS ── */
function openAddEvent(){
  if(!IS_EDIT) return;
  const types=[['friday','Friday Majlis'],['chandraat','Chandraat'],['pbs','Paanch Baar Saal'],['baithulkhayal','Baithulkhayal'],['student','Student Majlis'],['navroz','Navroz'],['eid','Eid / Khushiali'],['imamat','Imamat Day'],['salgirah','Salgirah'],['custom','Custom…']];
  /* Cycle ownership comes out of an astronomical new-moon calculation with
     leader overrides. Nobody can derive it in their head, and the dialog
     used to be a bare date box that rejected you only after you pressed Add
     Event. It now opens on a date that is definitely this team's, bounds
     the picker to the cycles this page can see, and answers live. */
  const k0=barCycleK();
  const mine=CYCLES.filter(c=>c.status!=='historic');
  const lo=mine.length?cyStart(mine[0].k):null;
  const hi=mine.length?cyStart(mine[mine.length-1].k+1):null;
  const today=nzTodayISO();
  /* The bar can be pointed at a finished cycle, and defaulting to its start
     would open the picker on a date outside its own min/max. Fall back to
     the first cycle you can actually add to. */
  const addable=(k0!=null&&mine.some(c=>c.k===k0))?k0:(mine.length?mine[0].k:null);
  const start=addable!=null?cyStart(addable):null;
  const def=(start&&start>today)?start:(addable!=null&&inCycleK(today,addable)?today:start);
  oM('<h3>Add Event</h3>'+
    '<div class="frow"><label class="flabel" for="aeDate">Date</label>'+
      '<input type="date" id="aeDate" onchange="aeDateChanged()"'+
      (def?' value="'+esc(def)+'"':'')+(lo?' min="'+esc(lo)+'"':'')+(hi?' max="'+esc(hi)+'"':'')+'>'+
      '<div id="aeDateHint" class="ae-hint"></div></div>'+
    '<div class="frow"><label class="flabel" for="aeType">Type</label><select id="aeType" onchange="aeTypeChanged()">'+types.map(t=>'<option value="'+t[0]+'">'+t[1]+'</option>').join('')+'</select></div>'+
    '<div class="frow"><label class="flabel" for="aeName">Event name</label><input type="text" id="aeName" value="Friday Majlis"><datalist id="eidNames">'+EID_NAMES.map(n=>'<option value="'+esc(n)+'">').join('')+'</datalist></div>'+
    '<div class="frow"><label class="flabel" for="aeUniform">Uniform</label><select id="aeUniform"><option>Casual</option><option>Formal</option></select></div>'+
    '<div class="frow"><label style="display:inline-flex;align-items:center;gap:7px;font-size:13px;cursor:pointer"><input type="checkbox" id="aeYouth" checked style="width:auto"> Youth Congregation (MPH section)</label></div>'+
    '<div class="macts"><button class="btn btn-ol" onclick="cM()">Cancel</button><button class="btn btn-bl" onclick="submitAddEvent()">Add Event</button></div>');
  aeDateChanged();
}
/* Says who owns the chosen date the moment it changes, instead of after a
   rejected submit. */
function aeDateChanged(){
  const box=document.getElementById('dcard'); if(!box) return;
  const el=box.querySelector('#aeDate'), hint=box.querySelector('#aeDateHint');
  if(!el||!hint) return;
  const v=el.value;
  if(!v){ hint.className='ae-hint'; hint.textContent='Pick a date.'; return; }
  const k=cycleForDate(v), owner=teamForCycle(k);
  const historic=cyStart(k+1)<=nzTodayISO();
  if(owner!==PAGE_TEAM){
    hint.className='ae-hint bad';
    hint.textContent='\u2715 '+fmtShort(v)+' is in Team '+owner+'\u2019s cycle \u2014 '+cycleLabel(k)+'. Pick a date in one of Team '+PAGE_TEAM+'\u2019s.';
  } else if(historic){
    hint.className='ae-hint bad';
    hint.textContent='\u2715 '+cycleLabel(k)+' has finished. You cannot add events to a past cycle.';
  } else {
    hint.className='ae-hint ok';
    const built=eventsInCycle(k).filter(e=>slotCounts(e).generated).length;
    hint.textContent='\u2713 Team '+PAGE_TEAM+' \u00b7 '+cycleLabel(k)+
      (built?' \u00b7 This cycle is under way, so the new event will be filled fairly against its other '+built+
             ' roster'+(built===1?'':'s')+'. Nothing already built changes.':'');
  }
}
function aeTypeChanged(){
  const box=document.getElementById('dcard'); const type=(box.querySelector('#aeType')||{}).value; const tm=TYPE_META[type]||TYPE_META.custom;
  const nameEl=box.querySelector('#aeName'),uniEl=box.querySelector('#aeUniform'),yEl=box.querySelector('#aeYouth');
  /* This used to overwrite the name unconditionally, so typing a name and
     then setting the type silently threw the name away. It only fills the
     field when it still holds a default nobody has edited. */
  if(nameEl){
    const auto=type==='eid'?EID_NAMES[0]:tm.name;
    const defaults=Object.keys(TYPE_META).map(t=>TYPE_META[t].name).concat(EID_NAMES);
    if(!nameEl.value.trim()||defaults.indexOf(nameEl.value.trim())>=0) nameEl.value=auto;
    if(type==='eid') nameEl.setAttribute('list','eidNames'); else nameEl.removeAttribute('list');
  }
  if(uniEl) uniEl.value=FORMAL_TYPES.includes(type)?'Formal':'Casual';
  if(yEl) yEl.checked=(type==='friday');
}
async function submitAddEvent(){
  const box=document.getElementById('dcard');
  const date=(box.querySelector('#aeDate')||{}).value; const type=(box.querySelector('#aeType')||{}).value||'custom';
  const name=((box.querySelector('#aeName')||{}).value||'').trim(); const uniform=(box.querySelector('#aeUniform')||{}).value||'Casual';
  const youth=!!(box.querySelector('#aeYouth')||{}).checked;
  if(!date) return toast('Pick a date','err'); if(!name) return toast('Enter an event name','err');
  const k=cycleForDate(date);
  if(teamForCycle(k)!==PAGE_TEAM) return toast('That date is in Team '+OTHER_TEAM+"'s cycle",'err');
  if(cyStart(k+1)<=nzTodayISO()) return toast('That cycle is historic — events cannot be added','err');
  if(EVENTS.some(e=>e.date===date&&e.name===name)) return toast('That event already exists','err');
  const row={team:PAGE_TEAM,date:date,name:name,type:type,uniform:uniform,youth:youth,confirmed:false};
  if(!sb||DB_MISSING){ toast('Could not add event — no database connection','err'); return; }
  pauseRT(1500);
  /* The event goes on screen only with the id the database gave it.
     Falling back to a locally invented id used to leave a row that could
     be rostered and published but never actually saved anywhere. */
  const rows=await dbWriteRows('Adding the event', ()=>sb.from('iv_events').insert(row));
  if(!rows) return;
  const ev=rows[0];
  EVENTS.push(ev); EVENTS.sort((a,b)=>a.date<b.date?-1:1);
  cM(); auditLog('add','events',name+' '+date);
  /* Mid-cycle (anything else in the cycle already built), the new event is
     built straight away on its own, scored against everyone's duties in the
     rest of the cycle, and shown for checking before it is saved. Nothing
     already built is touched. Otherwise it simply joins its cycle's list. */
  const others=eventsInCycle(k).filter(e=>e.id!==ev.id&&slotCounts(e).generated).length;
  if(others&&MEMBERS.some(m=>m.status==='active')){
    toast('Event added \u2014 building it against the rest of the cycle');
    generateDay(ev.id,{midCycle:others});
  } else { openCycle(k); toast('Event added'); }
}

/* The database first, and nothing local until it has answered.

   This used to take the event out of EVENTS, fire the delete, throw the
   answer away and toast "Event deleted" whatever happened — and because
   auditLog was not awaited, even the error toast dbWrite did raise was
   overwritten before it could paint. A refused delete emptied the screen
   while the event stayed on the calendar for three hundred people. */
async function deleteEvent(){
  cM(); const ev=selEvent(); if(!ev) return;
  pauseRT(4000);
  if(!await dbWrite('Deleting the event', ()=>sb.from('iv_events').delete().eq('id',ev.id))) return;
  EVENTS=EVENTS.filter(e=>e.id!==ev.id); delete ROSTERS[ev.id];
  auditLog('delete','events',ev.name+' '+ev.date);
  selEventId=null; refreshBadges(); toast('Event deleted');
  openCycle(cycleForDate(ev.date));
}
function openResetCycle(){
  if(!IS_EDIT) return;
  const today=nzTodayISO(); const next=CYCLES.find(c=>c.start>today);
  if(!next) return toast('No upcoming cycle to reset','err');
  const n=eventsInCycle(next.k).length;
  oM('<h3>Reset Next Cycle</h3><p style="font-size:14px;color:var(--dm);line-height:1.5">This deletes <b style="color:var(--red-lt)">'+n+' event'+(n===1?'':'s')+'</b> (and rosters) in <b style="color:var(--dt)">'+esc(cycleLabel(next.k))+'</b>, then re-creates the automatic Friday Majlis and Paanch Baar Saal events.</p>'+
    '<div class="frow" style="margin-top:12px"><label class="flabel" for="rcType">Type <b style="color:var(--red-lt)">RESET</b> to confirm</label><input type="text" id="rcType" placeholder="RESET" autocomplete="off"></div>'+
    '<div class="macts"><button class="btn btn-ol" onclick="cM()">Cancel</button><button class="btn btn-da" onclick="doResetCycle('+next.k+')">Reset cycle</button></div>');
}
async function doResetCycle(k){
  const box=document.getElementById('dcard'); const typed=((box.querySelector('#rcType')||{}).value||'').trim();
  if(typed!=='RESET') return toast('Type RESET to confirm','err');
  cM(); const start=cyStart(k),end=cyStart(k+1);
  /* Delete, confirm, and only then re-create.

     This was the worst of the silent writes. The delete lived in a
     catch(e){console.warn(e)}, so a refusal changed nothing and said
     nothing — and the very next line calls autoCreateEvents(), which puts
     the automatic Friday Majlis and Paanch Baar Saal events back.
     iv_events has no unique constraint on (team, date), so Postgres
     happily accepted a second copy of each. Resetting a cycle you were
     not allowed to reset doubled it instead. */
  if(sb&&!DB_MISSING){
    pauseRT(2500);
    const ok=await dbWrite('Resetting the cycle', ()=>
      sb.from('iv_events').delete().eq('team',PAGE_TEAM).gte('date',start).lt('date',end),
      /* A cycle with nothing in it is a legitimate reset, so an empty
         answer only means refusal if events are still sitting there. */
      {verify: ()=>sb.from('iv_events').select('id').eq('team',PAGE_TEAM).gte('date',start).lt('date',end)});
    if(!ok) return;
  }
  const victims=EVENTS.filter(e=>inCycleK(e.date,k)); EVENTS=EVENTS.filter(e=>!inCycleK(e.date,k)); victims.forEach(e=>delete ROSTERS[e.id]);
  auditLog('reset-cycle','events',cycleLabel(k)+' — removed '+victims.length+' events');
  await autoCreateEvents();
  if(!selEvent()){ const f=eventsInCycle(k)[0]; selEventId=f?f.id:null; }
  renderRoster(); refreshBadges(); toast('Cycle reset — auto events re-created');
}

/* Opens the duties for one day, whichever team owns it.
   Team A's page only loads Team A's events, so a Team B day has to be
   fetched on demand rather than looked up locally. Reading is allowed for
   anyone signed in; writing still is not, so this is a view only. */
/* Grows the dialog out of the cell that was tapped, so it is obvious which
   day opened and where it came from. Runs once per open: openDayDuties
   replaces the card's contents after loading, and the card itself stays put.
   prefers-reduced-motion users get the plain dialog. */
function zoomFromCell(src){
  const card=document.getElementById('dcard');
  if(!src||!card||!card.animate) return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const a=src.getBoundingClientRect(), c=card.getBoundingClientRect();
  if(!a.width||!c.width) return;
  const dx=(a.left+a.width/2)-(c.left+c.width/2), dy=(a.top+a.height/2)-(c.top+c.height/2);
  const sc=Math.max(.12,Math.min(.5,a.width/c.width));
  card.style.animation='none';
  const run=card.animate([
    {transform:'translate('+dx+'px,'+dy+'px) scale('+sc+')',opacity:.2},
    {transform:'none',opacity:1}],
    {duration:300,easing:'cubic-bezier(.16,1,.3,1)'});
  run.onfinish=run.oncancel=()=>{ card.style.animation=''; };
}

/* Renders a patch as "field: old → new" so the log answers what changed
   rather than merely that something did. Captured before the patch is
   applied, since afterwards the previous value is gone. */
function describeChange(before, patch){
  const bits=[];
  for(const k in patch){
    const was=before[k], now=patch[k];
    const fmt=v=>{
      if(v===null||v===undefined||v==='') return '(empty)';
      if(Array.isArray(v)) return v.length? v.join(', ') : '(none)';
      if(typeof v==='object') return JSON.stringify(v);
      if(typeof v==='boolean') return v?'yes':'no';
      return String(v);
    };
    if(fmt(was)===fmt(now)) continue;      // nothing actually moved
    bits.push(k+': '+fmt(was)+' \u2192 '+fmt(now));
  }
  return bits.join(', ');
}
/* Returns whether the change was actually stored, and only touches the
   local member once it has been. Every caller below builds the new value
   without mutating the member first, so a refused save leaves the card
   showing what the database still holds rather than what the person
   typed. */
async function updateMember(id,patch){
  const m=memById(id); if(!m||!IS_EDIT) return false;
  const before=JSON.parse(JSON.stringify(m));
  if(sb&&!DB_MISSING){
    pauseRT(1500);
    if(!await dbWrite('Saving the member', ()=>sb.from('iv_members').update(patch).eq('id',id))) return false;
  }
  Object.assign(m,patch); normMember(m);
  const changed=describeChange(before,patch);
  if(changed) auditLog('update','members',m.name+' \u2014 '+changed);
  if(curPage==='members') renderMemberGrid();
  return true;
}

function cyclePref(id,key){ const m=memById(id); if(!m) return; normMember(m); const pf=m.prefs.prefer,av=m.prefs.avoid;
  const prefs={prefer:pf.slice(),avoid:av.slice()};
  if(pf.indexOf(key)>=0){ prefs.prefer=pf.filter(k=>k!==key); prefs.avoid=av.concat([key]); }
  else if(av.indexOf(key)>=0){ prefs.avoid=av.filter(k=>k!==key); }
  else { prefs.prefer=pf.concat([key]); }
  updateMember(id,{prefs:prefs}).then(()=>openMemberDrawer(id)); }

/* ════════════════════════════════════════════
   ATTENDANCE
════════════════════════════════════════════ */
/* Ranks that run the team on the night. They belong in the attendance
   list whether or not the generator gave them a duty. */
const LEAD_RANKS=['Team Leader','Team Lead','Assistant Team Lead'];
/* Must be a lead OF THIS TEAM, and not the AV team's.
   Two separate tests, and the second is the one that matters. MEMBERS is
   already filtered to this page's team by loadAll(), so a team check alone
   changes nothing — an AV Team Lead who sits in Team A passes it. What
   marks somebody as AV is their specialized-team membership, set in the
   Hub's member directory, so that is what is read here.
   Nobody is hidden by this. An AV lead who is actually rostered on the
   night still appears with their duties, exactly like anyone else; they
   simply stop being added to Team A's roll as a supervisor they are not. */
function isAvMember(m){
  const s=m&&m.spec;
  return Array.isArray(s) && s.some(x=>String(x).toUpperCase()==='AV');
}
function isTeamLeadMember(m){
  if(LEAD_RANKS.indexOf(m.rank||'')<0) return false;
  if((m.team||'')!==PAGE_TEAM) return false;
  return !isAvMember(m);
}

/* Who should appear for an event: everyone the roster assigned, plus the
   leads. Returns each person with the duties they hold, so the list can
   show what each person is actually there to do. */
function attendanceRoll(ev){
  const data=(ROSTERS[ev.id]||{assign:{}}).assign||{};
  const byId={};
  for(const key in data){
    const label=legacyLabel(key);
    for(const q of people(data[key])){
      if(q.id==null) continue;
      (byId[q.id]=byId[q.id]||{duties:[]}).duties.push(label);
    }
  }
  const out=[];
  MEMBERS.forEach(m=>{
    if(m.status!=='active') return;
    const hit=byId[m.id];
    if(!hit && !isTeamLeadMember(m)) return;
    out.push({m:m, duties:hit?hit.duties:[], lead:isTeamLeadMember(m)});
  });
  // Rostered first, then leads who are only here to supervise.
  out.sort((a,b)=>(b.duties.length?1:0)-(a.duties.length?1:0)||a.m.name.localeCompare(b.m.name));
  return out;
}

const ATT_OPTS=[
  {k:'present', code:'P', label:'Present'},

/* ── COVER FOR ONE EVENT ──────────────────────────────────────────
   A Facilitator or above can hand a single event to somebody else when
   the Team Lead cannot make it. Scope is deliberately one event: it needs
   no expiry because a date in the past covers nothing.

   The stand-in never leaves their own team's page. Their dashboard grows
   a panel with that event's roster and attendance, and nothing else of
   the other team is reachable from it.

   Anyone with an account can be given cover, including a volunteer who
   would fail can_edit_roster(). The database grants them write access to
   exactly the rows of the event they are covering — see the *_cover
   policies in SETUP.sql — so this is not enforced in the browser alone. */
/* ════════════════════════════════════════════
   THE BELL — what needs a lead's attention
   Three things, and only three. Everything in here is something a lead
   can act on, and clicking it goes straight to the thing it is about.
   No sound, no pop-up, no email: it lights with a count and clears when
   the thing behind it is handled.
════════════════════════════════════════════ */
const BELL_HORIZON_DAYS = 14;   // unfilled slots inside a fortnight. Sooner
                                // and it is lit permanently, which is the
                                // same as being switched off.
function addDaysLocal(iso, n){
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function bellItems(){
  const out = [];
  if(!IS_EDIT) return out;
  const today = nzTodayISO();
  const horizon = addDaysLocal(today, BELL_HORIZON_DAYS);

  /* 1. Somebody marked themselves away for a duty they hold. This is why
        the bell exists — nothing takes a person off a confirmed roster,
        so a human has to see it and decide. */
  EVENTS.filter(e=>e.date >= today && e.confirmed).forEach(ev=>{
    const data = (ROSTERS[ev.id] || {assign:{}}).assign || {};
    const seen = {};
    for(const key in data){
      for(const q of people(data[key])){
        if(q.id == null || seen[q.id]) continue;
        const m = memById(q.id);
        if(m && isAway(m, ev.date)){
          seen[q.id] = true;
          out.push({kind:'away', sort:ev.date,
            title: m.name + ' is away on ' + fmtShort(ev.date),
            sub: 'Rostered for ' + (ev.name||'this event') + ' · ' + recName(legacyLabel(key)),
            go: ()=>selectEvent(ev.id)});
        }
      }
    }
  });

  /* 2. Gaps on something coming up. */
  EVENTS.filter(e=>e.date >= today && e.date <= horizon).forEach(ev=>{
    const n = slotCounts(ev).missing;
    if(n > 0) out.push({kind:'gap', sort:ev.date,
      title: n + ' unfilled ' + (n === 1 ? 'slot' : 'slots') + ' on ' + fmtShort(ev.date),
      sub: ev.name || 'IV Event',
      go: ()=>selectEvent(ev.id)});
  });

  /* 3. A day on the other team handed to you. Until now this was only
        discoverable by happening to open your dashboard. */
  COVERING.forEach((c, i)=>out.push({kind:'cover', sort:c.ev.date,
    title: 'You are covering ' + fmtShort(c.ev.date),
    sub: 'Team ' + c.ev.team + ' · ' + (c.ev.name || 'IV Event'),
    go: ()=>{ nav(IS_EDIT?'calendar':'dashboard'); setTimeout(()=>{
      const p = document.querySelector('.cover-pnl'); if(p) p.scrollIntoView({block:'center'}); }, 120); }}));

  /* 4. A past event nobody has marked attendance for. This is the one job
        the dashboard cards did that nothing else covers now that the
        calendar is the front door. */
  unmarkedEvents().forEach(ev=>out.push({kind:'att', sort:ev.date,
    title:'Attendance not marked for '+fmtShort(ev.date),
    sub:ev.name||'IV Event',
    go:()=>{ attEventId=ev.id; nav('attendance'); }}));

  out.sort((a,b)=>a.sort < b.sort ? -1 : a.sort > b.sort ? 1 : 0);
  return out;
}
let BELL = [];
function refreshBell(){
  const item = document.getElementById('bellItem');
  if(!item) return;
  BELL = bellItems();
  if(!BELL.length){
    item.style.display = 'none';
    item.classList.remove('lit');
    const pop = document.getElementById('bellPop'); if(pop) pop.classList.remove('open');
    return;
  }
  item.style.display = '';
  item.classList.add('lit');
  document.getElementById('bellCount').textContent = BELL.length;
}
function toggleBell(ev){
  if(ev) ev.stopPropagation();
  const pop = document.getElementById('bellPop');
  if(!pop) return;
  if(pop.classList.contains('open')){ pop.classList.remove('open'); return; }
  const anchor = document.getElementById('bellItem');
  if(document.body !== pop.parentNode) document.body.appendChild(pop);
  /* Anchored by its bottom edge rather than its top, so the list grows
     upward from the button and never runs off the bottom of the screen. */
  const r = anchor ? anchor.getBoundingClientRect()
                   : {right: window.innerWidth - 18, top: window.innerHeight - 76};
  pop.style.top    = 'auto';
  pop.style.left   = Math.max(12, Math.min(r.right - 320, window.innerWidth - 332)) + 'px';
  pop.style.bottom = Math.max(12, window.innerHeight - r.top + 8) + 'px';
  pop.innerHTML = BELL.map((b,i)=>
    '<button class="bell-row" onclick="bellGo(' + i + ')">' +
      '<span class="tag">' + (b.kind === 'away' ? 'Away clash' : b.kind === 'gap' ? 'Unfilled' : 'Cover') + '</span>' +
      '<b>' + esc(b.title) + '</b><small>' + esc(b.sub) + '</small></button>').join('');
  pop.classList.add('open');
}
function bellGo(i){
  const b = BELL[i]; if(!b) return;
  document.getElementById('bellPop').classList.remove('open');
  closeSidebar();
  b.go();
}
document.addEventListener('click', function(e){
  const pop = document.getElementById('bellPop');
  if(pop && pop.classList.contains('open') && !e.target.closest('#bellPop') && !e.target.closest('#bellItem')) pop.classList.remove('open');
});

/* Who has opened the Hub since this event was confirmed. Team Leads
   cannot read the accounts table at all — profiles is rank 5 and above —
   so this comes from roster_seen(), which answers that one question and
   returns member ids only: no addresses, no timestamps, and nothing
   about anybody who is not on this roster. */
let SEEN={};              // event id -> Set(member id)
async function loadSeen(eventId){
  if(!sb||DB_MISSING||eventId==null||SEEN[eventId]) return;
  try{
    const {data,error}=await sb.rpc('roster_seen',{p_event_id:eventId});
    if(!error) SEEN[eventId]=new Set(Array.isArray(data)?data:[]);
  }catch(e){ /* older database — the line simply does not appear */ }
}

let COVERING=[];          // events elsewhere that I have been asked to cover
const CAN_ASSIGN_COVER=()=>hasPerm(...MOVE_PERMS);   // Facilitator and above

async function loadCovering(){
  COVERING=[];
  if(!sb||DB_MISSING||!CU||!CU.uid) return;
  try{
    const today=nzTodayISO();
    const {data:evs}=await sb.from('iv_events').select('*')
      .eq('cover_uid',CU.uid).gte('date',today).order('date');
    /* Show the panel wherever the stand-in cannot already do the job
       through the normal roster screen. That is the other team's events
       always, and this team's too when the person is a volunteer here —
       the ordinary view is read-only for them, so filtering on team alone
       meant a volunteer asked to cover a day on their OWN team saw nothing
       at all and the cover silently did nothing. */
    const mine=(evs||[]).filter(e=>e.team!==PAGE_TEAM||!IS_EDIT);
    if(!mine.length) return;
    const ids=mine.map(e=>e.id);
    // Only the teams actually being covered — usually one.
    const teams=[...new Set(mine.map(e=>e.team).filter(Boolean))];
    const [{data:ro},{data:at},{data:me}] = await Promise.all([
      sb.from('iv_roster').select('*').in('event_id',ids),
      sb.from('iv_attendance').select('*').in('event_id',ids),
      sb.from('iv_members').select('*').in('team',teams),
    ]);
    const rosters={}; (ro||[]).forEach(r=>rosters[r.event_id]=r.data);
    const att={}; (at||[]).forEach(a=>{ (att[a.event_id]=att[a.event_id]||{})[a.member_id]={status:a.status}; });
    COVERING=mine.map(e=>({ev:e,roster:rosters[e.id]||{assign:{}},att:att[e.id]||{},members:me||[]}));
  }catch(e){ console.warn('loadCovering:',e.message||e); }
}

            : '<span class="duty-chip none">No duty</span>')+'</div></div>'+

/* Same shape as attendanceRoll, but reading the fetched copy of the other
   team's data rather than this page's globals. */
function coverRoll(c){
  const data=(c.roster||{assign:{}}).assign||{};
  const byId={};
  for(const key in data){
    const label=legacyLabel(key);
    for(const q of people(data[key])){
      if(q.id==null) continue;
      (byId[q.id]=byId[q.id]||{duties:[]}).duties.push(label);
    }
  }
  const out=[];
  (c.members||[]).forEach(m=>{
    if(m.status!=='active') return;
    const hit=byId[m.id];
    if(!hit) return;                       // rostered people only; their leads are not my business
    out.push({m:m,duties:hit.duties});
  });
  out.sort((a,b)=>a.m.name.localeCompare(b.m.name));
  return out;
}

async function markCoverAttendance(ci,memberId,status){
  const c=COVERING[ci]; if(!c) return;
  const cur=c.att[memberId]&&c.att[memberId].status;
  const next=(cur===status)?null:status;
  if(!sb||DB_MISSING){ toast('Could not save attendance \u2014 no database connection','err'); return; }
  // Hold the realtime listener off, as markAttendance does. Without it
  // our own write echoes straight back, triggers a full reload and wipes
  // the mark that is still being tapped in.
  pauseRT(1200);
  /* Same shape as markAttendance, and the same history: the clear branch
     was an unchecked await while the branch beside it was checked. Someone
     covering an event could untick a mark, watch it disappear, and find it
     back where it was the next time they opened the page. */
  const ok = next
    ? await dbWrite('Saving attendance', ()=>sb.from('iv_attendance').upsert({event_id:c.ev.id,
        member_id:memberId, status:next, marked_by:CU.user, marked_at:new Date().toISOString()}))
    : await dbWrite('Clearing the mark', ()=>sb.from('iv_attendance').delete()
        .eq('event_id',c.ev.id).eq('member_id',memberId),
        {verify: ()=>sb.from('iv_attendance').select('event_id')
                       .eq('event_id',c.ev.id).eq('member_id',memberId)});
  if(!ok){ renderDashboard(); return; }
  if(next) c.att[memberId]={status:next}; else delete c.att[memberId];
  renderDashboard();

  if(!ev){ h+='<div class="empty-note">No events to record attendance for.</div>'; el.innerHTML=h; return; }

  const roll=attendanceRoll(ev);

    ATT_OPTS.map(o=>tally[o.k]?'<div class="att-seg-'+o.k+'" style="width:'+(tally[o.k]/roll.length*100)+'%" title="'+o.label+': '+tally[o.k]+'"></div>':'').join('')+

  roll.forEach(r=>{

      ? '<button class="att-btn '+o.k+(st===o.k?' on':'')+'" title="'+o.label+'" onclick="markAttendance('+ev.id+','+m.id+',\''+o.k+'\')">'+o.code+'</button>'

       '<div class="att-nm">'+esc(m.name)+(r.lead?' <span class="lead-tag">Lead</span>':'')+

  });
  h+='</div>';
  el.innerHTML=h;
}

/* ── ANALYTICS MATHS ──────────────────────────────────────────────
   Attendance rate  = (P + L) / (P + L + N)
     A justified absence is removed from the calculation entirely, so
     telling someone in advance costs nothing. Somebody who was never
     rostered has no rate at all rather than a misleading 0%.
   Lateness rate    = L / (P + L)
     Measured against the times they actually turned up, so missing an
     event cannot make someone look more punctual.
   Duty days        = the number of duty slots they have been given. A
     person on two duties at one event counts twice, because that is two
     duties done.                                                        */
function attendanceStats(memberId, k){
  let P=0,L=0,J=0,N=0;
  const evs = (k==null) ? EVENTS : eventsInCycle(k);
  evs.forEach(ev=>{
    const st=(ATTEND[ev.id]||{})[memberId]&&ATTEND[ev.id][memberId].status;
    if(st==='present') P++; else if(st==='late') L++;
    else if(st==='excused') J++; else if(st==='absent') N++;
  });
  const attDen=P+L+N, lateDen=P+L;
  return {P:P,L:L,J:J,N:N,
    marked:P+L+J+N,
    rate:      attDen ? Math.round((P+L)/attDen*100) : null,
    lateness:  lateDen ? Math.round(L/lateDen*100)   : null};
}
/* id -> { total, cyc, prev, byDuty:{dutyName:count} } */
function dutyStats(k){
  const out={};
  const bump=(id,key,duty,recent)=>{
    const o=out[id]=out[id]||{total:0,cyc:0,prev:0,recent:0,byDuty:{}};
    o.total++; if(key) o[key]++;
    /* `recent` is the three-cycle carry the generator actually weighs —
       computeCounts() sums cycles k-1, k-2 and k-3. The report only ever
       showed `prev`, a single cycle, so a lead reading this page was being
       shown a narrower window than the policy uses and could not tell why
       somebody kept being skipped. */
    if(recent) o.recent++;
    if(duty) o.byDuty[duty]=(o.byDuty[duty]||0)+1;
  };
  EVENTS.forEach(ev=>{
    const r=ROSTERS[ev.id]; if(!r||!r.assign) return;
    const kk=cycleForDate(ev.date);
    const where = (k!=null && kk===k) ? 'cyc' : ((k!=null && kk===k-1) ? 'prev' : null);
    const inRecent = k!=null && (kk===k-1 || kk===k-2 || kk===k-3);
    for(const key in r.assign){
      const label=recName(legacyLabel(key));
      for(const q of people(r.assign[key])){ if(q.id!=null) bump(q.id, where, label, inRecent); }
    }
  });
  return out;
}
function cycleEventsSorted(k){ return eventsInCycle(k); }
function renderAttendanceReport(k){
  const active=MEMBERS.filter(m=>m.status==='active');
  if(!active.length) return '<div class="empty-note">No active members.</div>';
  /* Built once. This used to call dutyStats(k) inside the map, so the whole
     event and roster history was walked again for every single member —
     sixty members over a year of events is thousands of full passes, and
     the Analytics tab simply locked up while it ground through them. */
  const ds=dutyStats(k);
  const rows=active.map(m=>({m:m, s:attendanceStats(m.id,k), d:(ds[m.id]||{total:0})}))
    .sort((x,y)=>(y.s.rate==null?-1:y.s.rate)-(x.s.rate==null?-1:x.s.rate)||x.m.name.localeCompare(y.m.name));
  const pct=v=>v==null?'<span style="color:var(--dm)">\u2014</span>':v+'%';
  let h='<div class="tw"><div class="tw-scroll"><table><thead><tr>'+
    '<th>Member</th><th title="(Present + Late) as a share of Present, Late and Not present. Justified absences are excluded.">Attendance rate</th>'+
    '<th title="Late as a share of the times they turned up.">Lateness rate</th>'+
    '<th title="Total duty slots they have been given.">Duty days completed</th>'+
    '<th>P</th><th>L</th><th>J</th><th>N</th></tr></thead><tbody>';
  rows.forEach(r=>{
    const good=r.s.rate!=null&&r.s.rate>=90, bad=r.s.rate!=null&&r.s.rate<70;
    h+='<tr><td style="font-weight:800">'+esc(r.m.name)+'</td>'+
       '<td style="font-weight:900;color:'+(bad?'var(--red-lt)':good?'var(--green-lt)':'var(--dt)')+'">'+pct(r.s.rate)+'</td>'+
       '<td style="font-weight:800;color:'+((r.s.lateness||0)>25?'var(--gold-lt)':'var(--dt)')+'">'+pct(r.s.lateness)+'</td>'+
       '<td class="num" style="font-weight:800">'+r.d.total+'</td>'+
       '<td class="num">'+r.s.P+'</td><td class="num">'+r.s.L+'</td>'+
       '<td class="num">'+r.s.J+'</td><td class="num">'+r.s.N+'</td></tr>';
  });
  return h+'</tbody></table></div></div>'+
    '<div class="ib" style="margin-top:12px">A justified absence is left out of the attendance rate entirely \u2014 giving notice costs nothing. Lateness is measured against the times someone actually turned up, so missing an event cannot make them look more punctual. A dash means they have never been rostered.</div>';
}

/* The routine events a cycle creates for itself. Anything else in the cycle
   was put there by hand, which is what makes it worth calling out here:
   an unexpected event moves everybody's numbers and the lead should be able
   to see which ones did it. */
const ROUTINE_TYPES=new Set(['friday','pbs']);
function renderDutyReporting(k){
  const active=MEMBERS.filter(m=>m.status==='active');
  if(!active.length) return '<div class="empty-note">No active members.</div>';
  const ds=dutyStats(k);
  if(repMember!=null) return renderMemberDutyChart(repMember, ds);
  const rows=active.map(m=>({m:m,d:ds[m.id]||{total:0,cyc:0,prev:0,recent:0}}))
    .sort((x,y)=>y.d.cyc-x.d.cyc||y.d.total-x.d.total||x.m.name.localeCompare(y.m.name));

  // ── The spread, which is the thing fairness is actually about ──
  const cycCounts=rows.map(r=>r.d.cyc);
  const recCounts=rows.map(r=>r.d.recent);
  const min=Math.min.apply(null,cycCounts), max=Math.max.apply(null,cycCounts);
  const mean=cycCounts.reduce((a,b)=>a+b,0)/(cycCounts.length||1);
  const rMin=Math.min.apply(null,recCounts), rMax=Math.max.apply(null,recCounts);
  /* Two clear of the average, not one. At one, a perfectly healthy spread of
     2-4 around a mean of 3.2 flagged eighteen people as barely used, which is
     noise dressed up as a warning — the flag has to mean something when it
     fires. Stated in the panel rather than left as a magic threshold. */
  const heavy=rows.filter(r=>r.d.cyc>=mean+2).length;
  const light=rows.filter(r=>r.d.cyc<=mean-2).length;
  const stat=(label,val,col)=>'<div style="min-width:120px"><div style="font-size:11px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:var(--dm)">'+label+'</div>'+
    '<div class="num" style="font-size:20px;font-weight:900;margin-top:3px;'+(col?'color:'+col:'')+'">'+val+'</div></div>';

  let h='<div class="pnl" style="margin-bottom:14px"><div class="pnl-h">Fairness \u00b7 '+esc(cycleLabel(k))+'</div><div class="pnl-b">'+
    '<div style="display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start">'+
      stat('Spread this cycle', min+' \u2013 '+max, max-min>=3?'var(--gold-lt)':'var(--green-lt)')+
      stat('Average', mean.toFixed(1))+
      stat('Carrying more', heavy, heavy?'var(--gold-lt)':'')+
      stat('Barely used', light, light?'var(--red-lt)':'')+
      stat('Across three cycles', rMin+' \u2013 '+rMax)+
    '</div>'+
    '<div style="font-size:12px;color:var(--dm);margin-top:12px;line-height:1.55">'+
      'The generator balances on <b style="color:var(--dt)">three cycles</b>, not one \u2014 the same window shown here as \u201cLast 3 cycles\u201d. '+
      '<b style="color:var(--gold-lt)">Carrying more</b> and <b style="color:var(--red-lt)">barely used</b> mean two or more duties clear of the average. '+
      'A wide spread is not automatically unfair: certification, away dates and age limits all legitimately narrow who can take a duty.'+
    '</div></div></div>';

  // ── What was added to this cycle by hand ──
  const evs=eventsInCycle(k);
  const added=evs.filter(e=>!ROUTINE_TYPES.has(e.type));
  if(added.length){
    h+='<div class="pnl" style="margin-bottom:14px"><div class="pnl-h">Added to this cycle <span class="ct">'+added.length+'</span></div><div class="pnl-b">'+
      '<div style="font-size:12px;color:var(--dm);margin-bottom:9px;line-height:1.5">Events beyond the Friday Majlis and Paanch Baar Saal a cycle creates for itself. Fairness counts these exactly like any other duty \u2014 they are listed so you can see what moved the numbers.</div>'+
      added.map(function(e){
        const sc=slotCounts(e);
        return '<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid rgba(75,163,220,.08)">'+
          '<span style="font-weight:800">'+esc(e.name)+'</span>'+
          '<span style="font-size:12px;color:var(--dm)">'+esc(fmtShort(e.date))+'</span>'+
          '<span style="margin-left:auto;font-size:12px;color:var(--dm)">'+sc.assigned+' slot'+(sc.assigned===1?'':'s')+' filled'+
          (sc.missing?' \u00b7 <b style="color:var(--gold-lt)">'+sc.missing+' open</b>':'')+'</span></div>';
      }).join('')+'</div></div>';
  }

  h+='<div class="tw"><div class="tw-scroll"><table><thead><tr><th>Member</th>'+
    '<th>Duties this cycle</th><th>Last 3 cycles</th><th>Last cycle</th><th>Total</th><th></th></tr></thead><tbody>';
  rows.forEach(r=>{
    const flag = r.d.cyc>=mean+2 ? '<span class="bdg bdg-warn" style="margin-left:7px">carrying more</span>'
               : r.d.cyc<=mean-2 ? '<span class="bdg bdg-no" style="margin-left:7px">barely used</span>' : '';
    h+='<tr style="cursor:pointer" onclick="repMember='+r.m.id+';renderReports()" title="See every duty '+esc(r.m.name)+' has done">'+
       '<td style="font-weight:800">'+esc(r.m.name)+flag+'</td>'+
       '<td class="num" style="font-weight:900">'+r.d.cyc+'</td>'+
       '<td class="num" style="font-weight:800;color:var(--blue-lt)">'+r.d.recent+'</td>'+
       '<td class="num">'+r.d.prev+'</td>'+
       '<td class="num">'+r.d.total+'</td>'+
       '<td style="color:var(--blue-lt);font-weight:800">View \u2192</td></tr>';
  });
  return h+'</tbody></table></div></div>'+
    '<div class="ib" style="margin-top:12px">Click anyone to see how often they have done each duty. This page redraws itself whenever a roster changes on any device.</div>';
}

function renderLeaderboard(){
  const ds=dutyStats(null);
  const active=MEMBERS.filter(m=>m.status==='active');
  // Every duty anyone has actually done, so the list reflects reality
  // rather than the full catalogue of duties that may never be used.
  const duties=new Set();
  Object.keys(ds).forEach(id=>Object.keys(ds[id].byDuty||{}).forEach(d=>duties.add(d)));
  const dutyList=Array.from(duties).sort();
  if(!dutyList.length) return '<div class="empty-note">No duties have been assigned yet.</div>';
  if(!lbDuty || dutyList.indexOf(lbDuty)<0) lbDuty=dutyList[0];

  let h='<div class="pnl" style="margin-bottom:14px"><div class="pnl-b" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">'+
    '<label class="flabel" style="margin:0">Duty</label>'+
    '<select onchange="lbDuty=this.value;renderReports()" style="min-width:240px">'+
      dutyList.map(d=>'<option'+(d===lbDuty?' selected':'')+'>'+esc(d)+'</option>').join('')+'</select>'+
    '<label class="flabel" style="margin:0">Sort</label>'+
    '<select onchange="lbSort=this.value;renderReports()">'+
      [['count','Most done first'],['least','Least done first'],['name','Name A\u2013Z']]
        .map(o=>'<option value="'+o[0]+'"'+(lbSort===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+
    '</select></div></div>';

  const rows=active.map(m=>({m:m,n:((ds[m.id]||{byDuty:{}}).byDuty||{})[lbDuty]||0}));
  if(lbSort==='name') rows.sort((a,b)=>a.m.name.localeCompare(b.m.name));
  else if(lbSort==='least') rows.sort((a,b)=>a.n-b.n||a.m.name.localeCompare(b.m.name));
  else rows.sort((a,b)=>b.n-a.n||a.m.name.localeCompare(b.m.name));
  const max=Math.max.apply(null,rows.map(r=>r.n).concat([0]));

  h+='<div class="tw"><div class="pnl-h">'+esc(lbDuty)+' <span class="ct">'+
     rows.reduce((t,r)=>t+r.n,0)+' times, across '+rows.filter(r=>r.n).length+' people</span></div><div class="pnl-b">';
  rows.forEach(function(r,i){
    h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;opacity:'+(r.n?1:.45)+'">'+
       '<div class="num" style="width:26px;color:var(--dm);font-weight:800">'+(lbSort==='name'?'':(i+1))+'</div>'+
       '<div style="width:190px;font-size:13px;font-weight:800">'+esc(r.m.name)+'</div>'+
       '<div style="flex:1;background:var(--ds2);border-radius:5px;height:18px;overflow:hidden">'+
         '<div style="width:'+(max&&r.n?Math.max(r.n/max*100,3):0)+'%;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-lt))"></div></div>'+
       '<div class="num" style="width:36px;font-weight:900">'+r.n+'</div></div>';
  });
  return h+'</div></div>';
}

function reportCSV(k){
  const active=MEMBERS.filter(m=>m.status==='active');
  const q=s2=>'"'+String(s2==null?'':s2).replace(/"/g,'""')+'"';

  if(repMode==='leaderboard'){
    const ds=dutyStats(null);
    let out='Member,'+q(lbDuty)+'\n';
    active.forEach(m=>{ out+=[q(m.name), ((ds[m.id]||{byDuty:{}}).byDuty||{})[lbDuty]||0].join(',')+'\n'; });
    return out;
  }
  if(repMode==='fairness'){
    const ds=dutyStats(k);
    /* Same columns as the table, in the same order, including the three-cycle
       window — a CSV that disagrees with the page it was exported from is
       worse than no CSV. */
    let out='Member,Duties this cycle,Last 3 cycles,Duties last cycle,Duty days completed in total\n';
    active.forEach(m=>{ const d=ds[m.id]||{total:0,cyc:0,prev:0,recent:0};
      out+=[q(m.name),d.cyc,d.recent,d.prev,d.total].join(',')+'\n'; });
    return out;
  }
  // Attendance: the same three headline numbers the table shows, so the
  // export and the screen cannot disagree.
  const ds=dutyStats(k);
  let out='Member,Attendance rate %,Lateness rate %,Duty days completed,Present,Late,Justified,Not present\n';
  active.forEach(m=>{
    const st=attendanceStats(m.id,k), d=ds[m.id]||{total:0};
    out+=[q(m.name), st.rate==null?'':st.rate, st.lateness==null?'':st.lateness,
          d.total, st.P, st.L, st.J, st.N].join(',')+'\n';
  });
  return out;
}

async function postAnn(){
  const ta=document.getElementById('annNew'); const text=(ta&&ta.value||'').trim();
  if(!text) return toast('Write something first','err');
  const row={team:PAGE_TEAM,text:text,author:CU.display||CU.user};
  if(!sb){ toast('Could not post announcement — no database connection','err'); return; }
  pauseRT(1500);
  /* The stored row goes into ANNS, not a hand-made copy of it. The edit
     and delete buttons address an announcement by id, and a locally
     invented one points at a row that has never existed. */
  const rows=await dbWriteRows('Posting the announcement', ()=>sb.from('announcements').insert(row));
  if(!rows) return;
  ANNS.unshift(rows[0]);
  auditLog('post','announcements',text.slice(0,120)); renderAnnouncements(); toast('Announcement posted');
}
/* Editing and deleting an announcement both changed ANNS first, wrote
   without looking at the answer, and toasted green regardless. An
   announcement is the one thing on this page every volunteer reads: a
   lead correcting a venue an hour before Majlis saw "Announcement
   updated" and three hundred people kept reading the old one. */
async function saveAnnEdit(id){
  const ta=document.getElementById('annEdit_'+id); const text=(ta&&ta.value||'').trim();
  if(!text) return toast('Announcement cannot be empty','err');
  const a=ANNS.find(x=>x.id===id); if(!a) return;
  if(!sb){ toast('Could not update announcement — no database connection','err'); return; }
  pauseRT(1500);
  if(!await dbWrite('Updating the announcement', ()=>
      sb.from('announcements').update({text:text}).eq('id',id))) return;
  a.text=text; annEditing=null;
  auditLog('edit','announcements',text.slice(0,120));
  renderAnnouncements(); toast('Announcement updated');
}
function deleteAnn(id){ oM('<h3>Delete announcement</h3><p style="font-size:14px;color:var(--dm)">This removes it for everyone.</p><div class="macts"><button class="btn btn-ol" onclick="cM()">Cancel</button><button class="btn btn-da" onclick="doDeleteAnn('+id+')">Delete</button></div>'); }
async function doDeleteAnn(id){
  cM();
  if(!sb){ toast('Could not delete announcement — no database connection','err'); return; }
  pauseRT(1500);
  if(!await dbWrite('Deleting the announcement', ()=>
      sb.from('announcements').delete().eq('id',id))) return;
  ANNS=ANNS.filter(a=>a.id!==id);
  auditLog('delete','announcements','id '+id);
  renderAnnouncements(); toast('Announcement deleted');
}

function ensureH2C(){
  return new Promise((res,rej)=>{
    if(window.html2canvas) return res();
    const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    s.onload=()=>res(); s.onerror=()=>rej(new Error('html2canvas failed to load')); document.head.appendChild(s);
  });
}
function rosterLines(ev){
  const data=ROSTERS[ev.id]||{assign:{}}; const duties=dutiesForEvent(ev);
  const mk=(name,sec,a)=>{ a=a||{m:[],f:[],x:[]}; const male=(a.m||[]).map(p=>p.name),female=(a.f||[]).map(p=>p.name);
    (a.x||[]).forEach(p=>{ const mem=memById(p.id); ((mem&&mem.gender)==='Female'?female:male).push(p.name); }); return {sec:sec,name:name,male:male,female:female}; };
  const lines=duties.filter(d=>d.section!=='mph').map(d=>mk(d.name,'core',data.assign&&data.assign[d.key]));
  const known=new Set(duties.map(d=>d.key));
  for(const key in (data.assign||{})){ if(known.has(key)||!people(data.assign[key]).length) continue; lines.push(mk(legacyLabel(key),'core',data.assign[key])); }
  duties.filter(d=>d.section==='mph').forEach(d=>lines.push(mk(d.name,'mph',data.assign&&data.assign[d.key])));
  return lines;
}
function ordN(n){ const t=n%100; if(t>=11&&t<=13) return n+'th'; return n+({1:'st',2:'nd',3:'rd'}[n%10]||'th'); }
function sheetTitle(prefix,ev){
  const d=new Date(ev.date+'T12:00:00');
  return prefix+' - '+d.toLocaleDateString('en-NZ',{weekday:'long'})+', '+ordN(d.getDate())+' '+
         d.toLocaleDateString('en-NZ',{month:'long'})+' '+d.getFullYear()+': '+TEAM_NAME;
}
/* Title across the top of the exported sheet, matching the printed roster:
   "Team A - Friday Majlis - 11th September 2026 (Casual Uniform)" */
function rxTitle(ev){
  const d=new Date(ev.date+'T12:00:00');
  return TEAM_NAME+' - '+ev.name+' - '+ordN(d.getDate())+' '+
         d.toLocaleDateString('en-NZ',{month:'long'})+' '+d.getFullYear()+
         ' ('+(ev.uniform||'Casual')+' Uniform)';
}
async function exportPNG(){
  const ev=selEvent(); if(!ev) return; toast('Rendering image\u2026');

    const lines=rosterLines(ev);

    // Names read as "A / B / C", and an unfilled slot as a dash, exactly as
    // the printed roster does.
    const row=l=>{
      const m=l.male.join(' / '), f=l.female.join(' / ');
      return '<tr><td class="rx-d">'+esc(recName(l.name))+'</td>'+
             '<td class="rx-n'+(m?'':' none')+'">'+(m?esc(m):'-')+'</td>'+
             '<td class="rx-n'+(f?'':' none')+'">'+(f?esc(f):'-')+'</td></tr>';
    };
    let h='<div class="rx" id="expCard">'+
      '<div class="rx-head"><img class="rx-logo" src="'+(window.IV_LOGO||'logo.png')+'" alt="">'+
      '<div class="rx-org">Ismaili Volunteers<b>Auckland Jamatkhana</b></div></div>'+
      '<div class="rx-title">'+esc(rxTitle(ev))+'</div>'+
      '<table class="rx-t"><thead><tr><th>Duty</th><th>Male</th><th>Female</th></tr></thead><tbody>'+

    // REC (MPH) Congregation continues the same table under its own banner,

      h+='<tr><td class="rx-sub" colspan="3">REC Congregation</td></tr>'+rec.map(row).join('');
    }
    h+='</tbody></table>'+
       '<div class="rx-ft"><span>'+esc(TEAM_NAME)+' \u00b7 '+(ev.confirmed?'Confirmed':'Draft')+'</span>'+
       '<span>IV Hub \u00b7 '+esc(fmtNice(nzTodayISO()))+'</span></div></div>';
    stage.innerHTML=h;
    const card=document.getElementById('expCard');
    await fontsSettled();

    const a=document.createElement('a');
    a.download='Team'+PAGE_TEAM+'-'+String(ev.name).replace(/[^A-Za-z0-9]/g,'')+'-'+ev.date+'.png';
    a.href=canvas.toDataURL('image/png'); a.click();

async function clip(text){ try{ if(navigator.clipboard&&navigator.clipboard.writeText) await navigator.clipboard.writeText(text); else { const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); } return true; }catch(e){ console.warn(e); return false; } }
async function copyRoster(){
  const ev=selEvent()||EVENTS.find(e=>e.id===selEventId); if(!ev) return;

  toast(await clip(out)?'Copied — ready for WhatsApp':'Copy failed',(await clip(out))?'ok':'err');

async function copyMemberDuties(id){
  const m=memById(id); if(!m) return; const upc=memberUpcomingDuties(id);
  let out='*'+m.name+' — upcoming '+TEAM_NAME+' duties*\n';
  if(!upc.length) out+='No upcoming duties scheduled.\n';
  upc.forEach(u=>{ out+=fmtNice(u.ev.date)+' ('+u.ev.name+'): '+u.duties.join(', ')+'\n'; });
  toast(await clip(out)?'Member duties copied':'Copy failed',(await clip(out))?'ok':'err');

function memberUpcomingDuties(memberId){
  const today=nzTodayISO(); const out=[];
  EVENTS.filter(e=>e.date>=today).sort((a,b)=>a.date<b.date?-1:1).forEach(ev=>{
    const r=ROSTERS[ev.id]; if(!r||!r.assign) return; const duties=[];
    for(const key in r.assign){ for(const p of people(r.assign[key])){ if(p.id===memberId){ duties.push(KEY_TO_NAME[key]||legacyLabel(key)); } } }
    if(duties.length) out.push({ev:ev,duties:duties});
  });
  return out;
}

/* The webfont must be rasterised, not merely requested, before a capture —
   html2canvas draws whatever is loaded at that instant, so a slow font
   would silently produce an image in the fallback face. Capped so a
   blocked CDN degrades to a fallback image rather than hanging. */
async function fontsSettled(ms){
  try{
    await Promise.race([(document.fonts&&document.fonts.ready)||Promise.resolve(),
                        new Promise(r=>setTimeout(r,ms||3000))]);
    if(document.fonts&&document.fonts.load){
      await Promise.race([
        Promise.all([400,500,600,700,800,900].map(w=>document.fonts.load(w+" 16px Archivo"))),
        new Promise(r=>setTimeout(r,ms||3000))]);
    }
  }catch(e){}
}

/* ── DESKTOP TOP NAVIGATION ──────────────────────────────────────────
   Reads the sidebar and mirrors it into the top bar. Items before the
   first section heading sit directly on the bar; each heading becomes a
   dropdown holding the items that follow it.

   Clicks are forwarded to the original sidebar element rather than
   reimplemented, so every existing handler, router and permission check
   keeps working untouched. A hidden sidebar item produces no top-nav
   entry, and a section whose items are all hidden produces no dropdown.

   A MutationObserver keeps the two in step: the pages toggle nav items as
   permissions load and as the active page changes, and there is no single
   hook in all four files to attach to. Reading only, so it cannot loop. */
(function(){
  var built=false, pending=null;
  // Deliberately NOT offsetParent: above 1101px the sidebar this reads from
  // is itself display:none, which would make every item look hidden and
  // leave the bar empty. A descendant of a hidden element still reports its
  // own computed display, so that is what the permission code's hiding
  // actually shows up in.
  function vis(el){ return !!el && !el.hidden && getComputedStyle(el).display!=='none'; }
  function mk(tag,cls,html){ var e=document.createElement(tag); e.className=cls; if(html!=null) e.innerHTML=html; return e; }

  function entry(src){
    var b=mk('button','tn-b'+(src.classList.contains('hub-link')?' tn-hub':''),src.innerHTML);
    if(src.classList.contains('active')) b.classList.add('on');
    b.addEventListener('click',function(ev){
      ev.stopPropagation(); closeAll();
      // Fire the real sidebar element so its own handler runs.
      if(src.tagName==='A'&&src.getAttribute('href')) (window.ivGo||function(u){location.href=u;})(src.getAttribute('href'));
      else src.click();
    });
    return b;
  }

  function closeAll(){
    var g=document.querySelectorAll('.tn-group.open');
    for(var i=0;i<g.length;i++) g[i].classList.remove('open');
  }

  function build(){
    var bar=document.getElementById('topnav'), nav=document.querySelector('.sb-nav');
    if(!bar||!nav) return;
    var row=mk('div','tn-row'); var group=null, groupBtn=null, groupMenu=null, groupHas=false;

    function flush(){
      if(group&&groupHas) row.appendChild(group);
      group=null; groupBtn=null; groupMenu=null; groupHas=false;
    }
    var kids=nav.children;
    for(var i=0;i<kids.length;i++){
      var el=kids[i];
      if(el.classList.contains('nav-sec')){
        flush();
        if(!vis(el)) continue;
        group=mk('div','tn-group');
        var secName=el.textContent.trim();
        groupBtn=mk('button','tn-b'+(/^management$/i.test(secName)?' tn-mgmt':''),
                    secName+'<span class="tn-caret">▾</span>');
        groupMenu=mk('div','tn-menu');
        /* Opens on hover, and still on click for touch screens and
           keyboards, which have no hover at all. A short delay on leaving
           stops the menu snapping shut when the pointer clips a corner on
           its way down. */
        (function(g,b){
          var shut;
          function open(){ clearTimeout(shut); closeAll(); g.classList.add('open'); }
          function later(){ clearTimeout(shut); shut=setTimeout(function(){ g.classList.remove('open'); }, 220); }
          g.addEventListener('mouseenter', open);
          g.addEventListener('mouseleave', later);
          b.addEventListener('click', function(ev){
            ev.stopPropagation();
            g.classList.contains('open') ? g.classList.remove('open') : open();
          });
        })(group,groupBtn);
        group.appendChild(groupBtn); group.appendChild(groupMenu);
      } else if(el.classList.contains('nav-item')||el.classList.contains('hub-link')){
        // hub-link is the cross-page "Back to Hub" anchor. It lives in the
        // same nav but carries its own class, and skipping it left the AV
        // and Team pages with no way back to the Hub once the sidebar was
        // hidden — the only exit was the browser's back button.
        if(!vis(el)) continue;
        if(group){ groupMenu.appendChild(entry(el)); groupHas=true;
                   if(el.classList.contains('active')) groupBtn.classList.add('on'); }
        else row.appendChild(entry(el));
      }
    }
    flush();
    bar.innerHTML='';
    var brand=mk('div','tn-brand','');
    var logo=document.querySelector('.sb-logo-img, .sb-logo img, .sidebar img');
    if(logo){ var im=document.createElement('img'); im.src=logo.getAttribute('src')||''; im.alt=''; brand.appendChild(im); }
    var h2=document.querySelector('.sb-logo h2, .sidebar h2');
    var _bt=h2?h2.textContent.trim():'IV Hub';
    if(window.CAN_SWITCH_TEAM&&window.CAN_SWITCH_TEAM()){
      /* Leaders who can see both teams get the team name as a switcher. */
      var sw=mk('span','tn-team','');
      sw.textContent=_bt.replace(/\s*\u25be$/,'')+' \u25be';
      sw.title='Switch team';
      sw.setAttribute('role','button'); sw.setAttribute('tabindex','0');
      sw.addEventListener('click',function(ev){ ev.stopPropagation(); closeAll(); openTeamSwitch(); });
      sw.addEventListener('keydown',function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); ev.stopPropagation(); closeAll(); openTeamSwitch(); } });
      brand.appendChild(sw);
    } else brand.appendChild(document.createTextNode(_bt));
    /* The brand doubles as the way home, so the pages do not each need a
       Dashboard item taking up a slot in the bar. */
    var home=document.querySelector('.sb-nav .nav-item[data-page="'+(window.IS_EDIT?'calendar':'dashboard')+'"]');
    if(home){
      brand.title='Go to the calendar';
      brand.setAttribute('role','button'); brand.setAttribute('tabindex','0');
      brand.addEventListener('click',function(ev){ ev.stopPropagation(); closeAll(); home.click(); });
      brand.addEventListener('keydown',function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); home.click(); } });
    }
    bar.appendChild(brand); bar.appendChild(row);
    var right=mk('div','tn-right');

    /* Signing out lives in the sidebar footer, outside .sb-nav, and the
       three pages each do it differently — a button, an icon button, a
       span with an onclick. Hiding the sidebar took all of them with it,
       so a desktop user had no way to sign out at all. Whichever one this
       page has gets mirrored here and forwarded to the original, so the
       real handler still runs. */
    // Each page names this element differently; the last selector is the
    // structural fallback for any page that names it something new.
    var who=document.querySelector('.sidebar #tbName, .sidebar #unm,'
      +' .sidebar .uinfo .n, .sidebar .uchip .n, .sidebar .uinfo > div');
    var name=(who&&who.textContent.trim())||(window.CU&&(CU.display||CU.user))||'';
    if(name) right.appendChild(mk('span','tn-who',name));

    var out=document.querySelector('.sidebar #btnLogout, .sidebar .sb-signout, .sidebar .uout,'
      +' .sidebar [onclick*="signOut"], .sidebar [onclick*="logout"]');
    if(out){
      var so=mk('button','tn-out','Sign out');
      so.title='Sign out of the IV Hub';
      so.addEventListener('click',function(ev){ ev.stopPropagation(); out.click(); });
      right.appendChild(so);
    }

    var tog=mk('button','tn-tog','Hide menu \u2303');
    tog.title='Hide the menu bar';
    tog.addEventListener('click',function(ev){ ev.stopPropagation(); setHidden(true); });
    right.appendChild(tog);
    bar.appendChild(right);
    built=true;
  }

  /* Kept in localStorage so the choice survives a reload, but the bar is
     shown unless it was explicitly hidden — a missing or unreadable value
     always means visible. */
  var KEY='ivhub_topnav_hidden';
  function setHidden(h){
    document.body.classList.toggle('tn-hidden',!!h);
    try{ h?localStorage.setItem(KEY,'1'):localStorage.removeItem(KEY); }catch(e){}
  }
  function restore(){
    var h=false; try{ h=localStorage.getItem(KEY)==='1'; }catch(e){}
    document.body.classList.toggle('tn-hidden',h);
    if(!document.querySelector('.tn-show')){
      var s=mk('button','tn-show','\u2630 Menu');
      s.title='Show the menu bar';
      s.addEventListener('click',function(ev){ ev.stopPropagation(); setHidden(false); });
      document.body.appendChild(s);
    }
  }

  function schedule(){ clearTimeout(pending); pending=setTimeout(build,80); }

  function start(){
    var nav=document.querySelector('.sb-nav'); if(!nav) return;
    restore();
    build();
    try{
      new MutationObserver(schedule).observe(nav.closest('.sidebar')||nav,
        {childList:true,subtree:true,attributes:true,attributeFilter:['class','style','hidden']});
    }catch(e){}
    document.addEventListener('click',closeAll);
    window.addEventListener('resize',schedule);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start);
  else start();
})();
</script>
<script>
/* Pointer light for cards (see the motion layer). One listener for the whole
   page, at most one style write per frame, and only for a precise pointer
   with motion allowed; otherwise it never attaches. */
(function(){
  if(!window.matchMedia||!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var SEL='.sc,.mem-card,.cy-card', ev=null, raf=0;
  document.addEventListener('pointermove',function(e){
    ev=e; if(raf) return;
    raf=requestAnimationFrame(function(){
      raf=0; var el=ev.target&&ev.target.closest&&ev.target.closest(SEL); if(!el) return;
      var r=el.getBoundingClientRect();
      el.style.setProperty('--mx',(ev.clientX-r.left).toFixed(0)+'px');
      el.style.setProperty('--my',(ev.clientY-r.top).toFixed(0)+'px');
    });
  },{passive:true});
})();
</script>
<script>
/* Opening animation. Plays every time the Hub, Team A, Team B or the AV Team
   page is opened, then gets out of the way. Tap, click, Enter or Esc
   (or the Skip button) jumps straight in. Never plays for people who have
   asked their device for reduced motion. */
(function(){
  var CFG = {
    hub: {acc:'#4BA3DC', kick:'', l1:'Ya Ali', l2:'Madad', sub:'IV Hub · Auckland Jamatkhana'},
    A:   {acc:'#86E49A', kick:'Welcome to', l1:'Team ', l2:'A',  sub:'IV Hub · Auckland Jamatkhana', mono:'A'},
    B:   {acc:'#EE6F5C', kick:'Welcome to', l1:'Team ', l2:'B',  sub:'IV Hub · Auckland Jamatkhana', mono:'B'},
    AV:  {acc:'#5FA383', kick:'Welcome to', l1:'AV ', l2:'Team', sub:'IV Hub · Auckland Jamatkhana', mono:'AV'}
  };
  var CSS = '.ivs{position:fixed;inset:0;z-index:2147483000;overflow:hidden;background:transparent;font-family:Archivo,system-ui,sans-serif;color:#E8F4FD;--acc:#4BA3DC}'+
  '.ivs *{box-sizing:border-box}'+
  '.ivs-sh{position:absolute;left:0;right:0;height:50%;background:#020B18}'+
  '.ivs-t{top:0;animation:ivsT 1s cubic-bezier(.76,0,.24,1) 3.7s both}.ivs-b{bottom:0;animation:ivsB 1s cubic-bezier(.76,0,.24,1) 3.7s both}'+
  '@keyframes ivsT{to{transform:translateY(-101%)}}@keyframes ivsB{to{transform:translateY(101%)}}'+
  '.ivs-t::after,.ivs-b::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--acc);opacity:0;animation:ivsSeam 1s ease-out 3.7s both}'+
  '.ivs-t::after{bottom:0}.ivs-b::after{top:0}@keyframes ivsSeam{0%{opacity:1}100%{opacity:0}}'+
  '.ivs-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vmin;animation:ivsOut .7s cubic-bezier(.55,0,.75,.2) 3.6s both}'+
  '@keyframes ivsOut{0%{opacity:1;transform:none}100%{opacity:0;transform:scale(1.07)}}'+
  '.ivs-hair{position:absolute;top:0;bottom:0;width:1px;background:color-mix(in srgb,var(--acc) 12%,transparent);transform-origin:top;animation:ivsHair 1.2s cubic-bezier(.16,1,.3,1) both}'+
  '@keyframes ivsHair{from{transform:scaleY(0)}}'+
  '.ivs-ax{position:absolute;left:0;right:0;top:50%;height:1px;background:color-mix(in srgb,var(--acc) 50%,transparent);transform-origin:left;animation:ivsAx 1.1s cubic-bezier(.76,0,.24,1) .15s both}'+
  '@keyframes ivsAx{from{transform:scaleX(0)}}'+
  '.ivs-mono{position:absolute;right:-2vw;bottom:-14vh;font-size:min(620px,62vh);font-weight:900;line-height:1;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:2px color-mix(in srgb,var(--acc) 40%,transparent);opacity:.5;animation:ivsMono 1.6s cubic-bezier(.16,1,.3,1) .5s both}'+
  '@keyframes ivsMono{from{opacity:0;transform:translateX(120px)}}'+
  '.ivs-glow{position:absolute;left:50%;top:38%;width:min(540px,90vw);height:min(540px,90vw);margin:calc(min(540px,90vw)/-2) 0 0 calc(min(540px,90vw)/-2);border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--acc) 38%,transparent),transparent);animation:ivsGlow 1.6s cubic-bezier(.16,1,.3,1) .9s both}'+
  '@keyframes ivsGlow{from{opacity:0;transform:scale(.3)}60%{opacity:1}to{opacity:.55;transform:scale(1)}}'+
  '.ivs-mark{position:relative;width:min(176px,40vw);height:min(176px,40vw);display:flex;align-items:center;justify-content:center;flex-shrink:0}'+
  '.ivs-mark img{width:68%;height:68%;border-radius:50%;background:#fff;box-shadow:0 0 0 6px #020B18,0 18px 60px color-mix(in srgb,var(--acc) 55%,transparent);animation:ivsLogo 1s cubic-bezier(.16,1,.3,1) .65s both}'+
  '@keyframes ivsLogo{from{opacity:0;transform:scale(.4) rotate(-90deg)}}'+
  '.ivs-mark svg{position:absolute;inset:0;width:100%;height:100%}'+
  '.ivs-mark circle{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:497;stroke-dashoffset:0;transform-origin:center;transform:rotate(-90deg);animation:ivsRing 1.1s cubic-bezier(.76,0,.24,1) .45s both}'+
  '@keyframes ivsRing{from{stroke-dashoffset:497}}'+
  '.ivs-words{text-align:center;max-width:100vw;padding:0 4vw}'+
  '.ivs-kick{font-size:min(18px,4.4vw);font-weight:800;letter-spacing:.5em;text-transform:uppercase;color:#7AAECB;margin-bottom:1.6vmin;padding-left:.5em;animation:ivsKick 1s cubic-bezier(.16,1,.3,1) 1.2s both}'+
  '@keyframes ivsKick{from{opacity:0;letter-spacing:1em}}'+
  '.ivs-mask{overflow:hidden;padding:.06em 0 .02em}'+
  '.ivs-w{display:block;font-weight:900;line-height:1.02;letter-spacing:-.03em;text-transform:uppercase;color:#fff;white-space:nowrap;animation:ivsUp .9s cubic-bezier(.16,1,.3,1) 1.5s both}'+
  '.ivs-w b{color:var(--acc);font-weight:900}'+
  '.ivs-team .ivs-w{font-size:min(150px,17vw)}.ivs-hub .ivs-w{font-size:min(124px,21vw)}'+
  '.ivs-hub .ivs-w.two{color:var(--acc);animation-delay:1.65s}'+
  '@keyframes ivsUp{from{transform:translateY(112%)}}'+
  '.ivs-rule{width:min(84px,16vw);height:4px;margin:2.6vmin auto 0;background:var(--acc);transform-origin:center;animation:ivsRule .6s cubic-bezier(.76,0,.24,1) 2.4s both}'+
  '@keyframes ivsRule{from{transform:scaleX(0)}}'+
  '.ivs-sub{margin-top:2.4vmin;font-size:min(15px,3vw);font-weight:800;letter-spacing:.38em;text-transform:uppercase;color:#7AAECB;padding-left:.38em;animation:ivsSub 1s cubic-bezier(.16,1,.3,1) 2.55s both}'+
  '@keyframes ivsSub{from{opacity:0;letter-spacing:.8em}}'+
  '.ivs-load{position:absolute;left:50%;bottom:11vh;width:min(240px,56vw);height:3px;margin-left:calc(min(240px,56vw)/-2);background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;opacity:0;animation:ivsLF 1.3s linear 2.4s both}'+
  '.ivs-load i{display:block;height:100%;background:var(--acc);transform-origin:left;animation:ivsFill 1.1s cubic-bezier(.45,0,.2,1) 2.5s both}'+
  '@keyframes ivsFill{from{transform:scaleX(0)}}@keyframes ivsLF{0%{opacity:0}15%,85%{opacity:1}100%{opacity:0}}'+
  '.ivs-skip{position:absolute;right:20px;bottom:20px;z-index:3;min-height:44px;min-width:44px;padding:0 20px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(7,22,40,.88);color:#E8F4FD;font:800 14px Archivo,system-ui,sans-serif;cursor:pointer}'+
  '.ivs-skip:hover{border-color:#fff}.ivs-skip:focus-visible{outline:2px solid #FCD34D;outline-offset:2px}'+
  '.ivs-fast *{animation-delay:0s!important;animation-duration:.001s!important}'+
  '@media (max-height:560px){.ivs-mark{width:min(110px,30vh);height:min(110px,30vh)}.ivs-team .ivs-w{font-size:min(110px,13vw,22vh)}.ivs-hub .ivs-w{font-size:min(100px,16vw,20vh)}}';

  /* Plays every time the page is opened. This only stops it starting twice
     within one page load (the Hub can run its sign-in code more than once). */
  var seen = {};
  function played(k){ return !!seen[k]; }
  function mark(k){ seen[k] = true; }

  window.ivSplash = function(key){
    var c = CFG[key]; if(!c || played(key)) return;
    mark(key);
    if(navigator.webdriver && !window.__ivsForce) return;   // automated browsers (tests) skip it
    try{ if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch(e){}
    if(document.getElementById('ivs')) return;
    var st = document.createElement('style'); st.id = 'ivs-css'; st.textContent = CSS; document.head.appendChild(st);
    var logo = window.IV_LOGO || 'logo.png';
    var el = document.createElement('div'); el.id = 'ivs'; el.className = 'ivs ' + (key === 'hub' ? 'ivs-hub' : 'ivs-team');
    el.style.setProperty('--acc', c.acc);
    el.setAttribute('aria-hidden','true');
    var words = key === 'hub'
      ? '<div class="ivs-mask"><span class="ivs-w">'+c.l1+'</span></div><div class="ivs-mask"><span class="ivs-w two">'+c.l2+'</span></div>'
      : '<div class="ivs-kick">'+c.kick+'</div><div class="ivs-mask"><span class="ivs-w">'+c.l1+'<b>'+c.l2+'</b></span></div>';
    el.innerHTML =
      '<div class="ivs-sh ivs-t"></div><div class="ivs-sh ivs-b"></div>'+
      '<div class="ivs-in">'+
        '<div class="ivs-hair" style="left:12.5%;animation-delay:.1s"></div><div class="ivs-hair" style="left:37.5%;animation-delay:.2s"></div>'+
        '<div class="ivs-hair" style="left:62.5%;animation-delay:.3s"></div><div class="ivs-hair" style="left:87.5%;animation-delay:.4s"></div>'+
        '<div class="ivs-ax"></div>'+(c.mono?'<div class="ivs-mono">'+c.mono+'</div>':'')+'<div class="ivs-glow"></div>'+
        '<div class="ivs-mark"><svg viewBox="0 0 176 176"><circle cx="88" cy="88" r="79"/></svg><img alt="" src="'+logo+'"></div>'+
        '<div class="ivs-words">'+words+'<div class="ivs-rule"></div><div class="ivs-sub">'+c.sub+'</div></div>'+
        '<div class="ivs-load"><i></i></div>'+
      '</div>';
    var skip = document.createElement('button'); skip.type = 'button'; skip.className = 'ivs-skip'; skip.textContent = 'Skip';
    el.appendChild(skip);
    document.body.appendChild(el);
    var done = false, t1, t2;
    function end(){ if(done) return; done = true; clearTimeout(t1); clearTimeout(t2); document.removeEventListener('keydown', onKey, true); el.remove(); var s = document.getElementById('ivs-css'); if(s) s.remove(); }
    function fast(){ if(done) return; el.classList.add('ivs-fast'); clearTimeout(t1); clearTimeout(t2); t2 = setTimeout(end, 120); }
    function onKey(e){ if(e.key === 'Escape' || e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fast(); } }
    el.addEventListener('click', fast); skip.addEventListener('click', function(e){ e.stopPropagation(); fast(); });
    document.addEventListener('keydown', onKey, true);
    t1 = setTimeout(end, 4900);
  };
  window.ivSplashReset = function(){ seen = {}; };
})();
</script>

<script>
/* If this browser kept an old copy of the page, say so. The page is asked for
   again without the cache; when the server's copy is newer than the one
   running, a bar offers a refresh. Silent on any failure. */
(function(){
  try{
    var mine = Date.parse(document.lastModified);
    if(!window.fetch || !mine) return;
    fetch(location.pathname, {method:'HEAD', cache:'no-store'}).then(function(r){
      var theirs = Date.parse(r.headers.get('last-modified') || '');
      if(!theirs || theirs - mine < 5000) return;
      var bar = document.createElement('div');
      bar.setAttribute('role','status');
      bar.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 14px;background:#F59E0B;color:#111;font:800 14px/1.3 Archivo,system-ui,sans-serif;box-shadow:0 4px 18px rgba(0,0,0,.4)';
      bar.innerHTML = '<span>A newer version of this page is available.</span>';
      var b = document.createElement('button');
      b.textContent = 'Refresh now';
      b.style.cssText = 'min-height:38px;padding:0 16px;border:0;border-radius:999px;background:#111;color:#FCD34D;font:inherit;cursor:pointer';
      b.onclick = function(){ location.reload(); };
      bar.appendChild(b); document.body.appendChild(bar);
    }).catch(function(){});
  }catch(e){}
})();
</script>
