let _rtT=null;
/* A reload replaces everything held here with what the database has.
   That is right for somebody else's change and wrong for our own work
   that never stored — which is how a failed save came to look like a
   deletion. Anything unsaved is put back afterwards and stays flagged. */
function rtReload(){ if(_rtT)clearTimeout(_rtT); _rtT=setTimeout(async()=>{
  await loadAll(); await loadCovering(); CYCLES=buildCycles();
  Object.keys(ROSTER_UNSAVED).forEach(id=>{ ROSTERS[id]=ROSTER_UNSAVED[id]; });
  renderSaveWarning(); renderCurrent(); },350); }

/* ── COUNTS / FAIRNESS ── */
function computeCounts(k,excludeEventId){
  const cyc={},all={},last={},recent={};
  for(const ev of EVENTS){
    if(excludeEventId!=null&&ev.id===excludeEventId) continue;
    const r=ROSTERS[ev.id]; if(!r||!r.assign) continue;
    for(const key in r.assign){
      const a=r.assign[key]; if(!a) continue;
      for(const p of people(a)){
        if(p.id==null) continue;
        all[p.id]=(all[p.id]||0)+1;
        if(!last[p.id]||ev.date>last[p.id]) last[p.id]=ev.date;
        if(k!=null&&inCycleK(ev.date,k)) cyc[p.id]=(cyc[p.id]||0)+1;
        // Carry fairness across cycles: someone who missed out recently
        // should come first when this cycle's counts are level. Three
        // cycles is deliberate — long enough to even out a run of bad
        // luck, short enough that a new member is not picked for
        // everything for weeks the way a lifetime total would do.
        if(k!=null&&inCycleK(ev.date,k-1)||k!=null&&inCycleK(ev.date,k-2)||k!=null&&inCycleK(ev.date,k-3))
          recent[p.id]=(recent[p.id]||0)+1;
      }
    }
  }
  return {cyc:cyc,all:all,last:last,recent:recent};
}
// id → Set(duty display names) held this cycle (persisted + already-generated events)
function cycleDutyHistory(k,excludeEventId){
  const hist={};
  for(const ev of EVENTS){
    if(excludeEventId!=null&&ev.id===excludeEventId) continue;
    if(!inCycleK(ev.date,k)) continue;
    const r=ROSTERS[ev.id]; if(!r||!r.assign) continue;
    for(const key in r.assign){
      const nm=KEY_TO_NAME[key]; if(!nm) continue;
      for(const p of people(r.assign[key])){
        if(p.id==null) continue;
        (hist[p.id]=hist[p.id]||new Set()).add(nm);
      }
    }
  }
  return hist;
}
function fairnessCycleK(){
  const se=selEvent();
  if(se) return cycleForDate(se.date);
  const c=CYCLES.find(x=>x.status==='current')||CYCLES.find(x=>x.status==='upcoming')||CYCLES[CYCLES.length-1];
  return c?c.k:cycleForDate(nzTodayISO());
}

/* ── GENERATOR (Irfan's rule engine, ported verbatim; the only additions are the
   two documented extensions: away-date exclusion + duty-preference tie-break) ── */
function generateEventData(ev){
  const duties=dutiesForEvent(ev);
  const k=cycleForDate(ev.date);
  const prev=ROSTERS[ev.id]||{assign:{},manual:{}};
  const manual=Object.assign({},prev.manual||{});
  const _counts=computeCounts(k,ev.id);
  const cnt=_counts.cyc;                 // per-member assignment totals this cycle (excl. this event)
  const recent=_counts.recent;           // totals across the previous three cycles
  const hist=cycleDutyHistory(k,ev.id);   // per-member duty names held this cycle (excl. this event)
  // EXTENSION (a): away-dates — a member whose away list contains this event's date is
  // treated as unavailable and excluded from the entire eligibility pool for this event.
  const active=MEMBERS.filter(m=>m.status==='active'&&!isAway(m,ev.date));
  const byGA=(g,a)=>active.filter(m=>m.gender===g&&m.age_group===a);
  const mA=byGA('Male','adult'),mY=byGA('Male','youth'),mC=byGA('Male','child');
  const fA=byGA('Female','adult'),fY=byGA('Female','youth'),fC=byGA('Female','child');
  const mN=mA.filter(m=>!!m.nandi),fN=fA.filter(m=>!!m.nandi); // Nandi-certified adults
  const used=new Set();
  const assign={},warn={};
  const relaxed=new Set();
  // pick(): fairness = prefer members who haven't done this duty this cycle, then fewest
  // total duties this cycle, then (EXTENSION b) duty preference, then random (ported ordering).
  // Non-repeatable duties filter out members who already held them this cycle; HARD_REQUIRED
  // duties relax that filter rather than stay unfilled.
  function pick(pool,count,duty,allowFallback,ignoreUsed){
    if(count<=0||!pool.length) return [];
    let base=ignoreUsed?pool.slice():pool.filter(m=>!used.has(m.id));
    if(!CHILD_ALLOWED.has(duty)) base=base.filter(m=>m.age_group!=='child'); // children only in CHILD_ALLOWED
    const avail=base.filter(m=>{
      if(REPEAT_ALLOWED_DUTIES.has(duty)) return true;
      const h=hist[m.id]; return !(h&&h.has(duty));
    });
    let finalPool=avail;
    if(!avail.length&&(allowFallback||HARD_REQUIRED_DUTIES.has(duty))){
      finalPool=base;
      if(base.length&&HARD_REQUIRED_DUTIES.has(duty)&&!allowFallback) relaxed.add(duty);
    }
    if(!finalPool.length) return [];
    return finalPool.slice().sort((a,b)=>{
      const ah=(hist[a.id]&&hist[a.id].has(duty))?1:0, bh=(hist[b.id]&&hist[b.id].has(duty))?1:0;
      if(ah!==bh) return ah-bh;
      const cd=(cnt[a.id]||0)-(cnt[b.id]||0); if(cd) return cd;
      // Someone who missed out over the last three cycles comes first when
      // this cycle's counts are level. Ranks below the current cycle so it
      // never overrides present-cycle fairness, only settles its ties.
      const rd=(recent[a.id]||0)-(recent[b.id]||0); if(rd) return rd;
      // EXTENSION (b): duty preference is a pure tie-break — only among fairness-tied
      // candidates, never overriding counts/eligibility/gender/age/child/nandi rules.
      const ap=prefScore(a,duty),bp=prefScore(b,duty); if(ap!==bp) return ap-bp;
      return Math.random()-.5;
    }).slice(0,count);
  }
  // Fill from each age group in turn, dropping to the next only when the
  // current one runs out. Never merge them into one pool: pick() sorts on
  // fairness, so a merged list would hand a child's slot to whichever
  // adult happened to have the fewest duties.
  function pickTier(tiers,count,duty,allowFallback,ignoreUsed){
    const out=[];
    for(const tier of tiers){
      if(out.length>=count) break;
      const taken=new Set(out.map(m=>m.id));
      const room=count-out.length;
      out.push(...pick((tier||[]).filter(m=>!taken.has(m.id)),room,duty,allowFallback,ignoreUsed));
    }
    return out;
  }
  function capLists(d,males,females){
    let M=(males||[]).slice(), F=(females||[]).slice();
    if(typeof d.reqM==='number') M=M.slice(0,d.reqM);
    if(typeof d.reqF==='number') F=F.slice(0,d.reqF);
    if(typeof d.reqAny==='number' && M.length+F.length>d.reqAny){
      const minM=(typeof d.reqM==='number')?Math.min(d.reqM,M.length):0;
      const keptM=M.slice(0,minM), keptF=[];
      let i=minM,j=0;
      while(keptM.length+keptF.length<d.reqAny && (i<M.length||j<F.length)){
        if(j<F.length && keptM.length+keptF.length<d.reqAny) keptF.push(F[j++]);
        if(i<M.length && keptM.length+keptF.length<d.reqAny) keptM.push(M[i++]);
      }
      M=keptM; F=keptF;
    }
    return {m:M,f:F};
  }
  function commit(d,males,females){
    const capped=capLists(d,males,females); males=capped.m; females=capped.f;
    const slot=assign[d.key]={m:[],f:[],x:[]};
    (males||[]).forEach(m=>slot.m.push({id:m.id,name:m.name}));
    (females||[]).forEach(m=>slot.f.push({id:m.id,name:m.name}));
    (males||[]).concat(females||[]).forEach(m=>{ used.add(m.id); cnt[m.id]=(cnt[m.id]||0)+1; });
  }
  // seed manual duties (sacred — never touched by Regenerate/Generate All)
  for(const d of duties){
    if(manual[d.key]&&prev.assign&&prev.assign[d.key]){
      assign[d.key]=JSON.parse(JSON.stringify(prev.assign[d.key]));
      for(const p of people(assign[d.key])){ if(p.id==null)continue; used.add(p.id); cnt[p.id]=(cnt[p.id]||0)+1; }
    }
  }
  const groups={mA:mA,mY:mY,mC:mC,mN:mN,fA:fA,fY:fY,fC:fC,fN:fN,used:used,tier:pickTier};
  // REC duties ignore `used` so a youth can hold one core duty AND one REC duty.
  // That must not let the same person take TWO REC duties, so track them here.
  const recUsed=new Set(); const nR=a=>(a||[]).filter(m=>!recUsed.has(m.id));
  for(const d of duties){
    if(manual[d.key]) continue;
    if(d.section==='mph'){ // youth congregation (youth may double: one core + one MPH duty)
      let ms=[],fs=[];
      if(d.name==='MPH Hall Entrance'){ // 1 child/youth per gender
        ms=pick(nR(mC.length?mC:mY),1,d.name,true,true); fs=pick(nR(fC.length?fC:fY),1,d.name,true,true);
      } else if(d.name==='Seating & Discipline (Youth)'){ // 1 youth per gender
        ms=pick(nR(mY),1,d.name,true,true); fs=pick(nR(fY),1,d.name,true,true);
      } else if(d.name==='Sukreet & Ghatpaat Closing (Youth)'){ // 1 youth/adult per gender
        ms=pick(nR(mY),1,d.name,true,true); if(!ms.length) ms=pick(nR(mA),1,d.name,true,true);
        fs=pick(nR(fY),1,d.name,true,true); if(!fs.length) fs=pick(nR(fA),1,d.name,true,true);
      }
      ms.concat(fs).forEach(m=>recUsed.add(m.id));
      commit(d,ms,fs);
      continue;
    }
    const assigner=DUTY_ASSIGNMENT_CONFIG[d.name];
    if(!assigner){ console.warn('No assignment logic found for duty: '+d.name); assign[d.key]={m:[],f:[],x:[]}; continue; }
    const res=assigner(dutyTypeFor(ev.type),groups,pick)||{};
    commit(d,res.male||[],res.female||[]);
  }
  for(const name of relaxed.values()){
    const inf=DUTY_INFO[name];
    if(inf) (warn[inf.key]=warn[inf.key]||[]).push('no-repeat rule relaxed (pool exhausted)');
  }
  // preserve saved assignments for duty keys not in this event's duty list (legacy data / MPH toggled off)
  for(const key in (prev.assign||{})){ if(!assign[key]&&!duties.some(d=>d.key===key)&&people(prev.assign[key]).length) assign[key]=prev.assign[key]; }
  return {assign:assign,manual:manual,gen_at:new Date().toISOString(),warn:warn};
}
/* ── SAVING A ROSTER ─────────────────────────────────────────────────
   This used to swallow every failure into a console warning. The
   generated roster stayed on screen, the database kept nothing, and the
   next reload replaced what was on screen with what was stored — so a
   save that failed looked exactly like a roster that had been deleted,
   with nothing anywhere saying why.

   Three things now stop that. The error is shown rather than logged.
   The write is read back, because a rejected write is not the only way
   to lose one — a duplicate row for the same event would take the
   update and still leave the page reading the stale copy. And anything
   that did not store is remembered, so a reload cannot quietly replace
   work that only exists in this browser. */
/* Nearly every write on this page ended in catch(e){ console.warn(e) }.
   That is how a roster could fail to save and a confirmation could fail
   to publish while the screen showed success for both. This does the
   write, says out loud what went wrong when it does, and tells the
   caller so the screen can stop claiming otherwise.

   Checking `error` is not enough, and this is the part that was wrong for
   months. Row Level Security does not reject an UPDATE or a DELETE whose
   rows it has filtered out. It runs the statement against no rows and
   reports UPDATE 0 — success. PostgREST returns 200 with an empty body and
   supabase-js hands back {data:[], error:null}, which is indistinguishable
   from a write that worked unless you count the rows. Verified against a
   real Postgres, not assumed.

   So the write asks for its rows back and fails when none arrive. .select()
   is what turns "return=minimal" into "return=representation"; without it
   the database never says which rows it touched and there is nothing to
   check.

   Zero rows is ambiguous on its own: the policy may have filtered the row
   out, or there may honestly have been nothing to change. opts.verify is a
   read that settles it — run only in that case, so it costs nothing on the
   normal path. Anything still there means the write was refused.

   opts.rows === false is the blunt version, for writes where nothing coming
   back is always fine and there is nothing worth reading back — or for an
   RPC, which has no rows to return at all. Those still report a real error.
   Say why at the call site whenever you use it.

   One rule this cannot infer on its own: do not send an INSERT through
   here into a table the writer may not read. Verified against a real
   Postgres — for UPDATE and DELETE the SELECT policy already decides
   which rows the statement may touch, so asking for them back costs
   nothing. For INSERT it does not: RETURNING a row the SELECT policy
   hides raises "new row violates row-level security policy" and rolls the
   insert back. audit_logs is exactly that shape, so its insert is written
   out by hand rather than sent through here — and loses nothing, because
   an INSERT that RLS refuses raises anyway. Silence is only possible for
   UPDATE and DELETE.
 */
async function dbWrite(what, run, opts){
  const o = opts || {};
  if(!sb || DB_MISSING){ toast(what + ' failed — no database connection', 'err'); return false; }
  let res, counted = false;
  try{
    const q = run();
    counted = o.rows !== false && !!q && typeof q.select === 'function';
    res = await (counted ? q.select() : q);
  }catch(e){
    /* supabase-js resolves rather than rejecting — a dropped connection
       still comes back as {data,error}. So this catches a builder that
       threw while being assembled, nothing more. It is not the network
       path, and a try/catch is not a substitute for reading the result. */
    console.error(what, e); toast(what + ' failed — ' + (e.message || e), 'err'); return false;
  }
  const error = res && res.error;
  if(error){
    console.error(what, error);
    /* A table or column that is not there is not a bug in the page, it is
       a script that has not been run — and saying so saves the user
       working out what "column does not exist" means. */
    const msg = error.message || String(error);
    const schema = tableMissing(error) || /column/i.test(msg);
    const dupe = /duplicate key|unique constraint|23505/i.test(msg + (error.code||''));
    // A call site that knows what its own failure means says so itself;
    // "duplicate key value violates..." is true and useless.
    const hint = o.hint && o.hint(error);
    toast(hint ? hint
        : what + ' failed — ' + (schema ? 'run the latest SETUP.sql to enable this'
                              : dupe   ? 'it already exists'
                                       : msg), 'err');
    return false;
  }
  if(!counted) return true;      // nothing was asked for, so nothing can be judged
  const data = res && res.data;
  const n = data == null ? 0 : (Array.isArray(data) ? data.length : 1);
  if(n && o.bag) o.bag.rows = Array.isArray(data) ? data : [data];
  if(!n){
    if(o.verify){
      const chk = await o.verify();
      // A verify that cannot be read is not a verify. Only an empty,
      // error-free answer proves there was nothing there to change.
      if(chk && !chk.error){
        const left = chk.data;
        const still = left == null ? 0 : (Array.isArray(left) ? left.length : 1);
        if(!still) return true;          // there was honestly nothing to change
      }
    }
    console.error(what, '— the database accepted the request and changed nothing', res);
    toast(what + ' failed — the database refused it. You may not have permission to change this.', 'err');
    return false;
  }
  return true;
}
/* The same checks, but handing back what the database stored. For the
   writes that need its id and its timestamps: a row invented locally so
   the screen has something to draw gets an id no other browser has ever
   heard of, and every button pointed at it addresses nothing. */
async function dbWriteRows(what, run, opts){
  const bag = {};
  const ok = await dbWrite(what, run, Object.assign({}, opts||{}, {bag:bag}));
  return ok ? (bag.rows || []) : null;
}
let ROSTER_UNSAVED = {};        // event id -> the roster that is not safely stored
function unsavedCount(){ return Object.keys(ROSTER_UNSAVED).length; }
async function saveRoster(eventId, opts){
  const quiet = opts && opts.quiet;
  if(!sb || DB_MISSING){ ROSTER_UNSAVED[eventId] = ROSTERS[eventId]; return false; }
  const body = ROSTERS[eventId];
  if(!body){ console.warn('saveRoster: nothing to save for event', eventId); return false; }
  /* Long enough to cover the write and the read-back. The old 1.5s could
     lapse mid-save, letting our own change bounce back as a reload. */
  pauseRT(6000);
  let err = null;
  for(let attempt = 0; attempt < 2; attempt++){
    try{
      /* iv_roster has a required date column. The page never sent one, so
         every save was refused with 23502 (null value in column "date").
         The date is the event's own, which is what the column is for. */
      const evForDate = EVENTS.find(e=>e.id===eventId);
      const {error} = await sb.from('iv_roster').upsert({event_id:eventId, date:evForDate?evForDate.date:null, data:body});
      if(!error){ err = null; break; }
      err = error;
    }catch(e){ err = e; }
    if(attempt === 0) await new Promise(r=>setTimeout(r, 500));   // one retry for a blip
  }
  if(!err){
    // Read it back. Sent and stored are not the same claim.
    try{
      const {data, error} = await sb.from('iv_roster').select('event_id,data').eq('event_id', eventId);
      if(error) err = error;
      else if(!data || !data.length) err = {message:'the row was accepted but is not there when read back'};
      else if(data.length > 1) err = {message:'there are ' + data.length + ' roster rows for this event — the unique index on iv_roster(event_id) is missing, so saves cannot replace cleanly. Re-run SETUP.sql.'};
      else if(JSON.stringify(data[0].data) !== JSON.stringify(body)) err = {message:'what came back does not match what was sent'};
    }catch(e){ err = e; }
  }
  if(err){
    ROSTER_UNSAVED[eventId] = body;
    const why = err.message || String(err);
    console.error('saveRoster failed for event', eventId, err);
    if(!quiet) toast('Roster NOT saved — ' + why, 'err');
    renderSaveWarning();
    return false;
  }
  delete ROSTER_UNSAVED[eventId];
  renderSaveWarning();
  return true;
}
/* Retries everything still unstored. Offered rather than done silently,
   because if the first attempt failed for a reason that has not changed
   the second will too, and a button says so honestly. */
async function retryUnsaved(){
  const ids = Object.keys(ROSTER_UNSAVED);
  if(!ids.length) return;
  let ok = 0;
  for(const id of ids){
    ROSTERS[id] = ROSTER_UNSAVED[id];
    if(await saveRoster(Number(id), {quiet:true})) ok++;
  }
  toast(ok === ids.length ? 'Saved — everything is stored now'
                          : ok + ' of ' + ids.length + ' saved. The rest are still not stored.',
        ok === ids.length ? 'ok' : 'err');
  renderCurrent();
}
function renderSaveWarning(){
  const el = document.getElementById('saveWarn');
  if(!el) return;
  const n = unsavedCount();
  if(!n){ el.style.display = 'none'; return; }
  el.style.display = 'flex';
  el.innerHTML = '<span>⚠️</span><span><b>' + n + ' roster' + (n===1?'' : 's') + ' not saved.</b> '
    + 'What you can see is in this browser only, and will be gone when the page reloads. '
    + 'The database refused the write — the reason was shown when it happened and is in the browser console.</span>'
    + '<button class="btn btn-bl btn-sm" onclick="retryUnsaved()" style="margin-left:auto">Try again</button>';
}
/* generateEvent() and rosterDelta() lived here. Both are gone: every
   route to them now goes through previewEvent() -> applyPlan(), which
   shows the roster before it is stored rather than after. generateCycle()
   below survives deliberately as the one-step, no-preview entry point. */
async function generateCycle(k){
  /* Takes the cycle to build. Called without one it falls back to the
     selected event's cycle, which is how the button in an unbuilt event's
     empty state still works. */
  if(k==null){ const ev=selEvent(); if(!ev) return; k=cycleForDate(ev.date); }
  /* Every non-historic event in the cycle, whether or not it already has a
     roster. This used to skip anything already generated, on the reasoning
     that re-rolling would discard a lead's hand-tuning — but it does not:
     generateEventData carries any duty flagged `manual` straight across and
     skips it, so only the generator's own picks change. Skipping meant that
     once a cycle was built there was no way to rebuild it at all, which is
     the opposite of useful. previewCycle() shows exactly what it will
     touch, before anything is stored. */
  /* Generates and stores in one go, with no preview. The buttons all go
     through previewCycle() now; this stays for anything that wants the
     old one-step behaviour, and shares applyPlan() so there is exactly
     one piece of code that writes rosters to the database. */
  const plan=buildPlan(k);
  if(!plan) return toast('No events in this cycle to build','err');
  await applyPlan(plan);
}

/* ── ATTENDANCE HELPERS ── */
function attStatus(eventId,memberId){ const r=ATTEND[eventId]; return r&&r[memberId]?r[memberId].status:null; }
/* Lifetime, across every event this team has ever run — which is why it
   is counted in the database rather than here. Reading it off ATTEND
   would now silently mean "reliability over the last few cycles", since
   that is all the raw register still holds. */
function memberReliability(memberId){
  const t=ATT_TOTALS[memberId];
  const present=t?Number(t.present)||0:0, late=t?Number(t.late)||0:0,
        absent=t?Number(t.absent)||0:0, excused=t?Number(t.excused)||0:0;
  const total=present+late+absent+excused;
  const denom=present+late+absent;
  return {present,late,absent,excused,total,rate:denom?Math.round((present+late)/denom*100):null};
}
/* Marking the register writes first and changes the screen after.

   Clearing a mark used to be a bare await wrapped in
   catch(e){console.warn(e)}, while the branch immediately below it — the
   one that sets a mark — was checked. So a delete that Row Level Security
   refused took the tick off the screen, said nothing, and put it back on
   the next reload. Whoever marked the register saw it work twice and had
   no way to know it had not. */
async function markAttendance(eventId,memberId,status){
  if(!IS_EDIT) return;
  const cur=attStatus(eventId,memberId);
  const rec=ATTEND[eventId]=ATTEND[eventId]||{};
  if(cur===status){                                   // tapping the same mark clears it
    if(sb&&!DB_MISSING){
      pauseRT(1200);
      const ok=await dbWrite('Clearing the mark', ()=>
        sb.from('iv_attendance').delete().eq('event_id',eventId).eq('member_id',memberId),
        /* A mark can legitimately be missing from the database — an
           earlier save may have failed. Reading it back tells a refusal
           apart from a row that was never there, so neither one gets
           reported as the other. */
        {verify: ()=>sb.from('iv_attendance').select('event_id')
                       .eq('event_id',eventId).eq('member_id',memberId)});
      if(!ok){ renderAttendance(); return; }
    }
    delete rec[memberId];
  } else {
    if(sb&&!DB_MISSING){
      pauseRT(1200);
      const ok=await dbWrite('Saving attendance', ()=>
        sb.from('iv_attendance').upsert({event_id:eventId,member_id:memberId,status:status,
          marked_by:CU.user,marked_at:new Date().toISOString()}));
      if(!ok){ renderAttendance(); return; }
    }
    rec[memberId]={status:status,marked_by:CU.user,marked_at:new Date().toISOString()};
  }
  /* Keep the lifetime total in step. It is counted by the database on
     load, so without this the reliability figure on the member card
     would sit on whatever it was when the page opened — visibly wrong to
     the person who just marked the register. */
  bumpTotals(memberId, cur, cur===status ? null : status);
  auditLog('attendance','attendance',(memById(memberId)||{}).name+' › '+(cur===status?'cleared':status));
  renderAttendance();
}
function bumpTotals(memberId, from, to){
  const t=ATT_TOTALS[memberId]=ATT_TOTALS[memberId]||{member_id:memberId,present:0,late:0,excused:0,absent:0,marked:0};
  const step=(k,n)=>{ if(k && t[k]!=null) t[k]=Math.max(0,(Number(t[k])||0)+n); };
  if(from){ step(from,-1); t.marked=Math.max(0,(Number(t.marked)||0)-1); }
  if(to){   step(to,  +1); t.marked=(Number(t.marked)||0)+1; }
}

   A lead and a volunteer open this page for different reasons, and used

let MY_MEM = null;              // this viewer's row in iv_members, if known

/* Past events whose register was never finished. It is what every
   attendance figure is built on, and until now nothing said it was
   outstanding — you had to go looking event by event. */
function unmarkedEvents(){
  const today = nzTodayISO();
  return EVENTS.filter(ev=>{
    if(ev.date >= today) return false;
    if(!CYCLES.some(c=>inCycleK(ev.date,c.k))) return false;   // outside what is loaded
    const r = ROSTERS[ev.id]; if(!r || !r.assign) return false;
    const marks = ATTEND[ev.id] || {};
    return rosterPeople(r).some(id=>!marks[id]);
  });
}
function rosterPeople(r){
  const ids = [];
  for(const k in (r.assign||{})) people(r.assign[k]).forEach(p=>{ if(p.id!=null && ids.indexOf(p.id)<0) ids.push(p.id); });
  return ids;
}
/* Has a roster, but is not on the calendar — so nobody outside the leads
   can see it. Generating publishes now, so this normally counts nothing;
   it catches the two cases that matter, a roster taken off the calendar
   on purpose and one whose publish was refused after the save worked. */
function draftedRosters(){
  const today = nzTodayISO();

/* Takes the roster rather than reading it, so the plan panel can count a
   staged build the same way the page counts a stored one. */
function slotCountsFor(ev,data){
  if(!data||!data.assign) return {assigned:0,missing:0,generated:false};
  let assigned=0,missing=0;
  for(const d of dutiesForEvent(ev)){
    const a=data.assign[d.key]||{m:[],f:[],x:[]};

  }
  return {assigned,missing,generated:!!(data.gen_at||assigned)};
}

function selectEvent(id){

     leaves a panel describing work you can no longer see, so it goes. */

/* ── THE PLAN PANEL ──────────────────────────────────────────────────
   Generating was a black box. You pressed the button, every name on the
   screen changed at once, and the three questions a lead actually has
   went unanswered: what did that change, who is carrying this cycle, and
   did anybody get missed. Worse, it answered them only after the write —
   a regenerate on a live roster reaches three hundred people before you
   can look at it, and there is no undo.

   So the work is done first and shown before it is stored.

   The preview has to BE the outcome, not a forecast of it. pick() breaks
   fairness ties with Math.random(), so generating twice gives two
   different rosters; a preview that re-rolled on approval would show
   names that were never saved, which is worse than showing nothing. The
   plan therefore holds the generated rosters themselves and approving it
   stores those, rather than generating again. */
let ROSTER_PLAN=null;            // the staged build, before or just after it was stored
const PLAN_OPEN=new Set();       // event ids whose change detail is expanded

/* Every duty each member holds in cycle k, read out of `map` rather than
   the live ROSTERS so one function serves both the staged plan and the
   state on screen. */
function planCounts(k,map){
  const per={};
  for(const ev of EVENTS){
    if(!inCycleK(ev.date,k)) continue;
    const r=map[ev.id]; if(!r||!r.assign) continue;
    for(const key in r.assign)
      for(const p of people(r.assign[key])) if(p.id!=null) per[p.id]=(per[p.id]||0)+1;
  }
  return per;
}
/* Which duties differ and who moves in or out of each. Compared by name
   rather than id, matching rosterDelta, so renaming a member does not
   read as a swap. */
function dutyDiff(before,after){
  const A=(before&&before.assign)||{}, B=(after&&after.assign)||{};
  let changed=0,unchanged=0; const moves=[];
  /* The union, not just the new roster's keys: a duty that existed before
     and is absent now — REC toggled off, say — is a change, and reading
     only B would score it as nothing happening. */
  for(const key of new Set(Object.keys(A).concat(Object.keys(B)))){
    const a=people(A[key]).map(p=>p.name).filter(Boolean);
    const b=people(B[key]).map(p=>p.name).filter(Boolean);
    if(a.slice().sort().join('|')===b.slice().sort().join('|')){ unchanged++; continue; }
    changed++;
    const sA=new Set(a), sB=new Set(b);
    moves.push({duty:legacyLabel(key), in:b.filter(n=>!sA.has(n)), out:a.filter(n=>!sB.has(n))});
  }
  return {changed:changed,unchanged:unchanged,total:changed+unchanged,moves:moves};
}
/* The shortfalls, named. slotCounts only says how many slots are short,
   which is no help deciding what to do about it — a lead needs the duty
   and the gender it could not fill. */
function gapsFor(ev,data){
  const out=[];
  for(const d of dutiesForEvent(ev)){
    const a=(data&&data.assign&&data.assign[d.key])||{m:[],f:[],x:[]};
    const nm=(a.m||[]).length,nf=(a.f||[]).length,nx=(a.x||[]).length,tot=nm+nf+nx;
    const mM=Math.max(0,(d.reqM||0)-nm), mF=Math.max(0,(d.reqF||0)-nf);
    const mAny=Math.max(0,(d.reqAny||0)-tot-mM-mF);
    if(mM+mF+mAny) out.push({duty:d.name,short:mM+mF+mAny,
      why:[mM?mM+' male':'',mF?mF+' female':'',mAny?mAny+' any':''].filter(Boolean).join(', ')});
  }
  return out;
}
/* The numbers behind the panel. `prevMap` is what the cycle looked like
   before; pass null for the standing view, where nothing is changing. */
function cycleStats(k,map,prevMap){
  const before=prevMap?planCounts(k,prevMap):null, after=planCounts(k,map);
  const active=MEMBERS.filter(m=>m.status==='active');
  const per=active.map(m=>({id:m.id,name:m.name,now:after[m.id]||0,
                            was:before?(before[m.id]||0):null,
                            away:(m.away||[]).filter(d=>inCycleK(d,k)).length}))
    .sort((a,b)=>b.now-a.now||String(a.name).localeCompare(String(b.name)));
  const counts=per.filter(p=>p.now>0).map(p=>p.now);
  const hist={}; counts.forEach(c=>{ hist[c]=(hist[c]||0)+1; });
  let slots=0,missing=0; const gaps=[];
  for(const e of eventsInCycle(k)){
    const sc=slotCountsFor(e,map[e.id]);
    if(!sc.generated) continue;         // an unbuilt event is not a gap, it is unbuilt
    slots+=sc.assigned; missing+=sc.missing;
    gapsFor(e,map[e.id]).forEach(g=>gaps.push(Object.assign({event:e.name,date:e.date},g)));
  }
  return {per:per, used:counts.length, activeTotal:active.length,
          hist:hist, slots:slots, missing:missing, gaps:gaps,
          min:counts.length?Math.min.apply(null,counts):0,
          max:counts.length?Math.max.apply(null,counts):0,
          mean:counts.length?+(counts.reduce((a,b)=>a+b,0)/counts.length).toFixed(1):0};
}
/* Generates without storing anything. Returns the staged rosters plus
   everything the panel needs to describe them. */
function buildPlan(k,onlyEventId,opts){
  const inCyc=eventsInCycle(k).filter(e=>!isHistoricEvent(e));
  const evs=onlyEventId!=null?inCyc.filter(e=>e.id===onlyEventId):inCyc;
  if(!evs.length) return null;
  /* An event that is on the calendar has already been read by whoever is
     on it. Re-rolling it moves people who were told where to stand, so
     building a cycle leaves those alone and touches only what is still a
     draft. That is what makes "Build this cycle" safe to press on reflex
     when something has been added mid-cycle — the worst it can do is
     re-roll work nobody has seen.

     Asking for one event by name is different: that is a lead pointing at
     a specific roster and saying rebuild this one. Honour it. */
  const includeLive=onlyEventId!=null||!!(opts&&opts.includeLive);
  const willBuild=e=>includeLive||!e.confirmed;
  const toBuild=evs.filter(willBuild);
  /* Generate against a copy of the whole map. Each event's picks depend
     on what the earlier ones took — computeCounts reads ROSTERS — so the
     run has to happen with the staged rosters in place, not one at a
     time against the live map. The skipped events stay in the copy at
     their stored value, so the ones being rebuilt still count them.
     Restored in a finally: leaving ROSTERS pointed at a scratch copy
     would silently throw away every save that followed it. */
  const liveMap=ROSTERS, staged=Object.assign({},ROSTERS);
  try{ ROSTERS=staged; for(const e of toBuild) staged[e.id]=generateEventData(e); }
  finally{ ROSTERS=liveMap; }
  const rows=evs.map(e=>{
    const skipped=!willBuild(e);
    const data=skipped?liveMap[e.id]:staged[e.id];
    const diff=skipped?{changed:0,total:0,moves:[]}:dutyDiff(liveMap[e.id],staged[e.id]);
    const sc=slotCountsFor(e,data);
    return {id:e.id,name:e.name,date:e.date,skipped:skipped,live:!!e.confirmed,
            wasBuilt:!!slotCountsFor(e,liveMap[e.id]).generated,
            kept:data&&data.manual?Object.keys(data.manual).filter(x=>data.manual[x]).length:0,
            changed:diff.changed,total:diff.total,moves:diff.moves,
            assigned:sc.assigned,missing:sc.missing,
            gaps:gapsFor(e,data)};
  });
  /* Worth saying out loud rather than leaving as a mystery gap: with no
     Youth tagged, every REC slot on a youth Friday is unfillable, and the
     panel would otherwise just report a pile of empty duties. */
  const notes=[];
  /* Only about the events actually being rebuilt — a warning about a
     roster this run is deliberately not touching is just noise. */
  if(toBuild.some(e=>e.type==='friday'&&e.youth)&&!MEMBERS.some(m=>m.status==='active'&&m.age_group==='youth'))
    notes.push('No members are tagged Youth, so the REC congregation slots cannot fill.');
  const awayHere=MEMBERS.filter(m=>m.status==='active'&&(m.away||[]).some(d=>toBuild.some(e=>e.date===d)));
  if(awayHere.length) notes.push(awayHere.length===1
    ? '1 member is away on one of these dates and was left out — '+awayHere[0].name
    : awayHere.length+' members are away on one of these dates and were left out — '+
      awayHere.map(m=>m.name).join(', '));
  const skippedCount=rows.filter(r=>r.skipped).length;
  return {k:k, label:cycleLabel(k), scope:onlyEventId!=null?'event':'cycle',
          staged:staged, prev:liveMap, events:rows, notes:notes,
          includeLive:includeLive, buildCount:toBuild.length, skippedCount:skippedCount,
          stats:cycleStats(k,staged,liveMap), applied:false, at:null};
}
/* The single writer. Stores the staged rosters, publishes the ones that
   are complete, and reports what actually happened rather than what was
   attempted — counting stored and live separately is how a cycle that
   half-saved stops reading as a success. */
async function applyPlan(plan,opts){
  if(!plan) return false;
  /* publish:false stores the rosters as drafts for the publish bar. The
     default is unchanged: complete rosters go on the calendar as they save. */
  const publish=!(opts&&opts.publish===false);
  /* 'new' is how generating works now: a day that had no roster goes on
     the calendar, unfilled slots and all (they show blank). A day that was
     already built keeps whatever the lead last chose, so a regenerate never
     puts back a day somebody hid on purpose. */
  const pubNew=!!(opts&&opts.publish==='new');
  /* Rows the plan deliberately left alone are not written, are not
     counted, and are not mentioned in the audit line — otherwise the
     receipt would claim credit for rosters this run never touched. */
  const build=plan.events.filter(r=>!r.skipped);
  if(!build.length) return false;
  ROSTER_PLAN=plan;
  let stored=0, live=0;
  for(const row of build){
    const e=EVENTS.find(x=>x.id===row.id); if(!e) continue;
    ROSTERS[e.id]=plan.staged[e.id];
    if(await saveRoster(e.id,{quiet:true})){
      stored++;
      if(pubNew){ if(e.confirmed||(!row.wasBuilt&&await publishIfComplete(e,{force:true,quiet:true}))) live++; }
      else if(publish ? await publishIfComplete(e,{quiet:true}) : e.confirmed) live++;
    }
  }
  const n=build.length;
  auditLog(n>1?'generate-all':'generate','roster',
    plan.label+' — '+n+' event'+(n===1?'':'s')+', '+stored+' saved, '+live+' on the calendar'+
    (plan.skippedCount?', '+plan.skippedCount+' left as '+(plan.skippedCount===1?'it was':'they were')+' (on the calendar)':''));
  plan.applied=true; plan.at=new Date(); plan.stored=stored; plan.live=live;
  renderRoster(); refreshBadges();
  if(pubNew&&stored===n){
    const blanks=build.reduce((t,r)=>t+(r.missing||0),0);
    toast((n===1?'Built '+esc(build[0].name):'Generated '+n+' days')+' \u2014 '+live+' on the calendar'+
      (blanks?', '+blanks+' slot'+(blanks===1?'':'s')+' blank':''));
  }
  else if(!publish&&stored===n) toast('Saved '+n+' as draft'+(n===1?'':'s')+' — publish from the bar when ready');
  else if(live===n) toast('Built '+n+' event'+(n===1?'':'s')+' — all saved and on the calendar');
  else if(stored===n) toast('Built and saved '+n+' — '+live+' went on the calendar, the rest still have unfilled slots','err');
  else toast('Built '+n+', but only '+stored+' saved — see the warning above','err');
  return stored===n;
}
/* Generating no longer stops at a preview: it saves and publishes, and the
   Cycle summary shows what it did. These two names are kept so anything
   still calling them gets the new behaviour rather than a preview nobody
   would see. */
function previewCycle(k){ askGenerateCycle(k); }
function previewEvent(id){ askRegenerateDay(id); }
function commitPlan(publish){ if(ROSTER_PLAN&&!ROSTER_PLAN.applied) applyPlan(ROSTER_PLAN,{publish:publish!==false}); }
/* Rebuilds the plan with the published rosters in or out. Generating is
   cheap and nothing has been stored yet, so flipping the box simply
   produces a different plan rather than trying to patch this one. */
function togglePlanLive(on){
  if(!ROSTER_PLAN||ROSTER_PLAN.applied) return;
  const k=ROSTER_PLAN.k;
  const plan=buildPlan(k,null,{includeLive:!!on});
  if(!plan) return;
  PLAN_OPEN.clear(); ROSTER_PLAN=plan; plan.fresh=true; setTimeout(()=>{ if(ROSTER_PLAN===plan) plan.fresh=false; },900); renderRoster();
}
function discardPlan(){ ROSTER_PLAN=null; PLAN_OPEN.clear(); renderRoster(); }
function togglePlanRow(id){ PLAN_OPEN.has(id)?PLAN_OPEN.delete(id):PLAN_OPEN.add(id); renderRoster(); }
/* A hand edit invalidates a staged plan outright — it was generated
   against the roster as it was a moment ago, so storing it now would
   quietly overwrite what was just set by hand. Dropped rather than
   recomputed: silently re-rolling underneath somebody is the behaviour
   this whole panel exists to stop. */
function invalidatePlan(){ if(ROSTER_PLAN&&!ROSTER_PLAN.applied){ ROSTER_PLAN=null; PLAN_OPEN.clear(); } }

/* The panel itself. Three states out of one renderer: a staged build
   waiting for approval, the receipt for the one just stored, and — when
   neither applies — the standing picture of the cycle, so the column is
   answering "who is carrying this one" even when nobody has pressed
   anything. */
function renderPlanPanel(){
  if(!IS_EDIT) return '';
  const plan=ROSTER_PLAN;
  let k=null;
  if(plan) k=plan.k;
  else k=barCycleK();     // one answer to "which cycle", shared with the bar
  if(k==null) return '';
  const st=plan?plan.stats:cycleStats(k,ROSTERS,null);
  const preview=!!plan&&!plan.applied, receipt=!!plan&&plan.applied;
  const state=preview?'preview':receipt?'receipt':'idle';

  /* ── header ── */
  let tag,ttl,sub,acts='';
  if(preview){
    const build=plan.events.filter(e=>!e.skipped);
    const n=build.length, skipped=plan.skippedCount||0;
    const touched=build.filter(e=>e.wasBuilt).length;
    const kept=build.reduce((s,e)=>s+e.kept,0);
    tag='Preview · nothing saved yet';
    ttl=plan.scope==='event'?esc(plan.events[0].name):'Build '+esc(plan.label);
    if(!n){
      sub='Every event in this cycle is already on the calendar, so there is '+
        'nothing here to rebuild. Tick the box below if you really do want to re-roll '+
        (skipped===1?'it':'them')+'.';
    } else {
      /* Two counts in one sentence read as the same number if you are not
         careful, so the skipped ones get their own line and the rebuilt
         ones are described only where there is no ambiguity. */
      sub=n+' event'+(n===1?'':'s')+' generated below'+
        (skipped?'. <b style="color:var(--green-lt)">'+skipped+'</b> '+(skipped===1?'is':'are')+
                 ' on the calendar and stay'+(skipped===1?'s':'')+' exactly as '+
                 (skipped===1?'it is':'they are')+' — nobody already told their duty gets moved'
                :(touched?', '+touched+' of them replacing a roster that is already there':''))+
        '. '+
        (kept?kept+' dut'+(kept===1?'y':'ies')+' set by hand '+(kept===1?'is':'are')+' carried through untouched.'
             :'Nothing being rebuilt was set by hand.');
    }
    if(plan.midCycle) sub+=' Added mid-cycle, so it was filled using everyone\u2019s duties across the other '+
      plan.midCycle+' event'+(plan.midCycle===1?'':'s')+' in this cycle. Those rosters do not change.';
    /* Saving no longer has to mean publishing. Complete rosters can go up
       with the save, as before, or be kept as drafts for the publish bar. */
    const ready=build.filter(e=>!e.missing&&!e.live).length;
    acts=(n?(ready?'<button class="btn btn-bl btn-sm" onclick="commitPlan(true)">Save &amp; publish '+ready+' complete</button>'+
                   '<button class="btn btn-ol btn-sm" onclick="commitPlan(false)">Save as drafts</button>'
                  :'<button class="btn btn-bl btn-sm" onclick="commitPlan(false)">Save '+n+' event'+(n===1?'':'s')+'</button>'):'')+
         '<button class="btn btn-ol btn-sm" onclick="discardPlan()">Discard</button>';
  } else if(receipt){
    const n=plan.events.filter(e=>!e.skipped).length;
    tag='Cycle summary \u00b7 '+(plan.at?esc(plan.at.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})):'');
    ttl=plan.scope==='event'?esc(plan.events[0].name)+' built':'Cycle generated';
    sub=(plan.scope==='event'?'1 day':n+' day'+(n===1?'':'s'))+' \u00b7 '+plan.stored+' saved \u00b7 '+plan.live+' on the calendar'+
      (st.missing?' \u00b7 '+st.missing+' slot'+(st.missing===1?'':'s')+' blank across the cycle':'')+
      (plan.stored<n?'. The rest are not stored \u2014 see the warning on the page.':'.')+
      (plan.midCycle?' Added mid-cycle, so it was filled using everyone\u2019s duties across the other '+plan.midCycle+
        ' event'+(plan.midCycle===1?'':'s')+'. Those rosters did not change.':'');
    acts='<button class="btn btn-ol btn-sm" onclick="discardPlan()">Done</button>';
  } else {
    tag='This cycle';
    ttl=esc(cycleLabel(k));
    sub='How the cycle stands right now: who has how many duties, and what is still short.';
  }
  let h='<div class="gp '+state+((plan&&plan.fresh)?' fresh':'')+'"><div class="gp-hd"><div class="gp-tag">'+tag+'</div>'+
        '<div class="gp-ttl">'+ttl+'</div><div class="gp-sub">'+sub+'</div></div>';
  if(acts) h+='<div class="gp-acts">'+acts+'</div>';
  /* The escape hatch. A lead who genuinely wants the published rosters
     re-rolled can have it — they just cannot get it by accident. Only
     offered when the cycle actually contains something live. */
  if(preview&&plan.scope==='cycle'&&plan.events.some(e=>e.live)){
    const liveN=plan.events.filter(e=>e.live).length;
    h+='<label class="gp-live"><input type="checkbox" onchange="togglePlanLive(this.checked)"'+
       (plan.includeLive?' checked':'')+'>'+
       '<span>Also re-roll the <b>'+liveN+'</b> already on the calendar'+
       (plan.includeLive?' — people already told their duty will move':'')+'</span></label>';
  }

  /* ── the four numbers ── */
  const unused=st.activeTotal-st.used;
  h+='<div class="gp-nums">'+
    '<div class="gp-n"><div class="v">'+st.slots+'</div><div class="l">slots filled</div></div>'+
    '<div class="gp-n"><div class="v" style="color:'+(st.missing?'var(--gold-lt)':'var(--green-lt)')+'">'+st.missing+'</div><div class="l">slots unfilled</div></div>'+
    '<div class="gp-n"><div class="v">'+st.used+'</div><div class="l">people rostered</div></div>'+
    '<div class="gp-n"><div class="v" style="color:'+(unused?'var(--gold-lt)':'var(--dt)')+'">'+unused+'</div><div class="l">not used</div></div>'+
    '</div>';

  /* ── what changes ── */
  if(plan){
    h+='<div class="gp-sec">'+(preview?'What would change':'What changed')+'</div><div class="gp-b">';
    for(const row of plan.events){
      const open=PLAN_OPEN.has(row.id)&&!row.skipped;
      const what=row.skipped
                ?'<span class="gp-pill" style="background:rgba(16,185,129,.14);color:var(--green-lt)">left alone</span>'
                : !row.wasBuilt?'<span class="gp-pill" style="background:var(--db);color:var(--blue-lt)">new</span>'
                : row.changed? '<span class="gp-pill" style="background:var(--gold-bg);color:var(--gold-lt)">'+row.changed+' of '+row.total+(preview?' change':' changed')+'</span>'
                             : '<span class="gp-pill" style="background:rgba(16,185,129,.14);color:var(--green-lt)">no change</span>';
      h+='<div class="gp-ev'+(open?' open':'')+(row.skipped?' gp-skip':'')+'"'+
         (row.skipped?'':' onclick="togglePlanRow('+row.id+')"')+'>'+
         '<div class="gp-row"><span class="nm">'+esc(fmtShort(row.date))+' · '+esc(row.name)+'</span>'+what+'</div>'+
         '<div class="gp-mt">'+(row.skipped
            ?'On the calendar — staying exactly as it is'
            :row.assigned+' filled'+(row.missing?' · <b style="color:var(--gold-lt)">'+row.missing+' short</b>':'')+
             (row.kept?' · '+row.kept+' kept by hand':''))+'</div>';
      if(open){
        if(!row.moves.length) h+='<div class="gp-mv">Every duty landed on the same people.</div>';
        else for(const mv of row.moves.slice(0,40))
          h+='<div class="gp-mv"><b>'+esc(mv.duty)+'</b>'+
             (mv.out.length?'<span class="out">− '+esc(mv.out.join(', '))+'</span>':'')+
             (mv.in.length?'<span class="in">+ '+esc(mv.in.join(', '))+'</span>':'')+'</div>';
        if(row.moves.length>40) h+='<div class="gp-mv">…and '+(row.moves.length-40)+' more.</div>';
      }
      h+='</div>';
    }
    h+='</div>';
  }

  /* ── duty load ── */
  const keys=Object.keys(st.hist).map(Number).sort((a,b)=>a-b);
  if(keys.length){
    const peak=Math.max.apply(null,keys.map(n=>st.hist[n]));
    h+='<div class="gp-sec">Duty load</div><div class="gp-b">';
    for(const n of keys)
      h+='<div class="gp-row"><span class="nm">'+n+' dut'+(n===1?'y':'ies')+'</span>'+
         '<span class="gp-bar"><i style="width:'+Math.round(st.hist[n]/peak*100)+'%"></i></span>'+
         '<span class="mt">'+st.hist[n]+'</span></div>';
    h+='<div class="gp-note">Fewest '+st.min+' · average '+st.mean+' · most '+st.max+
       ' duties each, across the whole cycle.</div></div>';
  }

  /* ── every member ── */
  h+='<div class="gp-sec">Every member · duties this cycle</div><div class="gp-b"><div class="gp-list">';
  if(!st.per.length) h+='<div class="gp-note">No active members.</div>';
  for(const p of st.per){
    const d=p.was==null?0:p.now-p.was;
    const chip=!d?'':'<span class="gp-pill" style="background:'+(d>0?'var(--db);color:var(--blue-lt)':'var(--gold-bg);color:var(--gold-lt)')+'">'+(d>0?'+':'−')+Math.abs(d)+'</span>';
    h+='<div class="gp-row"><span class="nm'+(p.now?'':' zero')+'">'+esc(p.name)+
       (p.away?'<span class="gp-away" title="away on '+p.away+' date'+(p.away===1?'':'s')+' this cycle">away</span>':'')+
       '</span>'+chip+'<span class="mt">'+p.now+'</span></div>';
  }
  h+='</div></div>';

  /* ── needs attention ── */
  const never=st.per.filter(p=>!p.now&&!p.away);
  const bits=[];
  if(st.gaps.length){
    const top=st.gaps.slice(0,6).map(g=>esc(g.duty)+' ('+g.why+') on '+esc(fmtShort(g.date)));
    bits.push('<b>'+st.missing+' slot'+(st.missing===1?'':'s')+' could not be filled:</b> '+top.join('; ')+
      (st.gaps.length>6?'; and '+(st.gaps.length-6)+' more.':'.'));
  }
  if(never.length) bits.push('<b>'+never.length+' active member'+(never.length===1?'':'s')+' not rostered at all this cycle:</b> '+
    never.slice(0,12).map(p=>esc(p.name)).join(', ')+(never.length>12?', and '+(never.length-12)+' more':''));
  if(plan) plan.notes.forEach(n=>bits.push(esc(n)));
  if(bits.length) h+='<div class="gp-sec">Needs attention</div><div class="gp-b">'+
    bits.map(b=>'<div class="gp-warn">'+b+'</div>').join('')+'</div>';

  return h+'</div>';
}
/* ── ROSTER: CYCLES → ONE CYCLE → ONE EVENT ─────────────────────────
   The page used to open on three columns at once: every cycle and event
   in a sidebar, one event in the middle, and the build preview squeezed
   into a third column. A lead's actual order of work is a cycle at a time
   — pick it, generate it, check it, publish it, then fix single events —
   so the page now follows that order.

   1. Cycles: a card per cycle with how far along it is.
   2. One cycle: generate it if it is not built, the preview full width in
      the middle, a publish bar, and the events with their states.
   3. One event: the roster itself, with a way back to its cycle.

   Building, previewing and saving are the same code as before (buildPlan,
   applyPlan); only where the result is shown has changed. The calendar is
   still the landing page — this is where the Roster item opens. */
let ROSTER_BAR_K=null;          // the cycle the page is working on, when chosen
let ROSTER_VIEW='cycles';       // 'cycles' | 'cycle' | 'event'
let ROSTER_K=null;              // the cycle shown in the cycle view
let _rosterJump=false;          // set when something sends you straight to a cycle or event
let _publishing=false;          // one publish run at a time
function barCycleK(){
  if(ROSTER_BAR_K!=null) return ROSTER_BAR_K;
  const sel=selEvent();
  if(sel) return cycleForDate(sel.date);
  const cur=CYCLES.find(c=>c.status==='current')||CYCLES.find(c=>c.status==='upcoming');
  return cur?cur.k:null;
}
/* Arriving from somewhere else lands on the list of cycles; links that
   name an event or a cycle (the calendar, the bell) go straight to it. */
function rosterGo(){
  closeDrawer();
  if(curPage!=='roster'){ _rosterJump=true; nav('roster'); return; }
  renderRoster();
  /* Each level is a new screen, so it starts at the top and gets the same
     staggered entrance as a page change. */
  const p=document.getElementById('page-roster');
  if(p){ p.classList.remove('enter'); void p.offsetWidth; p.classList.add('enter'); setTimeout(()=>p.classList.remove('enter'),900); }
  try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); }
}
function openRosterHome(){
  ROSTER_VIEW='cycles'; ROSTER_K=null;
  /* A receipt has been read by now. A preview that has not been saved is
     kept: it is still there when you come back into its cycle. */
  if(ROSTER_PLAN&&ROSTER_PLAN.applied){ ROSTER_PLAN=null; PLAN_OPEN.clear(); }
  rosterGo();
}
function openCycle(k){
  k=Number(k);
  if(ROSTER_PLAN&&ROSTER_PLAN.k!==k){ ROSTER_PLAN=null; PLAN_OPEN.clear(); }
  ROSTER_VIEW='cycle'; ROSTER_K=k; ROSTER_BAR_K=k;
  rosterGo();
}
function cyclePretty(k){
  const s=cyStart(k),e=cyStart(k+1);
  const mon=i=>MON_UP[i].charAt(0)+MON_UP[i].slice(1).toLowerCase();
  const sm=+s.slice(5,7)-1,em=+e.slice(5,7)-1;
  return s.slice(0,4)===e.slice(0,4)?mon(sm)+' – '+mon(em)+' '+s.slice(0,4)
                                    :mon(sm)+' '+s.slice(0,4)+' – '+mon(em)+' '+e.slice(0,4);
}
function cycleDates(k){ return fmtShort(cyStart(k))+' › '+fmtShort(addDaysLocal(cyStart(k+1),-1)); }
/* One pass over a cycle's events, in the calendar's own words: not built,
   draft, on the calendar. Drafts are split by whether they can go up with
   one press (complete) or need a deliberate one (gaps). */
function cycleSummary(k){
  const evs=eventsInCycle(k);
  const s={evs:evs,n:evs.length,built:0,live:0,unbuilt:0,drafts:0,short:0,ready:[],gapDrafts:[]};
  for(const e of evs){
    const sc=slotCounts(e);
    if(e.confirmed) s.live++;
    if(!sc.generated){ s.unbuilt++; continue; }
    s.built++; s.short+=sc.missing;
    if(!e.confirmed){ s.drafts++; (sc.missing?s.gapDrafts:s.ready).push(e); }
  }
  return s;
}
function evStateHTML(e){
  const sc=slotCounts(e);
  const st=e.confirmed?'lv':(sc.generated?'dr':'nb');
  const label=e.confirmed?'On the calendar':(sc.generated?'Draft':'Not built');
  return '<span class="cal-st st-'+st+'">'+label+(sc.generated&&sc.missing?' · <b>'+sc.missing+' short</b>':'')+'</span>';
}

/* ── 1. THE CYCLES ── */
function cycleCardHTML(c){
  const s=cycleSummary(c.k);
  let line;
  if(!s.n) line='No events yet';
  else if(s.unbuilt===s.n) line='Not generated';
  else if(s.live===s.n) line='All on the calendar';
  else line=[s.live?s.live+' on the calendar':'',s.drafts?s.drafts+' draft'+(s.drafts===1?'':'s'):'',
             s.unbuilt?s.unbuilt+' not built':''].filter(Boolean).join(' · ');
  if(s.short&&c.status!=='historic') line+=' · <b>'+s.short+' short</b>';
  const seg=(n,cls)=>n?'<i class="'+cls+'" style="flex:'+n+'"></i>':'';
  return '<button class="cy-card st-'+c.status+'" onclick="openCycle('+c.k+')">'+
    '<span class="cy-top"><span class="cyc-tag '+c.status+'">'+c.status.toUpperCase()+'</span>'+
      '<span class="cy-count">'+s.n+' event'+(s.n===1?'':'s')+'</span></span>'+
    '<span class="cy-name">'+esc(cyclePretty(c.k))+'</span>'+
    '<span class="cy-dates">'+esc(cycleDates(c.k))+'</span>'+
    '<span class="cy-prog" aria-hidden="true">'+(s.n?seg(s.live,'lv')+seg(s.drafts,'dr')+seg(s.unbuilt,'nb'):'<i class="nb" style="flex:1"></i>')+'</span>'+
    '<span class="cy-line">'+line+'</span>'+
    '</button>';
}
function renderCyclePicker(){
  const live=CYCLES.filter(c=>c.status!=='historic'), past=CYCLES.filter(c=>c.status==='historic').slice().reverse();
  let h='<div class="ph"><div><h1>Roster</h1><p>Pick a cycle to generate, check and publish its rosters.</p></div>'+
    (IS_EDIT?'<div class="ha"><button class="btn btn-da btn-sm" onclick="openResetCycle()">Reset next cycle</button></div>':'')+'</div>';
  if(!CYCLES.length) return h+'<div class="empty-gen"><div class="zap">📅</div><h3>No cycles found</h3><p>Nothing to roster yet.</p></div>';
  h+='<div class="cy-legend"><span class="cal-legend"><i class="st-nb"></i>Not built <i class="st-dr"></i>Draft <i class="st-lv"></i>On the calendar</span></div>';
  if(live.length) h+='<div class="cy-grid">'+live.map(cycleCardHTML).join('')+'</div>';
  if(past.length) h+='<div class="cy-sec">Past cycles · read only</div><div class="cy-grid past">'+past.map(cycleCardHTML).join('')+'</div>';
  return h;
}

/* ── 2. ONE CYCLE ──
   Left: the cycle, its event days, and — after a generate — the Cycle
   summary of what that run did. Middle: the event days themselves; click
   one and its roster opens right there, editable in place.

   Generating saves and puts every day on the calendar at once, unfilled
   slots and all; they simply show blank. Taking a day down is the
   deliberate act now (Hide from calendar), not putting it up. */
let ROSTER_OPEN=null;           // the event day expanded in the cycle view
function renderCycleView(k){
  const meta=CYCLES.find(c=>c.k===k)||{status:'upcoming'};
  const hist=meta.status==='historic', s=cycleSummary(k);
  const edit=IS_EDIT&&!hist;
  const plan=ROSTER_PLAN&&ROSTER_PLAN.k===k&&ROSTER_PLAN.applied?ROSTER_PLAN:null;
  const hidden=s.evs.filter(e=>slotCounts(e).generated&&!e.confirmed).length;

  let side='<div class="cv-card">'+
    '<span class="cyc-tag '+meta.status+'">'+meta.status.toUpperCase()+'</span>'+

    '<div class="cv-dates">'+esc(cycleDates(k))+'</div>'+

        '<span class="cv-t"><span class="nm">'+esc(e.name)+'</span><span class="st st-'+cls+'">'+note+'</span></span></button>';
    }
    side+='</div>';
  }
  if(plan) side+='<div class="cv-sum">'+renderPlanPanel()+'</div>';

  let main='';

    main='<div class="empty-gen"><div class="zap">📅</div><h3>No events in this cycle</h3><p>'+

        '<button class="btn btn-bl gc-btn" onclick="askGenerateCycle('+k+')">⚡ Generate entire cycle</button></div>';
    main+='<div class="cy-evs-h"><h2>Event days</h2><span class="cv-hint">Click a day to see who is on</span></div><div class="cv-days">';
    for(const e of s.evs) main+=dayCardHTML(e,edit);

    '<div class="cv-layout"><aside class="cv-side" aria-label="This cycle">'+side+'</aside>'+
    '<section class="cv-main" aria-label="Event days">'+main+'</section></div>';

function dayCardHTML(e,edit){
  const tm=TYPE_META[e.type]||TYPE_META.custom, sc=slotCounts(e), d=new Date(e.date+'T12:00:00');
  const open=ROSTER_OPEN===e.id, built=!!sc.generated;

  let h='<div class="cv-day'+(open?' open':'')+'" id="day-'+e.id+'">'+
    '<button class="cv-dh" aria-expanded="'+(open?'true':'false')+'" onclick="openDay('+e.id+')">'+
      '<span class="ce-date"><b>'+d.getDate()+'</b><span>'+MON_UP[d.getMonth()]+'</span><small>'+esc(fmtDowLong(e.date).slice(0,3))+'</small></span>'+

        '<span class="cv-sub">'+sum+' · '+esc(e.uniform||'Casual')+(e.cover_name?' · cover: '+esc(e.cover_name):'')+'</span></span>'+
      pill+'<span class="cv-car" aria-hidden="true">›</span></button>';
  if(open){
    h+='<div class="cv-db">';

      h+='<div class="cv-dacts">';
      if(built) h+='<button class="btn btn-ol btn-sm" onclick="toggleDayCalendar('+e.id+')">'+(e.confirmed?'Hide from calendar':'Put back on the calendar')+'</button>'+
                   '<button class="btn btn-ol btn-sm" onclick="askRegenerateDay('+e.id+')">↻ Regenerate day</button>';
      h+='<button class="btn btn-ol btn-sm" onclick="openFullRoster('+e.id+')">Open full roster</button></div>';

             :'<div class="cv-empty"><p>No roster has been built for this day.</p></div>';

/* Expanding a day also selects it, so the slot picker and chip menu —
   which work on the selected event — edit the day you are looking at. */
function openDay(id,fromSide){
  const ev=EVENTS.find(e=>e.id===id); if(!ev) return;
  const k=cycleForDate(ev.date);
  if(ROSTER_K!==k){ ROSTER_K=ROSTER_BAR_K=k; }
  ROSTER_OPEN=(ROSTER_OPEN===id&&!fromSide)?null:id;
  selEventId=id; ROSTER_VIEW='cycle';
  if(curPage!=='roster'){ _rosterJump=true; nav('roster'); }
  else renderRoster();
  if(ROSTER_OPEN===id) setTimeout(()=>{
    const el=document.getElementById('day-'+id);
    if(el&&el.scrollIntoView){ try{ el.scrollIntoView({behavior:'smooth',block:'start'}); }catch(e){ el.scrollIntoView(); } }
  },fromSide?30:0);
}
function openFullRoster(id){
  selEventId=id; ROSTER_VIEW='event';
  const ev=selEvent(); if(ev) ROSTER_K=ROSTER_BAR_K=cycleForDate(ev.date);
  rosterGo();
}
async function toggleDayCalendar(id){
  const ev=EVENTS.find(e=>e.id===id); if(!ev||!IS_EDIT||isHistoricEvent(ev)) return;
  selEventId=id; await toggleConfirm();
}

/* Generating. A cycle with nothing built goes straight through. Once
   anything is built, a regenerate asks first: what is on the calendar is
   left alone unless the lead ticks the box, because those are the days
   people have already been told about. Duties set by hand always survive. */
function askGenerateCycle(k){
  if(!IS_EDIT) return;
  const s=cycleSummary(k);
  if(!s.n) return toast('No events in this cycle to build','err');
  if(!s.built) return runGenerate(k,false);
  const liveBuilt=s.evs.filter(e=>e.confirmed&&slotCounts(e).generated).length;
  const rest=s.n-liveBuilt;
  oM('<h3>Regenerate this cycle?</h3>'+
    '<p style="font-size:14px;color:var(--dm);line-height:1.6;margin-bottom:12px">'+
      (rest?'<b style="color:var(--dt)">'+rest+'</b> day'+(rest===1?'':'s')+' not on the calendar will be rebuilt. ':'')+
      (liveBuilt?'The <b style="color:var(--gold-lt)">'+liveBuilt+'</b> on the calendar stay exactly as they are unless you tick the box below. ':'')+
      'Duties set by hand are kept either way.</p>'+
    (liveBuilt?'<label class="gp-live" style="padding:0 0 6px"><input type="checkbox" id="genLive"><span>Also re-roll the <b>'+liveBuilt+'</b> on the calendar — people already told their duty will move</span></label>':'')+
    '<div class="macts"><button class="btn btn-ol" onclick="cM()">Cancel</button>'+
    '<button class="btn btn-bl" onclick="const c=document.getElementById(\'genLive\');cM();runGenerate('+k+',!!(c&&c.checked))">⚡ Regenerate</button></div>');
}
async function runGenerate(k,includeLive){
  if(!IS_EDIT) return;
  if(!MEMBERS.some(m=>m.status==='active')) return toast('No active members','err');
  const plan=buildPlan(k,null,{includeLive:!!includeLive});
  if(!plan) return toast('No events in this cycle to build','err');
  if(!plan.buildCount) return toast('Every day is on the calendar — tick the box to re-roll them','err');
  PLAN_OPEN.clear(); ROSTER_VIEW='cycle'; ROSTER_K=ROSTER_BAR_K=k;
  await applyPlan(plan,{publish:'new'});
}
function askRegenerateDay(id){
  const ev=EVENTS.find(e=>e.id===id); if(!ev||!IS_EDIT||evLocked(ev)) return;
  oM('<h3>Regenerate this day?</h3><p style="font-size:14px;color:var(--dm);line-height:1.6">'+
    esc(ev.name)+' on '+esc(fmtShort(ev.date))+' is rebuilt from scratch'+(ev.confirmed?', and it is on the calendar, so people already told their duty may move':'')+
    '. Duties set by hand are kept.</p>'+
    '<div class="macts"><button class="btn btn-ol" onclick="cM()">Cancel</button>'+
    '<button class="btn btn-bl" onclick="cM();generateDay('+id+')">↻ Regenerate</button></div>');
}
/* One day, built on its own against everyone's duties in the rest of the
   cycle (computeCounts reads every other roster). Nothing else is touched.
   A day that had no roster goes on the calendar; one that had a roster
   keeps whatever visibility the lead gave it. */
async function generateDay(id,opts){
  if(!IS_EDIT) return;
  const ev=EVENTS.find(e=>e.id===id); if(!ev) return;
  if(evLocked(ev)) return toast('This event is locked','err');
  if(!MEMBERS.some(m=>m.status==='active')) return toast('No active members','err');
  const k=cycleForDate(ev.date);
  const plan=buildPlan(k,id);
  if(!plan) return toast('This event cannot be built','err');
  if(opts&&opts.midCycle) plan.midCycle=opts.midCycle;
  PLAN_OPEN.clear(); PLAN_OPEN.add(id);
  ROSTER_VIEW='cycle'; ROSTER_K=ROSTER_BAR_K=k; ROSTER_OPEN=id; selEventId=id;
  await applyPlan(plan,{publish:'new'});
}

/* ── 3. ONE EVENT ── */
function renderEventPage(ev){
  const k=cycleForDate(ev.date), evs=eventsInCycle(k), i=evs.findIndex(e=>e.id===ev.id);
  const prev=i>0?evs[i-1]:null, next=i>=0&&i<evs.length-1?evs[i+1]:null;
  let h='<div class="ro-crumbs"><button class="btn btn-ol btn-sm" onclick="openCycle('+k+')">'+esc(cyclePretty(k))+'</button>'+
    '<span class="rc-here">'+esc(ev.name)+' · '+esc(fmtShort(ev.date))+'</span>'+
    '<span class="rc-nav">'+
      (prev?'<button class="btn btn-ol btn-sm" onclick="openFullRoster('+prev.id+')" aria-label="Previous event: '+esc(prev.name)+'">‹</button>':'')+
      (next?'<button class="btn btn-ol btn-sm" onclick="openFullRoster('+next.id+')" aria-label="Next event: '+esc(next.name)+'">›</button>':'')+
    '</span></div>';
  return h+renderEventView(ev);
}

/* Rebuilding a cycle re-rolls rosters that are already on the calendar and
   there is no undo, so it used to describe itself in a modal first \u2014 how
   many events, how many already built, how many hand-set duties would be
   kept. That was the right instinct in the wrong place: a modal has room
   for four lines of summary and none at all for the thing a lead actually
   wants, which is the roster itself before it is stored. previewCycle()
   says all of the same things, and then shows the work. Kept as a
   delegate so nothing that still calls it goes to a dead end. */

function renderRoster(){
  const el=document.getElementById('body-roster'); if(!el) return;
  let v=ROSTER_VIEW;
  if(v==='event'&&!selEvent()) v=ROSTER_K!=null?'cycle':'cycles';
  if(v==='cycle'&&(ROSTER_K==null||!CYCLES.some(c=>c.k===ROSTER_K))) v='cycles';
  ROSTER_VIEW=v;
  el.innerHTML=v==='cycles'?renderCyclePicker():v==='cycle'?renderCycleView(ROSTER_K):renderEventPage(selEvent());
}
function renderEventView(ev){

    '<div class="u">'+esc(ev.uniform||'Casual')+' Uniform</div></div>';

  if(IS_EDIT&&!hist){

  }

  h+='<button class="btn btn-ol" onclick="copyRoster()">⧉ Copy (WhatsApp)</button>';

  if(IS_EDIT&&!hist) h+='<button class="btn btn-da btn-sm" title="Delete event" onclick="confirmDeleteEvent()">🗑</button>';

  /* Generating puts a roster on the calendar, so reaching this state now
     means somebody took it off on purpose — or the publish half of a

  else if(IS_EDIT && hasRoster){
    h+='<div class="ib" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">'+
      '<span><b>Hidden from the calendar</b> \u2014 only the leads can see this roster.</span>'+
      '<button class="btn btn-gd btn-sm" onclick="toggleConfirm()" style="margin-left:auto;white-space:nowrap">Put back on the calendar</button>'+
      '</div>';
  }
  if(!IS_EDIT&&!ev.confirmed) return h+'<div class="empty-gen"><div class="zap">⏳</div><h3>Roster not published yet</h3><p>The '+esc(TEAM_NAME)+' leaders have not put this one on the calendar. It appears here as soon as they do.</p></div>';
  if(!hasRoster){

}
/* The roster table for one event. Shared by the full roster page and the
   day cards in the cycle view, so both edit the same way. */
function dutyTableHTML(ev){
  const data=ROSTERS[ev.id]||{assign:{}}, locked=evLocked(ev);
  const duties=dutiesForEvent(ev);
  let h='';
  const core=duties.filter(d=>d.section!=='mph'),mph=duties.filter(d=>d.section==='mph');
  h+='<div class="tw"><div class="tw-scroll"><table class="duty"><thead><tr><th style="width:230px">Duty</th><th>Male</th><th>Female</th></tr></thead><tbody>';
  if(core.length) h+='<tr class="sec"><td colspan="3">ADULTS &amp; YOUTH</td></tr>';
  for(const d of core) h+=renderDutyRow(ev,d,data,locked);
  const knownKeys=new Set(duties.map(d=>d.key));
  const extras=Object.keys(data.assign||{}).filter(key=>!knownKeys.has(key)&&people(data.assign[key]).length);
  if(extras.length){ h+='<tr class="sec"><td colspan="3">OTHER (SAVED EARLIER)</td></tr>'; for(const key of extras) h+=renderLegacyRow(legacyLabel(key),data.assign[key]); }
  if(mph.length) h+='<tr class="sec"><td colspan="3">REC CONGREGATION</td></tr>';
  for(const d of mph) h+=renderDutyRow(ev,d,data,locked);
  h+='</tbody></table></div></div>';
  return h;
}
function renderLegacyRow(label,a){
  const male=(a.m||[]).map(p=>esc(p.name||'?')),female=(a.f||[]).map(p=>esc(p.name||'?'));
  (a.x||[]).forEach(p=>{ const mem=memById(p.id); ((mem&&mem.gender)==='Female'?female:male).push(esc(p.name||'?')); });
  const chip=n=>'<span class="chip">'+n+'</span>';
  return '<tr><td class="dn2">'+esc(label)+'<span class="lock-badge">🗄 Old duty set — read only</span></td>'+
    '<td data-col="Male"><div class="cellwrap">'+(male.map(chip).join('')||'<span style="color:var(--dm)">—</span>')+'</div></td>'+
    '<td data-col="Female"><div class="cellwrap">'+(female.map(chip).join('')||'<span style="color:var(--dm)">—</span>')+'</div></td></tr>';
}
function chipHTML(ev,dutyKey,arrName,idx,p,locked){
  const mem=memById(p.id); const away=mem&&isAway(mem,ev.date);
  /* "away" was carried by a strikethrough plus a title= — a styling a
     colour-blind user may not register and a tooltip a touch user cannot
     reach. It is a word now. */
  const note=away?'<span class="chip-note">away</span>':'';
  const nm=esc(p.name||'?');
  if(locked) return '<span class="chip'+(away?' away':'')+'">'+nm+note+'</span>';
  return '<button class="chip'+(away?' away':'')+'" aria-label="'+nm+' — change or remove" '+
    'onclick="openPicker(\''+escJs(dutyKey)+'\',\''+escJs(arrName)+'\','+idx+')">'+
    nm+note+'<span class="chip-more" aria-hidden="true">⋯</span></button>';
}
/* One tap on a person opens this. It carries the two actions that used to
   be hover-only, and the two things the roster never told anybody: whether
   this person is away, and that a hand-set duty survives a rebuild. */
function openChipMenu(dutyKey,arrName,idx){
  const ev=selEvent(); if(!ev||evLocked(ev)) return;

  const per=a&&a[arrName]&&a[arrName][idx]; if(!per) return;

      esc(duty)+' · '+esc(fmtShort(ev.date))+'</p>';

    'the cycle will leave it exactly as it is.</div>';
  h+='<div class="macts" style="flex-direction:column;align-items:stretch;justify-content:flex-start">'+
     '<button class="btn btn-bl" onclick="cM();openPicker('+q(dutyKey)+','+q(arrName)+','+idx+')">↔ Swap for someone else</button>'+
     '<button class="btn btn-da" onclick="cM();confirmRemoveSlot('+q(dutyKey)+','+q(arrName)+','+idx+')">× Remove from this duty</button>'+
     '<button class="btn btn-ol" onclick="cM()">Cancel</button></div>';
  oM(h);
}
/* Taking somebody off a roster that is already on the calendar leaves a
   hole three hundred people can see, and removeSlot has never asked. It
   asks only in that case — a draft needs no ceremony. */
function confirmRemoveSlot(dutyKey,arrName,idx){
  const ev=selEvent(); if(!ev) return;
  if(!ev.confirmed) return removeSlot(dutyKey,arrName,idx);
  const r=ROSTERS[ev.id]; const a=r&&r.assign&&r.assign[dutyKey];
  const per=a&&a[arrName]&&a[arrName][idx];
  const nm=(per&&per.name)||'This person';
  const q=s=>"'"+escJs(s)+"'";
  oM('<h3>Remove from a live roster</h3>'+
    '<p style="font-size:14px;color:var(--dm);line-height:1.6">'+esc(nm)+' is on <b style="color:var(--dt)">'+
      esc(legacyLabel(dutyKey))+'</b> for '+esc(fmtShort(ev.date))+
      ', which is on the calendar. Removing them leaves the duty short until somebody fills it.</p>'+
    '<div class="macts"><button class="btn btn-ol" onclick="cM()">Cancel</button>'+
    '<button class="btn btn-da" onclick="cM();removeSlot('+q(dutyKey)+','+q(arrName)+','+idx+')">Remove anyway</button></div>');
}
function renderDutyRow(ev,d,data,locked){
  const a=(data.assign&&data.assign[d.key])||{m:[],f:[],x:[]};
  const manual=data.manual&&data.manual[d.key];
  const warns=(data.warn&&data.warn[d.key])||[];
  const maleChips=[],femaleChips=[];
  (a.m||[]).forEach((p,i)=>maleChips.push(chipHTML(ev,d.key,'m',i,p,locked)));
  (a.f||[]).forEach((p,i)=>femaleChips.push(chipHTML(ev,d.key,'f',i,p,locked)));
  (a.x||[]).forEach((p,i)=>{ const mem=memById(p.id); const g=(mem&&mem.gender)||'Male'; (g==='Female'?femaleChips:maleChips).push(chipHTML(ev,d.key,'x',i,p,locked)); });
  const total=(a.m||[]).length+(a.f||[]).length+(a.x||[]).length;
  let missM=Math.max(0,(d.reqM||0)-(a.m||[]).length);
  let missF=Math.max(0,(d.reqF||0)-(a.f||[]).length);
  let missX=Math.max(0,(d.reqAny||0)-total-missM-missF);
  /* Gated on IS_EDIT rather than `locked`, which also covers historic
     events — a lead looking back should still see where the team was short.
     A volunteer gets an empty space instead: UNASSIGNED is a job for whoever
     builds the roster, not a message for whoever reads it. */
  /* An unfilled slot is a blank, dashed place to put somebody. It shows
     blank on the calendar too; volunteers see nothing there at all. */
  const un=col=>!IS_EDIT ? ''
    : locked
    ? '<span class="chip blank">Blank</span>'
    : '<button class="chip blank" aria-label="Blank '+esc(d.name)+' slot — assign somebody" '+
      'onclick="addToSlot(\''+escJs(d.key)+'\',\''+col+'\')">+ Assign</button>';
  for(let i=0;i<missM;i++) maleChips.push(un('m'));
  for(let i=0;i<missF;i++) femaleChips.push(un('f'));
  for(let i=0;i<missX;i++) (maleChips.length<=femaleChips.length?maleChips:femaleChips).push(
    un(maleChips.length<=femaleChips.length?'m':'f'));
  /* + Add only where there is no blank already: it is for an extra pair
     of hands beyond what the duty needs. */
  const hasBlank=list=>list.some(c=>c.indexOf('chip blank')>=0);
  if(!locked&&!hasBlank(maleChips)) maleChips.push('<button class="chip add" onclick="addToSlot(\''+escJs(d.key)+'\',\'m\')">+ Add</button>');
  if(!locked&&!hasBlank(femaleChips)) femaleChips.push('<button class="chip add" onclick="addToSlot(\''+escJs(d.key)+'\',\'f\')">+ Add</button>');
  const warnHtml=warns.length?'<div class="warns">'+warns.map(w=>'<span class="warn-chip">⚠ '+esc(w)+'</span>').join('')+'</div>':'';
  return '<tr><td class="dn2">'+esc(d.name)+(manual?'<span class="lock-badge">🔒 Set by hand</span>':'')+warnHtml+'</td>'+
    '<td data-col="Male"><div class="cellwrap">'+maleChips.join('')+'</div></td>'+
    '<td data-col="Female"><div class="cellwrap">'+femaleChips.join('')+'</div></td></tr>';
}

function flashChip(name){

    .forEach(c=>{ c.classList.add('flash'); setTimeout(()=>c.classList.remove('flash'),1200); }); },30);

async function applyPick(memberId){
  const ev=selEvent(); if(!ev||!PICKER_CTX) return;
  const m=memById(memberId); if(!m) return;
  const r=ensureRoster(ev);
  const a=r.assign[PICKER_CTX.dutyKey]=r.assign[PICKER_CTX.dutyKey]||{m:[],f:[],x:[]};
  const arr=a[PICKER_CTX.arr]=a[PICKER_CTX.arr]||[];
  const entry={id:m.id,name:m.name};
  // Capture the duty and anyone displaced before the arrays change — the
  // log's job here is to answer "who took me off this duty", which needs
  // the duty name and the person replaced, not just the new name.
  const _duty=legacyLabel(PICKER_CTX.dutyKey);
  const _replaced=(PICKER_CTX.idx==null)?null:(arr[PICKER_CTX.idx]&&arr[PICKER_CTX.idx].name);
  if(PICKER_CTX.idx==null) arr.push(entry); else arr[PICKER_CTX.idx]=entry;
  r.manual[PICKER_CTX.dutyKey]=true;
  invalidatePlan();      // a staged build predates this edit and would overwrite it
  cM(); PICKER_CTX=null;
  await saveRoster(ev.id);
  /* A hand edit leaves the day where it is. Days go on the calendar when
     they are generated and come off only when a lead hides them, so filling
     a slot on a hidden day must not quietly put it back. */
  auditLog('manual-assign','roster',ev.name+' '+ev.date+' \u2014 '+_duty+': '+
    (_replaced ? _replaced+' \u2192 '+m.name : 'added '+m.name));
  renderRoster(); refreshBadges();
  flashChip(m.name);
  toast(m.name+' assigned');
}
async function removeSlot(dutyKey,arrName,idx){
  const ev=selEvent(); if(!ev||evLocked(ev)) return;
  const r=ensureRoster(ev); const a=r.assign[dutyKey]; if(!a||!a[arrName]||idx>=a[arrName].length) return;
  const rm=a[arrName].splice(idx,1)[0]; r.manual[dutyKey]=true;
  invalidatePlan();      // as above — the staged build no longer matches what is on screen
  await saveRoster(ev.id);
  auditLog('manual-remove','roster',ev.name+' '+ev.date+' \u2014 '+legacyLabel(dutyKey)+
    ': removed '+(rm&&rm.name||'?'));
  renderRoster(); refreshBadges();
  /* A live roster stays live even when a gap opens in it. Pulling it back
     off the calendar would take the duty off three hundred phones because
     one person was moved, which is worse than the gap — so the lead is
     told about it instead. */
  const gaps=slotCounts(ev).missing;
  const loud=!!ev.confirmed && gaps>0;
  toast((rm&&rm.name||'Member')+' removed'+
    (loud ? ' — '+gaps+' slot'+(gaps===1?'':'s')+' now unfilled, and this roster is on the calendar' : ''),
    loud ? 'err' : 'ok');
}
