/* ═══════════════ TOKENS (evolved IV Hub system — matches av.html family) ═══════════════ */
:root{
  --navy:#0C2461;--navy2:#1e3799;--blue:#1565C0;--blue2:#1976D2;--blue-lt:#4FC3F7;
  --red:#C0392B;
  --dp:#020B18;--ds:#071628;--ds2:#0D2040;
  --dt:#E8F4FD;--dm:#7AAECB;--db:rgba(79,195,247,0.16);
  --pur:#7C3AED;--pur-bg:rgba(124,58,237,0.12);--pur-bd:rgba(124,58,237,0.3);
  --gold:#F59E0B;--gold-lt:#FCD34D;--gold-bg:rgba(245,158,11,0.12);--gold-bd:rgba(245,158,11,0.3);
  --r:10px;
  --ds3:#132B52;--dm2:#4A6A85;--db2:rgba(79,195,247,0.32);
  --green:#10B981;--green-lt:#4ADE80;--red2:#EF4444;--red-lt:#F87171;
  --r-sm:8px;--r-lg:16px;--r-xl:20px;
  --sh-1:0 1px 2px rgba(0,0,0,.35),0 3px 12px rgba(2,11,24,.35);
  --sh-2:0 4px 14px rgba(0,0,0,.4),0 14px 44px rgba(2,11,24,.5);
  --sh-glow:0 6px 22px rgba(21,101,192,.38);
  --surface-grad:linear-gradient(180deg,rgba(79,195,247,.05),rgba(79,195,247,0) 130px);
  --hairline:1px solid rgba(79,195,247,.14);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;scrollbar-gutter:stable;}
body{font-variant-numeric:tabular-nums;font-weight:700;font-stretch:85%;font-family:'Archivo',sans-serif;background:var(--dp);color:var(--dt);min-height:100vh;
  background-image:radial-gradient(ellipse 60% 40% at 85% -5%,rgba(21,101,192,.10),transparent 65%);}
::-webkit-scrollbar{width:6px;height:6px;}::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(79,195,247,.3);border-radius:3px;}
::selection{background:rgba(79,195,247,.32);color:#fff;}
:focus-visible{outline:2px solid rgba(79,195,247,.65);outline-offset:2px;border-radius:4px;}
img{-webkit-user-drag:none;}
button,input,select,textarea{font-family:'Archivo',sans-serif;}
.tnum,.dn,.sc-v,.next-d,td,.dash-clock,.num{font-variant-numeric:tabular-nums;letter-spacing:0;}
input,select,textarea{color:var(--dt);background:rgba(2,11,24,.5);border:1px solid var(--db);border-radius:var(--r-sm);padding:9px 12px;font-size:14px;outline:none;transition:border-color .18s,box-shadow .18s;}
input:focus,select:focus,textarea:focus{border-color:var(--blue-lt);box-shadow:0 0 0 3px rgba(79,195,247,.1);}
select option{background:var(--ds2);color:var(--dt);}
input[type=date]{color-scheme:dark;}
a{color:var(--blue-lt);text-decoration:none;}

/* ─── MOTION ─── */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pageIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes panelIn{from{opacity:.4;transform:translateX(46px)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{opacity:.4;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes navIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(79,195,247,.35)}70%{box-shadow:0 0 0 18px rgba(79,195,247,0)}100%{box-shadow:0 0 0 0 rgba(79,195,247,0)}}
@keyframes skShimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes slideInL{from{opacity:.3;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes slideInR{from{opacity:.3;transform:translateX(-24px)}to{opacity:1;transform:none}}
.fadeUp{animation:fadeUp .4s cubic-bezier(.16,1,.3,1) both;}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important;}html{scroll-behavior:auto;}}

/* skeleton */
.sk-line{height:12px;border-radius:6px;margin-bottom:10px;background:linear-gradient(90deg,rgba(79,195,247,.05) 25%,rgba(79,195,247,.15) 50%,rgba(79,195,247,.05) 75%);background-size:200% 100%;animation:skShimmer 1.4s linear infinite;}
.sk-line.w40{width:40%}.sk-line.w70{width:72%}.sk-line.w55{width:55%}
.skel{border-radius:var(--r);background:linear-gradient(90deg,var(--ds) 25%,var(--ds2) 50%,var(--ds) 75%);background-size:200% 100%;animation:skShimmer 1.4s linear infinite;}

/* ═══════════════ APP SHELL ═══════════════ */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:238px;background:linear-gradient(180deg,#081A31,#071628 40%);border-right:var(--hairline);display:flex;flex-direction:column;z-index:300;padding:18px 0 14px;transition:width .28s cubic-bezier(.16,1,.3,1),transform .28s cubic-bezier(.16,1,.3,1);}
.sb-logo{display:flex;align-items:center;gap:11px;padding:2px 16px 16px;border-bottom:var(--hairline);}
.sb-logo-img{display:block;width:38px;height:38px;border-radius:50%;background:#fff;object-fit:contain;flex-shrink:0;transition:transform .5s cubic-bezier(.16,1,.3,1);}
.sb-logo:hover .sb-logo-img{transform:rotate(180deg) scale(1.06);}
.sb-logo-fallback{display:none;width:38px;height:38px;border-radius:10px;background:var(--blue2);color:#fff;font-weight:900;font-size:16px;align-items:center;justify-content:center;flex-shrink:0;}
.sb-title{min-width:0;}
.sb-title h2{font-size:15px;font-weight:900;color:var(--blue-lt);text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap;}
.sb-title p{font-size:11px;color:var(--dm);white-space:nowrap;}
#sbCollapse{margin-left:auto;flex-shrink:0;width:26px;height:26px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--dm2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s;}
#sbCollapse:hover{border-color:var(--db);color:var(--blue-lt);background:var(--ds2);}
.sb-nav{flex:1;padding:12px 8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;overflow-x:hidden;}
.hub-link{display:flex;align-items:center;gap:9px;padding:9px 12px;margin:0 3px 10px;border:1px solid var(--db);border-radius:var(--r);color:var(--blue-lt);font-size:13px;font-weight:800;text-decoration:none;transition:all .18s;white-space:nowrap;}
.hub-link:hover{background:rgba(79,195,247,.08);border-color:var(--db2);}
.nav-sec{font-size:11px;font-weight:900;color:var(--dm2);text-transform:uppercase;letter-spacing:0.06em;padding:10px 12px 5px;white-space:nowrap;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-sm);cursor:pointer;color:var(--dm);font-size:13px;font-weight:700;border:1px solid transparent;position:relative;white-space:nowrap;transition:all .2s cubic-bezier(.16,1,.3,1);animation:navIn .4s cubic-bezier(.16,1,.3,1) backwards;}
.nav-item:hover{background:var(--ds2);color:var(--dt);transform:translateX(3px);}
.nav-item.active{background:linear-gradient(90deg,rgba(79,195,247,.14),rgba(79,195,247,.05));color:var(--blue-lt);border-color:rgba(79,195,247,.22);}
.nav-item::before{content:'';position:absolute;left:-8px;top:22%;bottom:22%;width:3px;border-radius:3px;background:linear-gradient(180deg,var(--blue-lt),var(--blue2));transform:scaleY(0);transition:transform .25s cubic-bezier(.16,1,.3,1);}
.nav-item.active::before{transform:scaleY(1);}
.nav-item .ni{width:18px;text-align:center;font-size:15px;flex-shrink:0;}
.nav-item .nbadge{margin-left:auto;font-size:11px;font-weight:900;background:rgba(239,68,68,.16);color:var(--red-lt);border:1px solid rgba(239,68,68,.3);border-radius:11px;padding:1px 7px;}
/* The bell. Shown only when there is something to do, so it never becomes
   furniture people stop noticing. Parked in the bottom-right corner, one
   toast-height up so a message can slide in underneath without covering
   it. The corner is the one spot that is free at every width: the left is
   the sidebar below 1101px and the menu button below 900px, and the top
   is the nav bar. */
.bell-fab{position:fixed;right:18px;bottom:76px;z-index:340;display:flex;align-items:center;gap:9px;
  background:var(--ds);border:1px solid var(--gold-bd);color:var(--dt);border-radius:24px;
  padding:10px 16px 10px 14px;font-family:'Archivo',sans-serif;font-size:13px;font-weight:800;
  cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .15s,box-shadow .2s;}
.bell-fab:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(0,0,0,.55);}
.bell-fab .ni{font-size:16px;line-height:1;}
.bell-fab .nbadge{margin-left:2px;background:var(--gold-bg);color:var(--gold-lt);border:1px solid var(--gold-bd);
  border-radius:11px;padding:1px 8px;font-size:11.5px;font-weight:900;}
.bell-fab.lit .ni{animation:bellRing 2.4s ease-in-out 1;}
/* On a phone the label is dropped and it becomes a plain round button
   with the count clipped to its edge, so it takes up almost no screen. */
@media(max-width:640px){
  .bell-fab-t{display:none;}
  .bell-fab{position:fixed;padding:0;gap:0;width:50px;height:50px;border-radius:50%;justify-content:center;}
  .bell-fab .ni{font-size:19px;}
  .bell-fab .nbadge{position:absolute;top:-5px;right:-5px;margin:0;min-width:21px;text-align:center;
    background:var(--gold);color:#1A1206;border-color:var(--gold);}
}
@keyframes bellRing{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-11deg)}80%{transform:rotate(9deg)}90%{transform:rotate(-5deg)}}
@media (prefers-reduced-motion: reduce){ .bell-fab.lit .ni{animation:none;} }
/* Opens upwards from the button, right-aligned with it, so a long list
   grows into the empty page instead of off the bottom of the screen. */
.bell-pop{display:none;position:fixed;z-index:500;width:320px;max-width:calc(100vw - 24px);
  background:var(--ds2);border:1px solid var(--db);border-radius:9px;overflow:hidden;
  box-shadow:0 18px 44px rgba(0,0,0,.55);}
.bell-pop.open{display:block;}
.bell-row{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--db);
  padding:9px 12px;cursor:pointer;font-family:'Archivo',sans-serif;color:var(--dt);font-size:12.5px;line-height:1.45;}
.bell-row:last-child{border-bottom:none;}
.bell-row:hover{background:var(--ds);}
.bell-row b{display:block;font-size:12.5px;font-weight:800;}
.bell-row small{display:block;color:var(--dm);font-size:11.5px;margin-top:1px;}
.bell-row .tag{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--gold-lt);}
.sb-nav .nav-item:nth-of-type(1){animation-delay:.02s}.sb-nav .nav-item:nth-of-type(2){animation-delay:.05s}
.sb-nav .nav-item:nth-of-type(3){animation-delay:.08s}.sb-nav .nav-item:nth-of-type(4){animation-delay:.11s}
.sb-nav .nav-item:nth-of-type(5){animation-delay:.14s}.sb-nav .nav-item:nth-of-type(6){animation-delay:.17s}
.sb-nav .nav-item:nth-of-type(7){animation-delay:.2s}
.sb-bot{padding:12px 12px 0;border-top:var(--hairline);}
.uchip{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--ds2);border:1px solid rgba(79,195,247,.1);border-radius:var(--r);}
.uav{width:29px;height:29px;background:linear-gradient(135deg,var(--navy),var(--blue2));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#fff;flex-shrink:0;}
.uinfo{min-width:0;flex:1;}
.uinfo #unm{font-size:13px;font-weight:800;color:var(--dt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.uinfo #url{font-size:11px;font-weight:700;color:var(--dm);text-transform:uppercase;letter-spacing:0.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.uacts{display:flex;align-items:center;gap:9px;flex-shrink:0;}
#syncDot{width:8px;height:8px;border-radius:50%;background:#555;display:inline-block;flex-shrink:0;transition:background .3s;}
.uout{background:transparent;border:none;color:var(--dm);font-size:14px;cursor:pointer;padding:2px;border-radius:5px;line-height:1;}
.uout:hover{color:var(--red-lt);}
body.sb-min .sidebar{width:70px;}
body.sb-min .sb-title,body.sb-min .nav-sec,body.sb-min .hub-link .hl-t,body.sb-min .nav-item .nt,body.sb-min .nav-item .nbadge,body.sb-min .uinfo{display:none;}
body.sb-min .sb-logo{justify-content:center;padding-left:8px;padding-right:8px;}
body.sb-min #sbCollapse{position:absolute;top:66px;left:50%;transform:translateX(-50%);margin:0;}
body.sb-min .sb-nav{padding-top:34px;}
body.sb-min .nav-item,body.sb-min .hub-link{justify-content:center;padding-left:0;padding-right:0;}
body.sb-min .uchip{flex-direction:column;gap:6px;padding:8px 4px;}
body.sb-min .main{margin-left:70px;}
#menuBtn{display:none;position:fixed;top:12px;left:12px;z-index:400;width:40px;height:40px;border-radius:10px;background:var(--ds);border:1px solid var(--db);color:var(--blue-lt);font-size:18px;cursor:pointer;align-items:center;justify-content:center;box-shadow:var(--sh-1);}
#sideOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:299;backdrop-filter:blur(2px);}
#sideOverlay.show{display:block;}

/* ─── MAIN / PAGES ─── */
.main{margin-left:238px;padding:26px 30px 80px;min-height:100vh;max-width:1360px;transition:margin-left .28s cubic-bezier(.16,1,.3,1);}
.page{display:none;}
.page.active{display:block;animation:pageIn .32s cubic-bezier(.16,1,.3,1);}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:14px;flex-wrap:wrap;}
.ph h1{font-size:22px;font-weight:900;text-transform:uppercase;letter-spacing:0.03em;}
.ph p{color:var(--dm);font-size:12px;margin-top:4px;line-height:1.55;max-width:660px;}
.ha{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}

/* ─── BUTTONS ─── */
.btn{padding:8px 15px;border-radius:var(--r);font-size:13px;font-weight:800;cursor:pointer;border:none;transition:all .2s cubic-bezier(.16,1,.3,1);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn:active{transform:scale(.965);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-bl{background:linear-gradient(135deg,var(--navy),var(--blue2));color:#fff;box-shadow:0 2px 10px rgba(21,101,192,.25);}
.btn-bl:hover{box-shadow:var(--sh-glow);transform:translateY(-1px);}
.btn-ol{background:rgba(79,195,247,.03);color:var(--dm);border:1px solid var(--db);}
.btn-ol:hover{border-color:var(--blue-lt);color:var(--blue-lt);}
.btn-da{background:rgba(239,68,68,.1);color:var(--red-lt);border:1px solid rgba(239,68,68,.3);}
.btn-da:hover{background:rgba(239,68,68,.18);}
.btn-gd{background:var(--gold-bg);color:var(--gold-lt);border:1px solid var(--gold-bd);}
.btn-gd:hover{border-color:var(--gold);}
.btn-gd.on{background:var(--gold);color:#20180a;border-color:var(--gold);}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:var(--r-sm);}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:99px;font-size:12px;font-weight:800;cursor:pointer;border:1px solid var(--db);background:var(--ds2);color:var(--dm);transition:all .18s;}
.pill.on{background:rgba(16,185,129,.13);border-color:rgba(16,185,129,.4);color:var(--green-lt);}

/* ─── PANELS / TABLES ─── */
.pnl{background:var(--ds);background-image:var(--surface-grad);border:var(--hairline);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-1);}
.pnl-h{padding:13px 18px;display:flex;align-items:center;gap:9px;font-size:12px;font-weight:900;color:var(--dt);letter-spacing:0.06em;text-transform:uppercase;border-bottom:var(--hairline);background:rgba(79,195,247,.03);}
.pnl-h .ct{margin-left:auto;font-size:12px;font-weight:700;color:var(--dm);text-transform:none;letter-spacing:0;}
.pnl-b{padding:16px 18px;}
.ib{background:rgba(21,101,192,.07);border:1px solid rgba(21,101,192,.24);border-radius:var(--r);padding:11px 15px;font-size:13px;color:var(--dm);line-height:1.6;margin-bottom:14px;}
/* Not styled like a hint. Work that is not stored is not a suggestion. */
.ib-warn{background:rgba(239,68,68,.10);border-color:rgba(239,68,68,.45);color:#FCA5A5;}
.ib-warn b{color:#FECACA;}
.ib b,.ib a{color:var(--dt);}.ib a{color:var(--blue-lt);font-weight:800;}
.hint-banner{background:var(--gold-bg);border:1px solid var(--gold-bd);color:var(--gold-lt);border-radius:var(--r);padding:10px 15px;font-size:13px;font-weight:700;margin-bottom:14px;display:flex;gap:8px;align-items:center;}
.tw{background:var(--ds);background-image:var(--surface-grad);border:var(--hairline);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-1);}
.tw-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{padding:11px 15px;text-align:left;font-size:11px;font-weight:900;color:var(--dm);text-transform:uppercase;letter-spacing:0.06em;background:rgba(79,195,247,.04);border-bottom:var(--hairline);white-space:nowrap;}
td{padding:10px 15px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.035);vertical-align:top;}
tr:last-child td{border-bottom:none;}
tbody tr{transition:background .12s;}tbody tr:hover td{background:rgba(79,195,247,.035);}
.bdg{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:800;}
.bdg-ok{background:rgba(16,185,129,.14);color:#6EE7B7;border:1px solid rgba(16,185,129,.28);}
.bdg-no{background:rgba(122,139,170,.12);color:var(--dm);border:1px solid rgba(122,139,170,.2);}
.bdg-gd{background:var(--gold-bg);color:var(--gold-lt);border:1px solid var(--gold-bd);}
.bdg-warn{background:rgba(239,68,68,.12);color:var(--red-lt);border:1px solid rgba(239,68,68,.3);}
.count-chip{font-size:12px;font-weight:900;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.4);color:var(--green-lt);padding:4px 11px;border-radius:99px;}

/* ─── DASHBOARD ─── */
.hero{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
  background:linear-gradient(135deg,rgba(21,101,192,.16),rgba(7,22,40,.75) 55%),radial-gradient(ellipse at 88% 0%,rgba(79,195,247,.13),transparent 60%);
  border:1px solid rgba(79,195,247,.2);border-radius:var(--r-lg);padding:22px 26px;margin-bottom:18px;position:relative;overflow:hidden;}
.hero::after{content:'';position:absolute;right:-70px;bottom:-90px;width:250px;height:250px;background:url('logo.png') no-repeat center/contain;opacity:.045;pointer-events:none;}
.dash-greet{font-size:24px;font-weight:900;background:linear-gradient(135deg,#fff 30%,#90CAF9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.dash-date{font-size:13px;color:var(--dm);margin-top:4px;}
.dash-today{font-size:14px;color:#B8D8F0;margin-top:13px;background:rgba(79,195,247,.07);border:1px solid rgba(79,195,247,.2);border-radius:var(--r);padding:9px 14px;display:inline-block;line-height:1.55;}
.dash-today b{color:var(--dt);}
.dash-clock-wrap{display:flex;align-items:center;gap:15px;position:relative;z-index:1;}
.dash-hero-logo{width:50px;height:50px;border-radius:50%;background:#fff;box-shadow:0 6px 22px rgba(2,11,24,.5);}
.dash-clock{font-size:28px;font-weight:800;color:var(--blue-lt);text-shadow:0 0 26px rgba(79,195,247,.35);}
.dash-clock-lbl{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:0.06em;color:var(--dm2);text-align:right;margin-top:2px;}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
.sc{background:var(--ds);background-image:var(--surface-grad);border:var(--hairline);border-radius:var(--r-lg);padding:16px 18px;position:relative;overflow:hidden;cursor:pointer;text-align:left;color:var(--dt);box-shadow:var(--sh-1);transition:transform .25s cubic-bezier(.16,1,.3,1),border-color .25s,box-shadow .25s;}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--blue2),var(--blue-lt),transparent 85%);opacity:.85;}
.sc:hover{transform:translateY(-3px);border-color:rgba(79,195,247,.35);box-shadow:0 12px 30px rgba(2,11,24,.45);}
.sc-l{font-size:11px;font-weight:900;color:var(--dm);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;}
.sc-v{font-size:31px;font-weight:900;color:var(--blue-lt);line-height:1;}
.sc-s{font-size:12px;color:var(--dm2);margin-top:7px;line-height:1.4;}
.sc.alert{border-color:rgba(239,68,68,.42);}.sc.alert::before{background:linear-gradient(90deg,#B91C1C,var(--red-lt),transparent 85%);}.sc.alert .sc-v{color:var(--red-lt);}
.sc.ok-green .sc-v{color:var(--green-lt);}
.dash-2col{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-bottom:16px;}
.next-row{display:flex;align-items:center;gap:13px;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.035);cursor:pointer;transition:background .14s;}
.next-row:hover{background:rgba(79,195,247,.045);}.next-row:last-child{border-bottom:none;}
.next-d{min-width:50px;text-align:center;}
.next-d .d{font-size:20px;font-weight:900;color:var(--dt);line-height:1;}
.next-d .w{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:0.06em;color:var(--dm2);margin-top:3px;}
.next-who{flex:1;min-width:0;}
.next-who .n{font-size:14px;font-weight:800;color:var(--dt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.next-who .m{font-size:12px;color:var(--dm);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.next-tag{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:0.06em;padding:3px 10px;border-radius:12px;white-space:nowrap;flex-shrink:0;}
.next-tag.ok{background:rgba(16,185,100,.13);color:var(--green-lt);border:1px solid rgba(16,185,100,.3);}
.next-tag.warn{background:rgba(239,68,68,.13);color:var(--red-lt);border:1px solid rgba(239,68,68,.3);}
.next-tag.today{background:rgba(79,195,247,.13);color:var(--blue-lt);border:1px solid rgba(79,195,247,.3);}
.empty-note{text-align:center;padding:22px 14px;color:var(--dm2);font-size:13px;}
.qa-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}

/* ─── ROSTER LAYOUT ─── */
.roster-layout{display:grid;grid-template-columns:284px 1fr;gap:16px;align-items:start;}
.rl-side{background:var(--ds);border:var(--hairline);border-radius:var(--r-lg);padding:12px 10px;position:sticky;top:14px;max-height:calc(100vh - 40px);overflow-y:auto;}
.sb-label{font-size:11px;font-weight:900;letter-spacing:0.06em;color:var(--dm);text-transform:uppercase;padding:4px 6px 10px;}
.cyc-group{margin-bottom:9px;border:1px solid var(--db);border-radius:12px;overflow:hidden;background:rgba(13,32,64,.35);}
.cyc-head{display:flex;align-items:center;gap:8px;width:100%;padding:9px 11px;background:transparent;border:none;cursor:pointer;color:var(--dt);text-align:left;}
.cyc-head:hover{background:var(--ds2);}
.cyc-head .car{font-size:11px;color:var(--dm);transition:transform .2s;flex:none;}
.cyc-group.open .cyc-head .car{transform:rotate(90deg);}
.cyc-title{font-size:12px;font-weight:900;letter-spacing:0.04em;flex:1;min-width:0;}
.cyc-tag{font-size:11px;font-weight:900;letter-spacing:0.06em;padding:2px 7px;border-radius:99px;flex:none;}
.cyc-tag.historic{background:rgba(122,174,203,.12);color:var(--dm);border:1px solid rgba(122,174,203,.3);}
.cyc-tag.current{background:rgba(16,185,129,.14);color:var(--green-lt);border:1px solid rgba(16,185,129,.4);}
.cyc-tag.upcoming{background:rgba(79,195,247,.12);color:var(--blue-lt);border:1px solid var(--db);}
.cyc-body{display:none;padding:4px 7px 8px;}
.cyc-group.open .cyc-body{display:block;}
.ev-card{display:block;width:100%;text-align:left;background:var(--ds2);border:1px solid var(--db);border-radius:10px;padding:8px 10px;margin:5px 0;cursor:pointer;color:var(--dt);transition:all .16s;}
.ev-card:hover{border-color:var(--blue-lt);transform:translateX(2px);}
.ev-card.sel{border-color:var(--blue-lt);background:rgba(21,101,192,.22);box-shadow:0 0 0 1px var(--blue-lt) inset;}
.ev-card .ev-nm{font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px;}
.ev-card .ev-dt{font-size:12px;color:var(--dm);margin-top:2px;}
.ev-badge{font-size:11px;font-weight:900;letter-spacing:0.06em;padding:2px 6px;border-radius:5px;color:#fff;flex:none;}
.ev-conf{color:var(--gold-lt);font-size:12px;flex:none;}
.cyc-empty{font-size:12px;color:var(--dm);padding:8px 6px;font-style:italic;}
.add-ev-btn{width:100%;padding:10px;border:1.5px dashed var(--db);background:transparent;color:var(--dm);border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;transition:all .18s;margin-top:6px;}
.add-ev-btn:hover{border-color:var(--blue-lt);color:var(--blue-lt);}

.ev-banner{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--navy),var(--blue));border-radius:12px;padding:14px 20px;margin-bottom:14px;box-shadow:0 8px 26px rgba(12,36,97,.4);}
.ev-banner .t{font-size:17px;font-weight:900;text-transform:uppercase;letter-spacing:0.03em;color:#fff;}
.ev-banner .d{font-size:13px;color:rgba(232,244,253,.82);margin-top:2px;}
.ev-banner .u{margin-left:auto;font-size:12px;font-weight:900;letter-spacing:0.06em;text-transform:uppercase;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:5px 12px;border-radius:99px;color:#fff;flex:none;}
.ro-note{display:flex;align-items:center;gap:8px;background:var(--gold-bg);border:1px solid var(--gold-bd);color:var(--gold-lt);font-size:13px;font-weight:700;border-radius:10px;padding:9px 14px;margin-bottom:12px;}
.ev-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;}
table.duty{min-width:560px;}
table.duty td{padding:9px 14px;}
tr.sec td{background:rgba(21,101,192,.14);font-size:12px;font-weight:900;letter-spacing:0.06em;color:var(--blue-lt);padding:7px 14px;}
td.dn2{font-size:13px;font-weight:800;width:230px;color:var(--dt);}
td.dn2 .lock{font-size:12px;margin-left:5px;}
td.dn2 .warns{margin-top:4px;display:flex;flex-direction:column;gap:3px;}
.warn-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--gold-lt);background:var(--gold-bg);border:1px solid var(--gold-bd);border-radius:6px;padding:2px 7px;width:fit-content;}
.cellwrap{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:26px;}
.chip{position:relative;display:inline-flex;align-items:center;gap:5px;background:var(--ds2);border:1px solid var(--db);border-radius:7px;padding:4px 9px;font-size:13px;font-weight:700;transition:all .15s;animation:popIn .2s ease both;}
.chip:hover{border-color:var(--blue-lt);}
.chip .acts{display:none;gap:2px;margin-left:2px;}
.chip:hover .acts{display:inline-flex;}
.chip .acts button{background:transparent;border:none;color:var(--dm);cursor:pointer;font-size:12px;padding:0 3px;border-radius:3px;line-height:1.4;}
.chip .acts button:hover{color:var(--blue-lt);}
.chip .acts button.rm:hover{color:var(--red-lt);}
.chip.un{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.5);color:var(--red-lt);font-weight:900;font-size:12px;letter-spacing:0.06em;}
.chip.add{background:transparent;border:1.5px dashed var(--db);color:var(--dm);cursor:pointer;font-size:12px;font-weight:800;}
.chip.add:hover{color:var(--blue-lt);border-color:var(--blue-lt);}
.chip.away{opacity:.6;text-decoration:line-through;}
.empty-gen{text-align:center;padding:56px 20px;border:1.5px dashed var(--db);border-radius:14px;background:rgba(13,32,64,.25);}
.empty-gen .zap{font-size:34px;}
.empty-gen h3{font-size:19px;font-weight:900;margin:10px 0 4px;text-transform:uppercase;letter-spacing:0.04em;}
.empty-gen p{font-size:13px;color:var(--dm);margin-bottom:16px;line-height:1.5;}
.empty-gen .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.rules-line{font-size:12px;color:var(--dm);margin-top:16px;line-height:1.5;}

/* ─── CALENDAR ─── */
.cal-nav{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.cal-nav h3{font-size:18px;font-weight:900;text-transform:uppercase;letter-spacing:0.04em;min-width:180px;text-align:center;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal-grid.anim-l{animation:slideInL .3s ease both;}.cal-grid.anim-r{animation:slideInR .3s ease both;}
.cal-dow{font-size:11px;font-weight:900;letter-spacing:0.06em;color:var(--dm);text-align:center;padding:4px 0;}
.cal-cell{min-height:78px;background:var(--ds);border:1px solid var(--db);border-radius:9px;padding:5px 6px;font-size:12px;position:relative;transition:border .15s;}
.cal-cell.out{opacity:.32;}
.cal-cell.mine{background:rgba(21,101,192,.16);border-color:rgba(79,195,247,.35);}
.cal-cell.today{outline:2px solid var(--gold);outline-offset:-1px;}
.cal-cell .dnum{font-weight:900;}
.cal-cell .towner{position:absolute;top:4px;right:5px;font-size:11px;font-weight:900;padding:1px 5px;border-radius:4px;background:var(--ds2);color:var(--dm);border:1px solid var(--db);}
.cal-cell.mine .towner{background:var(--blue2);color:#fff;border-color:transparent;}
.cal-ev{display:block;width:100%;text-align:left;margin-top:3px;background:var(--blue2);color:#fff;border:none;border-radius:5px;padding:2px 5px;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-ev:hover{filter:brightness(1.2);}
.cal-ev.conf{background:var(--gold);color:#20180a;}

/* ─── FAIRNESS / REPORTS ─── */
.fbar{height:8px;border-radius:99px;background:var(--ds2);overflow:hidden;min-width:110px;}
.fbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--blue-lt));transition:width .5s ease;}
.rbar{height:8px;border-radius:99px;background:var(--ds2);overflow:hidden;min-width:90px;}
.rbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--green-lt));}
.rbar i.low{background:linear-gradient(90deg,#B91C1C,var(--red-lt));}
.seg{display:inline-flex;border:1px solid var(--db);border-radius:8px;overflow:hidden;}
.seg button{background:transparent;border:none;color:var(--dm);font-size:12px;font-weight:800;padding:6px 12px;cursor:pointer;border-right:1px solid var(--db);}
.seg button:last-child{border-right:none;}
.seg button.on{background:var(--blue2);color:#fff;}

/* ─── ATTENDANCE ─── */
.duty-chip{display:inline-block;background:var(--ds2);border:1px solid var(--db);border-radius:6px;
  padding:2px 7px;margin:3px 5px 0 0;font-size:11.5px;font-weight:800;color:var(--blue-lt);}
.duty-chip.none{color:var(--dm);border-style:dashed;}
.att-duties{margin-top:2px;}
.lead-tag{display:inline-block;background:rgba(252,211,77,.16);border:1px solid rgba(252,211,77,.4);
  color:var(--gold-lt);border-radius:5px;padding:1px 6px;font-size:10.5px;font-weight:900;margin-left:6px;}
.att-row.unmarked{border-left:3px solid var(--gold-lt);}
.att-key.present{color:var(--green-lt);} .att-key.late{color:var(--gold-lt);}
.att-key.excused{color:#C4B5FD;} .att-key.absent{color:var(--red-lt);}
.att-seg-present{background:var(--green);} .att-seg-late{background:var(--gold);}
.att-seg-excused{background:#8B5CF6;} .att-seg-absent{background:var(--red);}
.att-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.035);}
.att-row:last-child{border-bottom:none;}
.att-nm{flex:1;min-width:0;font-size:14px;font-weight:800;}
.att-nm .sub{font-size:12px;font-weight:600;color:var(--dm);}
.att-seg{display:inline-flex;gap:4px;flex-wrap:wrap;}
.att-btn{background:var(--ds2);border:1px solid var(--db);color:var(--dm);font-size:12px;font-weight:900;padding:5px 10px;border-radius:7px;cursor:pointer;letter-spacing:0.04em;transition:all .14s;}
.att-btn:hover{border-color:var(--blue-lt);}
.att-btn.present.on{background:rgba(16,185,129,.16);border-color:rgba(16,185,129,.5);color:var(--green-lt);}
.att-btn.late.on{background:var(--gold-bg);border-color:var(--gold-bd);color:var(--gold-lt);}
.att-btn.excused.on{background:rgba(124,58,237,.16);border-color:var(--pur-bd);color:#C4B5FD;}
.att-btn.absent.on{background:rgba(239,68,68,.16);border-color:rgba(239,68,68,.5);color:var(--red-lt);}

/* ─── MEMBERS ─── */
.mem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.mem-card{background:var(--ds);background-image:linear-gradient(180deg,rgba(79,195,247,.04),transparent 90px);border:var(--hairline);border-radius:var(--r);padding:14px 15px;cursor:pointer;transition:transform .2s cubic-bezier(.16,1,.3,1),border-color .2s;}
.mem-card:hover{border-color:rgba(79,195,247,.38);transform:translateY(-2px);}
.mem-card .mc-top{display:flex;align-items:center;gap:10px;}
.mem-av{width:38px;height:38px;border-radius:10px;background:rgba(79,195,247,.1);border:1px solid rgba(79,195,247,.25);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:var(--blue-lt);flex-shrink:0;}
.mem-card .mc-nm{font-size:14px;font-weight:900;}
.mem-card .mc-meta{font-size:12px;color:var(--dm);margin-top:2px;}
.mem-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px;}
.mem-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.dchips{display:flex;flex-wrap:wrap;gap:6px;}
.dchip-tog{font-size:12px;font-weight:800;padding:5px 10px;border-radius:8px;border:1px solid var(--db);background:var(--ds2);color:var(--dm);cursor:pointer;transition:all .14s;}
.dchip-tog:hover{border-color:var(--blue-lt);}
.dchip-tog.prefer{background:rgba(16,185,129,.14);border-color:rgba(16,185,129,.45);color:var(--green-lt);}
.dchip-tog.avoid{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.45);color:var(--red-lt);}
.away-chip{display:inline-flex;align-items:center;gap:6px;background:var(--ds2);border:1px solid var(--db);border-radius:7px;padding:4px 9px;font-size:12px;font-weight:700;}
.away-chip button{background:none;border:none;color:var(--dm);cursor:pointer;font-size:13px;}
.away-chip button:hover{color:var(--red-lt);}

/* ─── DRAWER (right slide-in / bottom sheet) ─── */
.mo{position:fixed;inset:0;background:rgba(2,8,18,.6);z-index:500;display:none;backdrop-filter:blur(5px);}
.mo.show{display:block;}
.mbox{position:fixed;top:0;right:0;bottom:0;width:452px;max-width:96vw;background:linear-gradient(180deg,#0A1F3C,#071628 320px);border-left:1px solid var(--db2);box-shadow:-24px 0 70px rgba(0,0,0,.6);padding:24px 24px 34px;overflow-y:auto;animation:panelIn .3s cubic-bezier(.16,1,.3,1);}
.dpx{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:9px;background:rgba(79,195,247,.06);border:1px solid var(--db);color:var(--dm);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.dpx:hover{color:var(--dt);border-color:var(--db2);}
.dp-date{font-size:26px;font-weight:900;line-height:1.05;color:var(--dt);padding-right:40px;}
.dp-dow{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:0.06em;color:var(--dm);margin-top:6px;}
.dp-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
.dp-chip{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:0.06em;padding:4px 11px;border-radius:14px;}
.dp-chip.ok{background:rgba(16,185,100,.13);color:var(--green-lt);border:1px solid rgba(16,185,100,.32);}
.dp-chip.lock{background:rgba(79,195,247,.1);color:var(--blue-lt);border:1px solid rgba(79,195,247,.3);}
.dp-sec{font-size:11px;font-weight:900;color:var(--dm);text-transform:uppercase;letter-spacing:0.06em;margin:20px 0 8px;}
.dp-card{background:rgba(2,11,24,.45);border:var(--hairline);border-radius:var(--r);padding:11px 14px;}
.dp-card+.dp-card{margin-top:7px;}
.dp-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.dp-row:last-child{border-bottom:none;}
.dp-row .dl{color:var(--dm);}.dp-row .dv{font-weight:800;text-align:right;}
.dp-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px;}
.flabel{display:block;font-size:11px;font-weight:900;color:var(--dm);text-transform:uppercase;letter-spacing:0.06em;margin:14px 0 6px;}
.frow{margin-bottom:11px;}
.frow input,.frow select,.frow textarea{width:100%;}

/* ─── DIALOG (centered modal — pickers/confirms) ─── */
.dlg{position:fixed;inset:0;background:rgba(2,11,24,.72);z-index:600;display:none;align-items:flex-start;justify-content:center;padding:6vh 14px 40px;overflow-y:auto;backdrop-filter:blur(3px);}
.dlg.show{display:flex;}
.dcard{background:var(--ds);border:1px solid var(--db2);border-radius:16px;padding:22px;width:560px;max-width:100%;box-shadow:var(--sh-2);animation:popIn .25s ease both;}
.dcard h3{font-size:17px;font-weight:900;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:14px;color:var(--blue-lt);}
.dcard .macts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;}
.pick-list{max-height:46vh;overflow-y:auto;margin-top:8px;border:1px solid var(--db);border-radius:10px;}
.pick-row{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:none;border-bottom:1px solid rgba(79,195,247,.08);padding:8px 12px;color:var(--dt);cursor:pointer;transition:background .13s;}
.pick-row:hover{background:var(--ds2);}.pick-row:last-child{border-bottom:none;}
.pick-row .nm{font-size:14px;font-weight:800;flex:1;min-width:0;}
.pick-row .meta{font-size:12px;color:var(--dm);flex:none;text-align:right;}
.pick-flag{font-size:11px;font-weight:900;padding:2px 6px;border-radius:5px;background:var(--gold-bg);border:1px solid var(--gold-bd);color:var(--gold-lt);flex:none;}

/* ─── TOAST / NO-ACCESS ─── */
.toast{position:fixed;bottom:18px;right:18px;background:#0B2040;border:1px solid var(--db2);border-radius:var(--r);padding:11px 16px;font-size:13px;font-weight:700;z-index:9999;display:flex;align-items:center;gap:8px;box-shadow:var(--sh-2);transform:translateX(140%);transition:transform .38s cubic-bezier(.34,1.56,.64,1);max-width:min(430px,92vw);}
.toast.show{transform:translateX(0);}
.toast.ok{border-color:rgba(16,185,129,.45);}.toast.ok::before{content:'✓';color:var(--green-lt);font-weight:900;}
.toast.err{border-color:rgba(239,68,68,.5);}.toast.err::before{content:'✕';color:var(--red-lt);font-weight:900;}
.noaccess{position:fixed;inset:0;background:var(--dp);z-index:1000;display:flex;align-items:center;justify-content:center;background-image:radial-gradient(ellipse at 20% 50%,rgba(21,101,192,.18) 0%,transparent 60%);}
.noaccess .box{background:var(--ds);border:1px solid var(--db2);border-radius:16px;padding:40px;text-align:center;max-width:400px;animation:fadeUp .4s ease both;}
.noaccess h2{font-size:19px;font-weight:900;margin-bottom:8px;}
.noaccess p{font-size:14px;color:var(--dm);margin-bottom:18px;line-height:1.5;}

/* ─── EXPORT CARD (offscreen) ─── */
/* ── PRINTED ROSTER SHEET (WhatsApp image export) ── */
.sheet{width:1080px;background:#040D1C;color:#E8F4FD;font-family:'Archivo',sans-serif;border:1px solid rgba(79,195,247,.22);}
.sheet-hd{display:flex;align-items:center;gap:18px;padding:30px 38px 26px;background:linear-gradient(135deg,#050E1E 0%,#0A1E3E 55%,#091830 100%);border-bottom:2px solid rgba(79,195,247,.28);}
.sheet-logo{width:70px;height:70px;border-radius:50%;background:#fff;flex-shrink:0;}
.sheet-eyebrow{font-size:12px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:rgba(179,229,252,.55);}
.sheet-team{font-size:36px;font-weight:900;letter-spacing:0.03em;text-transform:uppercase;color:#fff;line-height:1.08;margin-top:5px;}
.sheet-uni{margin-left:auto;font-size:13px;font-weight:900;letter-spacing:0.06em;text-transform:uppercase;color:#4FC3F7;border:2px solid rgba(79,195,247,.45);border-radius:99px;padding:9px 20px;white-space:nowrap;}
.sheet-sec{padding:26px 38px 0;}
.sheet-title{text-align:center;font-size:20px;font-weight:900;color:#fff;padding:13px 16px;border-radius:11px;background:linear-gradient(90deg,rgba(21,101,192,.55),rgba(21,101,192,.22));border:1px solid rgba(79,195,247,.38);}
.sheet-title.rec{background:linear-gradient(90deg,rgba(109,40,217,.55),rgba(109,40,217,.2));border-color:rgba(167,139,250,.42);}
table.sheet-t{width:100%;border-collapse:collapse;margin-top:15px;}
table.sheet-t th{font-size:12px;font-weight:900;letter-spacing:0.06em;text-transform:uppercase;color:#4FC3F7;text-align:left;padding:10px 13px;border-bottom:2px solid rgba(79,195,247,.35);}
table.sheet-t td{padding:10px 13px;font-size:16px;line-height:1.45;color:#E8F4FD;border-bottom:1px solid rgba(79,195,247,.1);vertical-align:top;}
table.sheet-t tbody tr:nth-child(even) td{background:rgba(79,195,247,.04);}
table.sheet-t td.c-d{font-weight:800;color:#fff;}
table.sheet-t td.none{color:#3F627A;}
.sheet-ft{margin-top:24px;padding:16px 38px 24px;border-top:1px solid rgba(79,195,247,.14);display:flex;justify-content:space-between;font-size:12px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:#2E5878;}
/* ── ROSTER IMAGE EXPORT ─────────────────────────────────────────────
   Rendered off-screen and rasterised by html2canvas, which is why this
   block re-states letter-spacing and font-stretch rather than inheriting
   them from the page.

   html2canvas 1.4.1 switches to per-character rendering the moment
   letter-spacing is non-zero — `0 !== e.letterSpacing ? splitGraphemes(t)
   : segmentWords(t)` in its source — and the spaces between words are lost
   when it does. It also never reads font-stretch at all, so it measures
   glyphs at one width and paints them at another. Both must be normal
   here, or the image comes out with every word run together.

   Palette is the site's own navy and blue, on white. The Hub's colours are
   built for light text on a dark ground, so the roles are inverted rather
   than reused directly: navy carries the weight that the pale blue carries
   on screen, and the light blues drop to tints and rules. */
.rx,.rx *{letter-spacing:normal!important;font-stretch:normal!important;}
.rx{width:1180px;background:#fff;color:#17263F;font-family:'Archivo',sans-serif;
  font-variant-numeric:tabular-nums;padding:26px 26px 20px;}
.rx-head{display:flex;align-items:center;gap:13px;padding:0 2px 15px;}
.rx-logo{width:46px;height:46px;border-radius:50%;background:#fff;object-fit:contain;}
.rx-org{font-size:14px;font-weight:700;color:#5A7FA6;}
.rx-org b{display:block;font-size:19px;font-weight:900;color:#0C2461;}
.rx-title{background:#0C2461;color:#fff;border:2px solid #0C2461;border-bottom:none;
  padding:13px 14px;text-align:center;font-size:23px;font-weight:900;}
.rx-t{width:100%;border-collapse:collapse;table-layout:fixed;border:2px solid #0C2461;}
.rx-t th,.rx-t td{border:1.5px solid rgba(12,36,97,.22);padding:9px 13px;vertical-align:middle;}
.rx-t thead th{background:#EEF3FA;font-size:14px;font-weight:900;color:#0C2461;
  text-align:center;padding:7px 13px;}
.rx-t thead th:first-child{text-align:left;}
.rx-d{font-size:19px;font-weight:900;color:#0C2461;width:31%;}
.rx-n{font-size:16px;font-weight:700;color:#17263F;text-align:center;line-height:1.45;}
.rx-n.none{color:#9DB4CC;}
.rx-t tbody tr:nth-child(even) td{background:#F7FAFD;}
.rx-sub{background:#1565C0;color:#fff;padding:11px 14px;text-align:center;
  font-size:19px;font-weight:900;}
.rx-ft{display:flex;justify-content:space-between;padding:13px 3px 0;
  font-size:13px;font-weight:700;color:#5A7FA6;}
.exp-card{width:760px;background:#020B18;color:#E8F4FD;font-family:'Archivo',sans-serif;padding:34px 38px;border:1px solid rgba(79,195,247,.25);}
.exp-head{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
.exp-logo{width:46px;height:46px;border-radius:50%;background:#fff;object-fit:contain;}
.exp-mono{width:46px;height:46px;border-radius:10px;background:#1976D2;color:#fff;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;}
.exp-head .et{font-size:23px;font-weight:900;text-transform:uppercase;letter-spacing:0.02em;}

<script>
'use strict';
/* ════════════════════════════════════════════
   IV HUB — TEAM ROSTER (modern rebuild)
   All team-specific behavior derives from PAGE_TEAM.
════════════════════════════════════════════ */
const PAGE_TEAM='A';
const TEAM_LC=PAGE_TEAM.toLowerCase();
const OTHER_TEAM=PAGE_TEAM==='A'?'B':'A';
const TEAM_NAME='Team '+PAGE_TEAM;
/* Director / Deputy / PHMU share one access level; 'iv_admin' is the legacy
   key they replaced. Facilitator has full admin over both IV teams. */
const IV_TOP=['owner','developer','director','deputy_director','phmu_lead','iv_admin'];
const VIEW_PERMS=IV_TOP.concat(['facilitator','tl_'+TEAM_LC,'ytl_'+TEAM_LC,'team_'+TEAM_LC]);
const EDIT_PERMS=IV_TOP.concat(['facilitator','tl_'+TEAM_LC,'ytl_'+TEAM_LC]);
const MOVE_PERMS=IV_TOP.concat(['facilitator']);
/* Volunteers get the General group: the duties calendar and
   announcements, plus the dashboard, which shows the day's roster for
   their own team. Rostering itself is a Management tool now — building a
   roster is not the same job as reading one. */
const VOLUNTEER_PAGES=['dashboard','calendar','announce'];

/* ── SESSION ── */
let CU=null;
try{ CU=JSON.parse(localStorage.getItem('ivhub_session')||'null'); }catch(e){ CU=null; }
/* redirect decision deferred to verifyAuth() in boot() */
const hasPerm=(...ps)=>ps.some(p=>((CU&&CU.perms)||[]).includes(p));
let IS_VIEW=!!CU&&hasPerm(...VIEW_PERMS);
let IS_EDIT=!!CU&&hasPerm(...EDIT_PERMS);
let CAN_MOVE=!!CU&&hasPerm(...MOVE_PERMS);
function applyNavScope(){
  if(IS_EDIT){                              // leaders see everything
    document.querySelectorAll('.nav-mgmt').forEach(n=>n.style.removeProperty('display'));
    return;
  }
  document.querySelectorAll('.nav-item[data-page]').forEach(n=>{
    if(VOLUNTEER_PAGES.indexOf(n.dataset.page)<0) n.style.display='none';
  });
  // The section heading has no data-page, so hide it explicitly or a
  // volunteer gets an empty "Management" group with nothing under it.
  document.querySelectorAll('.nav-sec.nav-mgmt').forEach(n=>n.style.display='none');
}
function recomputeAccess(){
  IS_VIEW=!!CU&&hasPerm(...VIEW_PERMS);
  IS_EDIT=!!CU&&hasPerm(...EDIT_PERMS);
  CAN_MOVE=!!CU&&hasPerm(...MOVE_PERMS);
}
/* Verify against Supabase Auth before showing anything. Permissions come
   from the `profiles` table under RLS, so a hand-edited ivhub_session
   grants nothing. Sign-in happens at the hub; without a valid Auth
   session we send the visitor there. */
async function verifyAuth(){
  // Wait for the Supabase library before deciding anything — it loads from a
  // CDN and is not ready the instant this runs.
  await waitSupabase();
  // Still nothing means we genuinely cannot verify identity. There is nothing
  // useful to show offline anyway (all data lives in the DB), so deny rather
  // than trust the cached session — otherwise blocking the CDN bypasses login.
  if(!sb){ denyAccess('offline'); return false; }
  try{
    // Supabase stores the signed-in session per site, so anyone who signed in
    // on the Hub is already signed in here — no second login.
    const {data}=await sb.auth.getSession();
    const sess=data&&data.session;
    if(!sess||!sess.user){ location.replace('index.html'); return false; }
    const {data:prof}=await sb.from('profiles').select('*').eq('id',sess.user.id).maybeSingle();
    if(!prof){ location.replace('index.html'); return false; }
    let perms=prof.perms;
    if(typeof perms==='string'){ try{ perms=JSON.parse(perms); }catch(e){ perms=[]; } }
    CU={ user:prof.username||(sess.user.email||'').split('@')[0], email:sess.user.email||'',
         display:prof.display||prof.username||sess.user.email, perms:Array.isArray(perms)?perms:[],
         role:(Array.isArray(perms)&&perms[0])||'', member_id:prof.member_id||null, uid:sess.user.id };
    try{ localStorage.setItem('ivhub_session',JSON.stringify(CU)); }catch(e){}
    recomputeAccess();
    return true;
  }catch(e){ console.warn('verifyAuth:',e.message||e); denyAccess('error'); return false; }
}
function denyAccess(kind){
  try{ localStorage.removeItem('ivhub_session'); }catch(e){}
  const offline = kind==='offline';
  document.body.insertAdjacentHTML('beforeend',
    '<div class="noaccess"><div class="box"><div style="font-size:30px">'+(offline?'\u{1F4E1}':'\u{1F512}')+'</div>'+
    '<h2>'+(offline?'No connection':'Sign in required')+'</h2>'+
    '<p>'+(offline
      ? 'Could not reach the server to check your sign-in. Check your internet and try again.'
      : 'Could not verify your sign-in. Sign in on the Hub and come back.')+'</p>'+
    (offline ? '<button class="btn btn-bl" onclick="location.reload()">Try again</button> ' : '')+
    '<a class="btn btn-ol" href="index.html">\u2190 Go to the Hub</a></div></div>');
}
/* The log entry is written and awaited before the session ends. Signing out
   first would send the insert without a token, and the audit log only
   accepts writes from someone signed in — so leaving this page recorded
   nothing at all, while the Hub and the AV page both recorded it. */
async function signOut(){
  try{ await auditLog('Signed out','login',(CU&&(CU.display||CU.user)||'Someone')+' signed out of '+TEAM_NAME); }catch(e){}
  try{ if(sb) await sb.auth.signOut(); }catch(e){}
  try{ localStorage.removeItem('ivhub_session'); }catch(e){}
  location.href='index.html';
}

/* ── SUPABASE ── */
const SB_URL = 'https://ysmkqvceezrjcrlixlii.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzbWtxdmNlZXpyamNybGl4bGlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNjk4NzcsImV4cCI6MjA5Mzg0NTg3N30.YHx-q-nR8qfFvk2dZnEg5knK6eDK-zCbPlyxPDknK4w';
let sb=null;
function initSupabase(){
  try{
    const lib=window.supabase||window.Supabase;
    if(lib&&lib.createClient){ sb=lib.createClient(SB_URL,SB_KEY); return true; }
    return false;
  }catch(e){ console.warn('Supabase init failed:',e); return false; }
}
function waitSupabase(){ // poll up to 3s for CDN lib; offline-tolerant if missing
  return new Promise(res=>{
    if(initSupabase()) return res(true);
    let waited=0;
    const t=setInterval(()=>{
      waited+=100;
      if(initSupabase()){ clearInterval(t); res(true); }
      else if(waited>=3000){ clearInterval(t); console.warn('Supabase library unavailable — offline mode'); res(false); }
    },100);
  });
}
function setSyncStatus(state){
  const el=document.getElementById('syncDot'); if(!el) return;
  const map={ok:['#00C853','Saved'],saving:['#FFC107','Saving…'],error:['#f44336','Sync error'],off:['#555','Offline mode']};
  const s=map[state]||map.off; el.style.background=s[0]; el.title=s[1];
}

/* ── UTILS ── */
function esc(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
/* JS-string-safe escape for values interpolated inside inline on* handlers.
   esc() is NOT safe there: the browser HTML-decodes the attribute before the JS
   parser runs, so &#39; becomes a real quote and breaks out. Hex escapes (\xHH)
   have no HTML-special chars, survive decoding intact, and JS parses them back to
   the literal char — so a name/role/username can never break the string. */
function escJs(s){
  return String(s==null?'':s).replace(/[^a-zA-Z0-9_ .:\/-]/g, function(c){
    return '\\x' + c.charCodeAt(0).toString(16).padStart(2,'0');
  });
}
let _toastTimer=null;
function toast(msg,type){
  type=type||'ok';
  const t=document.getElementById('toast');
  t.textContent=msg||''; t.className='toast '+(type==='err'?'err':'ok');
  void t.offsetWidth; t.classList.add('show');
  if(_toastTimer) clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>t.classList.remove('show'),3200);
}
/* drawer (right slide-in / bottom sheet) */
function openDrawer(h){ document.getElementById('mbox').innerHTML=h; document.getElementById('mo').classList.add('show'); }
function closeDrawer(){ document.getElementById('mo').classList.remove('show'); }
/* centered dialog (pickers / confirms) */
function oM(h){ document.getElementById('dcard').innerHTML=h; document.getElementById('dlg').classList.add('show'); }
function cM(){ document.getElementById('dlg').classList.remove('show'); }
let _pauseRT=false,_prtT=null;
function pauseRT(ms){ ms=ms||800; _pauseRT=true; if(_prtT)clearTimeout(_prtT); _prtT=setTimeout(()=>{_pauseRT=false;},ms); }
async function auditLog(action,category,detail){
  try{ if(!sb) return;
    // CU is null until verifyAuth() has run, and reading through it threw
    // silently — so anything logged early recorded nothing.
    const u=CU||{};
    await sb.from('audit_logs').insert({user_display:u.display||u.user||'',username:u.user||'',
      user_email:u.email||'',   // two people share a name; the address does not
      team:PAGE_TEAM,
      action:action,category:category,detail:detail||''});
  }catch(e){ /* best-effort */ }
}
function stableHash(s){ let h=2166136261; s=String(s); for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h; }
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sideOverlay').classList.toggle('show'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sideOverlay').classList.remove('show'); }
function toggleCollapse(){ document.body.classList.toggle('sb-min'); }

/* ════════════════════════════════════════════
   NEW-MOON / CHANDRAAT MODULE (VERIFIED — verbatim per contract)
════════════════════════════════════════════ */
function newMoonJD(k){
  const T=k/1236.85,T2=T*T,T3=T2*T,T4=T3*T,D2R=Math.PI/180;
  let JDE=2451550.09766+29.530588861*k+0.00015437*T2-0.000000150*T3+0.00000000073*T4;
  const E=1-0.002516*T-0.0000074*T2;
  const M=(2.5534+29.10535670*k-0.0000014*T2-0.00000011*T3)*D2R;
  const Mp=(201.5643+385.81693528*k+0.0107582*T2+0.00001238*T3-0.000000058*T4)*D2R;
  const F=(160.7108+390.67050284*k-0.0016118*T2-0.00000227*T3+0.000000011*T4)*D2R;
  const Om=(124.7746-1.56375588*k+0.0020672*T2+0.00000215*T3)*D2R;
  const s=Math.sin;
  let c=-0.40720*s(Mp)+0.17241*E*s(M)+0.01608*s(2*Mp)+0.01039*s(2*F)
   +0.00739*E*s(Mp-M)-0.00514*E*s(Mp+M)+0.00208*E*E*s(2*M)
   -0.00111*s(Mp-2*F)-0.00057*s(Mp+2*F)+0.00056*E*s(2*Mp+M)
   -0.00042*s(3*Mp)+0.00042*E*s(M+2*F)+0.00038*E*s(M-2*F)
   -0.00024*E*s(2*Mp-M)-0.00017*s(Om)-0.00007*s(Mp+2*M)
   +0.00004*s(2*Mp-2*F)+0.00004*s(3*M)+0.00003*s(Mp+M-2*F)
   +0.00003*s(2*Mp+2*F)-0.00003*s(Mp+M+2*F)+0.00003*s(Mp-M+2*F)

function newMoonDate(k){ return new Date((newMoonJD(k)-2440587.5)*86400000-69000); }

  year:'numeric',month:'2-digit',day:'2-digit'}).format(d); }

/* ── CYCLES ── */
const ANCHOR_K=327; // chandraatISO(327) = 2026-06-15 → Team B (contract anchor)
function teamForCycle(k){ return (((k-ANCHOR_K)%2)+2)%2===0?'B':'A'; }
let OVERRIDES={};
let _cyCache={};
function clearCycleCache(){ _cyCache={}; }
function cyStart(k){ if(_cyCache[k]===undefined) _cyCache[k]=chandraatISO(k,OVERRIDES); return _cyCache[k]; }
function cycleForDate(iso){
  const d=new Date(iso+'T12:00:00');
  const doy=(d-new Date(d.getFullYear(),0,0))/86400000;
  let k=Math.round((d.getFullYear()+doy/365.25-2000)*12.3685);
  for(let i=k-3;i<=k+3;i++){ if(cyStart(i)<=iso&&iso<cyStart(i+1)) return i; }
  return k;
}
function inCycleK(iso,k){ return iso>=cyStart(k)&&iso<cyStart(k+1); }
function nzTodayISO(){ return nzDateStr(new Date()); }
const MON_UP=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function cycleLabel(k){
  const s=cyStart(k),e=cyStart(k+1);
  const sm=+s.slice(5,7)-1,em=+e.slice(5,7)-1,sy=s.slice(0,4),ey=e.slice(0,4);
  return sy===ey?('CYCLE ('+MON_UP[sm]+'–'+MON_UP[em]+' '+sy+')')
               :('CYCLE ('+MON_UP[sm]+' '+sy+'–'+MON_UP[em]+' '+ey+')');
}
function buildCycles(){
  const today=nzTodayISO();
  const kNow=cycleForDate(today);
  const all=[];
  for(let k=kNow-11;k<=kNow+11;k++){
    if(teamForCycle(k)!==PAGE_TEAM) continue;
    const start=cyStart(k),end=cyStart(k+1);
    const status=end<=today?'historic':(start>today?'upcoming':'current');
    all.push({k,start,end,status});
  }
  const hist=all.filter(c=>c.status==='historic').slice(-4);
  const cur=all.filter(c=>c.status==='current');
  const up=all.filter(c=>c.status==='upcoming').slice(0,4);
  return hist.concat(cur,up);
}

/* ── GENERATOR EXTENSION (b) helper — duty-preference tie-break score.
   -1 = member lists this duty in prefs.prefer, +1 = prefs.avoid, 0 = neutral.
   Prefs store dutyKeys; pick() passes the duty display name → map via DUTY_INFO.
   Returns 0 (no effect, no randomness) whenever prefs are absent/empty, so an
   empty-prefs run is bit-for-bit identical to the original engine. */
function prefScore(m,dutyName){
  const p=m&&m.prefs;
  if(!p||typeof p!=='object'||Array.isArray(p)) return 0;
  const info=DUTY_INFO[dutyName]; const key=info?info.key:dutyName;
  if(Array.isArray(p.prefer)&&p.prefer.indexOf(key)>=0) return -1;
  if(Array.isArray(p.avoid)&&p.avoid.indexOf(key)>=0) return 1;
  return 0;
}

function eventsInCycle(k){ return EVENTS.filter(e=>inCycleK(e.date,k)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0); }
function isAway(m,date){ return Array.isArray(m.away)&&m.away.indexOf(date)>=0; }
function normMember(m){ if(!Array.isArray(m.away)) m.away=[]; if(!m.prefs||typeof m.prefs!=='object'||Array.isArray(m.prefs)) m.prefs={}; if(!Array.isArray(m.prefs.prefer)) m.prefs.prefer=[]; if(!Array.isArray(m.prefs.avoid)) m.prefs.avoid=[]; if(!m.rank) m.rank='Member'; return m; }

/* ── DATA LOAD ──────────────────────────────────────────────────────
   Nothing is asked for that this page will not show. That used not to be
   true: iv_roster and iv_attendance were fetched whole, so every visit
   downloaded both teams' entire history. A roster row carries the whole
   assignment for an event as one JSON blob and attendance is one row per
   person per event, so those two were by far the largest thing the page
   did — and half of what arrived belonged to the other team.

   Events come back first so the two big tables can be asked for exactly
   the events this team owns. It costs one extra round trip and saves a
   payload that grows with every event either team ever runs. */
function tableMissing(err){ return err&&/does not exist|42P01|relation|schema cache/i.test((err.message||'')+(err.code||'')); }
/* PostgREST puts an .in() list in the query string, so a team with years
   of events behind it would eventually build a URL too long to send.
   Ask in batches and stitch the answers back together. */
const IN_CHUNK=200;
async function byEventId(table, ids){
  if(!ids.length) return {data:[]};
  const out=[];
  for(let i=0;i<ids.length;i+=IN_CHUNK){
    const {data,error}=await sb.from(table).select('*').in('event_id',ids.slice(i,i+IN_CHUNK));
    if(error) return {error:error};
    out.push.apply(out,data||[]);
  }
  return {data:out};
}
const ANN_LIMIT=200;      // a feed, not an archive
async function loadAll(){
  if(!sb) return;
  const q=async(fn)=>{ try{ return await fn(); }catch(e){ return {error:e}; } };
  const [st,me,ev,an,rec]=await Promise.all([
    q(()=>sb.from('iv_settings').select('*').eq('key','chandraat_overrides')),
    q(()=>sb.from('iv_members').select('*').eq('team',PAGE_TEAM)),
    q(()=>sb.from('iv_events').select('*').eq('team',PAGE_TEAM).order('date')),
    q(()=>sb.from('announcements').select('*').eq('team',PAGE_TEAM).order('created_at',{ascending:false}).limit(ANN_LIMIT)),
    q(()=>sb.from('app_settings').select('*').eq('key','rec_dates')),
  ]);
  if(st.error){ console.warn('iv_settings:',st.error.message||st.error); if(tableMissing(st.error))DB_MISSING=true; }
  else (st.data||[]).forEach(r=>{
    if(r.key==='chandraat_overrides'&&r.value&&typeof r.value==='object'){ OVERRIDES=r.value; clearCycleCache(); }
  });
  if(me.error){ console.warn('iv_members:',me.error.message||me.error); if(tableMissing(me.error))DB_MISSING=true; MEMBERS=[]; }
  else MEMBERS=(me.data||[]).map(normMember).sort((a,b)=>a.name.localeCompare(b.name));
  if(ev.error){ console.warn('iv_events:',ev.error.message||ev.error); if(tableMissing(ev.error))DB_MISSING=true; EVENTS=[]; }
  else EVENTS=ev.data||[];
  const evIds=EVENTS.map(e=>e.id);
  /* The cycles this page will actually show — four back, the current
     one, four forward. Built here rather than after, because it decides
     how far back the attendance register needs to be fetched. Valid at
     this point: the settings that move a chandraat have just arrived and
     the cycle cache was cleared with them. */
  CYCLES=buildCycles();
  const floor=CYCLES.length ? CYCLES[0].start : '0000-01-01';
  /* Rosters for every event: the member cards show an all-time duty
     count and the leaderboard is explicitly lifetime, so clipping these
     would quietly change numbers people act on. They are one row per
     event, which stays manageable.

     Attendance is different. It is one row per person per event — at
     three hundred volunteers, tens of thousands of rows — and the only
     thing that needed all of it was a reliability percentage. That now
     comes back already counted, so the raw register is fetched only for
     the cycles on screen, which is all the attendance page and the
     per-cycle reports ever look at. */
  const windowIds=EVENTS.filter(e=>String(e.date||'')>=floor).map(e=>e.id);
  const [ro,at,tot]=await Promise.all([
    q(()=>byEventId('iv_roster',evIds)),
    q(()=>byEventId('iv_attendance',windowIds)),
    q(()=>sb.rpc('member_attendance_totals',{p_team:PAGE_TEAM})),
  ]);
  ATT_TOTALS={};
  if(tot.error) console.warn('member_attendance_totals:',tot.error.message||tot.error);
  else (tot.data||[]).forEach(r=>{ ATT_TOTALS[r.member_id]=r; });
  ROSTERS={};
  if(ro.error){ console.warn('iv_roster:',ro.error.message||ro.error); if(tableMissing(ro.error))DB_MISSING=true; }
  else (ro.data||[]).forEach(r=>{ ROSTERS[r.event_id]=r.data||{assign:{},manual:{}}; });
  if(an.error){ console.warn('announcements:',an.error.message||an.error); if(tableMissing(an.error))DB_MISSING=true; ANNS=[]; }
  else ANNS=an.data||[];
  REC_DATES=new Set();
  if(rec&&!rec.error&&Array.isArray(rec.data)&&rec.data[0]&&rec.data[0].value){
    try{ let v=rec.data[0].value; if(typeof v==='string') v=JSON.parse(v);
      if(v&&!Array.isArray(v)&&Array.isArray(v.dates)) v=v.dates;
      (Array.isArray(v)?v:[]).forEach(d=>{ d=String(d||'').trim(); if(/^\d{4}-\d{2}-\d{2}$/.test(d)) REC_DATES.add(d); });
    }catch(e){ console.warn('rec_dates parse:',e); }
  } else if(rec&&rec.error){ console.warn('rec_dates:',rec.error.message||rec.error); }
  ATTEND={};
  if(at.error){ console.warn('iv_attendance:',at.error.message||at.error); }
  else (at.data||[]).forEach(r=>{ (ATTEND[r.event_id]=ATTEND[r.event_id]||{})[r.member_id]={status:r.status,marked_by:r.marked_by,marked_at:r.marked_at}; });
  // hub-sync status line
  const hs=document.getElementById('hubSyncStatus');
  if(hs){ if(me.error){ hs.textContent='⚠ Hub membership unavailable — '+(me.error.message||me.error); hs.style.color='var(--gold-lt)'; }
    else { hs.textContent='Hub ✓ '+MEMBERS.length+' member'+(MEMBERS.length!==1?'s':'')+' in '+TEAM_NAME; hs.style.color='var(--blue-lt)'; } }
}

/* ── AUTO-CREATE (Fridays + PBS in current/future owned cycles) ── */
async function autoCreateEvents(){
  if(!IS_EDIT||!sb||DB_MISSING) return;
  const today=nzTodayISO();
  const want=[];
  for(const c of CYCLES){
    if(c.end<=today) continue; // never historic
    let d=new Date(c.start+'T12:00:00');
    while(true){
      const iso=d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
      if(iso>=c.end) break;
      if(d.getDay()===5) want.push({team:PAGE_TEAM,date:iso,name:'Friday Majlis',type:'friday',uniform:'Casual',youth:true,confirmed:false});
      d.setDate(d.getDate()+1);
    }
    const p=new Date(c.start+'T12:00:00'); p.setDate(p.getDate()+8);
    const piso=p.getFullYear()+'-'+pad2(p.getMonth()+1)+'-'+pad2(p.getDate());
    if(piso<c.end) want.push({team:PAGE_TEAM,date:piso,name:'Paanch Baar Saal',type:'pbs',uniform:'Casual',youth:false,confirmed:false});
  }
  const missing=want.filter(w=>!EVENTS.some(e=>e.date===w.date&&e.name===w.name));
  if(!missing.length) return;
  try{
    pauseRT(2000);
    const {data,error}=await sb.from('iv_events').insert(missing).select();
    if(error){ console.warn('auto-create:',error.message||error); return; }
    if(data&&data.length){ EVENTS=EVENTS.concat(data).sort((a,b)=>a.date<b.date?-1:1); auditLog('auto-create','events','Created '+data.length+' events for '+TEAM_NAME); }
  }catch(e){ console.warn('auto-create failed',e); }
}

/* ── REALTIME (best-effort) ── */
function subscribeRT(){
  try{
    if(!sb||!sb.channel) return;
    const ch=sb.channel('iv_'+TEAM_LC+'_'+Math.random().toString(36).slice(2,8));
    ch.on('postgres_changes',{event:'*',schema:'public',table:'iv_events'},()=>{ if(!_pauseRT) rtReload(); })
      .on('postgres_changes',{event:'*',schema:'public',table:'iv_roster'},()=>{ if(!_pauseRT) rtReload(); })
      .on('postgres_changes',{event:'*',schema:'public',table:'iv_attendance'},()=>{ if(!_pauseRT) rtReload(); })
      .on('postgres_changes',{event:'*',schema:'public',table:'announcements'},()=>{ if(!_pauseRT) rtReload(); })
      .subscribe();
  }catch(e){ console.warn('realtime unavailable',e); }
}
let _rtT=null;
/* A reload replaces everything held here with what the database has.
   That is right for somebody else's change and wrong for our own work
   that never stored — which is how a failed save came to look like a
   deletion. Anything unsaved is put back afterwards and stays flagged. */
function rtReload(){ if(_rtT)clearTimeout(_rtT); _rtT=setTimeout(async()=>{
  await loadAll(); await loadCovering(); CYCLES=buildCycles();
  Object.keys(ROSTER_UNSAVED).forEach(id=>{ ROSTERS[id]=ROSTER_UNSAVED[id]; });
  renderSaveWarning(); renderCurrent(); },350); }

/* ── COUNTS / FAIRNESS ── */
function computeCounts(k,excludeEventId){
  const cyc={},all={},last={},recent={};
  for(const ev of EVENTS){
    if(excludeEventId!=null&&ev.id===excludeEventId) continue;
    const r=ROSTERS[ev.id]; if(!r||!r.assign) continue;
    for(const key in r.assign){
      const a=r.assign[key]; if(!a) continue;
      for(const p of people(a)){
        if(p.id==null) continue;
        all[p.id]=(all[p.id]||0)+1;
        if(!last[p.id]||ev.date>last[p.id]) last[p.id]=ev.date;
        if(k!=null&&inCycleK(ev.date,k)) cyc[p.id]=(cyc[p.id]||0)+1;
        // Carry fairness across cycles: someone who missed out recently
        // should come first when this cycle's counts are level. Three
        // cycles is deliberate — long enough to even out a run of bad
        // luck, short enough that a new member is not picked for
        // everything for weeks the way a lifetime total would do.
        if(k!=null&&inCycleK(ev.date,k-1)||k!=null&&inCycleK(ev.date,k-2)||k!=null&&inCycleK(ev.date,k-3))
          recent[p.id]=(recent[p.id]||0)+1;
      }
    }
  }
  return {cyc:cyc,all:all,last:last,recent:recent};
}
// id → Set(duty display names) held this cycle (persisted + already-generated events)
function cycleDutyHistory(k,excludeEventId){
  const hist={};
  for(const ev of EVENTS){
    if(excludeEventId!=null&&ev.id===excludeEventId) continue;
    if(!inCycleK(ev.date,k)) continue;
    const r=ROSTERS[ev.id]; if(!r||!r.assign) continue;
    for(const key in r.assign){
      const nm=KEY_TO_NAME[key]; if(!nm) continue;
      for(const p of people(r.assign[key])){
        if(p.id==null) continue;
        (hist[p.id]=hist[p.id]||new Set()).add(nm);
      }
    }
  }
  return hist;
}
function fairnessCycleK(){
  const se=selEvent();
  if(se) return cycleForDate(se.date);
  const c=CYCLES.find(x=>x.status==='current')||CYCLES.find(x=>x.status==='upcoming')||CYCLES[CYCLES.length-1];
  return c?c.k:cycleForDate(nzTodayISO());
}

/* ── GENERATOR (Irfan's rule engine, ported verbatim; the only additions are the
   two documented extensions: away-date exclusion + duty-preference tie-break) ── */
function generateEventData(ev){
  const duties=dutiesForEvent(ev);
  const k=cycleForDate(ev.date);
  const prev=ROSTERS[ev.id]||{assign:{},manual:{}};
  const manual=Object.assign({},prev.manual||{});
  const _counts=computeCounts(k,ev.id);
  const cnt=_counts.cyc;                 // per-member assignment totals this cycle (excl. this event)
  const recent=_counts.recent;           // totals across the previous three cycles
  const hist=cycleDutyHistory(k,ev.id);   // per-member duty names held this cycle (excl. this event)
  // EXTENSION (a): away-dates — a member whose away list contains this event's date is
  // treated as unavailable and excluded from the entire eligibility pool for this event.
  const active=MEMBERS.filter(m=>m.status==='active'&&!isAway(m,ev.date));
  const byGA=(g,a)=>active.filter(m=>m.gender===g&&m.age_group===a);
  const mA=byGA('Male','adult'),mY=byGA('Male','youth'),mC=byGA('Male','child');
  const fA=byGA('Female','adult'),fY=byGA('Female','youth'),fC=byGA('Female','child');
  const mN=mA.filter(m=>!!m.nandi),fN=fA.filter(m=>!!m.nandi); // Nandi-certified adults
  const used=new Set();
  const assign={},warn={};
  const relaxed=new Set();
  // pick(): fairness = prefer members who haven't done this duty this cycle, then fewest
  // total duties this cycle, then (EXTENSION b) duty preference, then random (ported ordering).
  // Non-repeatable duties filter out members who already held them this cycle; HARD_REQUIRED
  // duties relax that filter rather than stay unfilled.
  function pick(pool,count,duty,allowFallback,ignoreUsed){
    if(count<=0||!pool.length) return [];
    let base=ignoreUsed?pool.slice():pool.filter(m=>!used.has(m.id));
    if(!CHILD_ALLOWED.has(duty)) base=base.filter(m=>m.age_group!=='child'); // children only in CHILD_ALLOWED
    const avail=base.filter(m=>{
      if(REPEAT_ALLOWED_DUTIES.has(duty)) return true;
      const h=hist[m.id]; return !(h&&h.has(duty));
    });
    let finalPool=avail;
    if(!avail.length&&(allowFallback||HARD_REQUIRED_DUTIES.has(duty))){
      finalPool=base;
      if(base.length&&HARD_REQUIRED_DUTIES.has(duty)&&!allowFallback) relaxed.add(duty);
    }
    if(!finalPool.length) return [];
    return finalPool.slice().sort((a,b)=>{
      const ah=(hist[a.id]&&hist[a.id].has(duty))?1:0, bh=(hist[b.id]&&hist[b.id].has(duty))?1:0;
      if(ah!==bh) return ah-bh;
      const cd=(cnt[a.id]||0)-(cnt[b.id]||0); if(cd) return cd;
      // Someone who missed out over the last three cycles comes first when
      // this cycle's counts are level. Ranks below the current cycle so it
      // never overrides present-cycle fairness, only settles its ties.
      const rd=(recent[a.id]||0)-(recent[b.id]||0); if(rd) return rd;
      // EXTENSION (b): duty preference is a pure tie-break — only among fairness-tied
      // candidates, never overriding counts/eligibility/gender/age/child/nandi rules.
      const ap=prefScore(a,duty),bp=prefScore(b,duty); if(ap!==bp) return ap-bp;
      return Math.random()-.5;
    }).slice(0,count);
  }
  // Fill from each age group in turn, dropping to the next only when the
  // current one runs out. Never merge them into one pool: pick() sorts on
  // fairness, so a merged list would hand a child's slot to whichever
  // adult happened to have the fewest duties.
  function pickTier(tiers,count,duty,allowFallback,ignoreUsed){
    const out=[];
    for(const tier of tiers){
      if(out.length>=count) break;
      const taken=new Set(out.map(m=>m.id));
      const room=count-out.length;
      out.push(...pick((tier||[]).filter(m=>!taken.has(m.id)),room,duty,allowFallback,ignoreUsed));
    }
    return out;
  }
  function capLists(d,males,females){
    let M=(males||[]).slice(), F=(females||[]).slice();
    if(typeof d.reqM==='number') M=M.slice(0,d.reqM);
    if(typeof d.reqF==='number') F=F.slice(0,d.reqF);
    if(typeof d.reqAny==='number' && M.length+F.length>d.reqAny){
      const minM=(typeof d.reqM==='number')?Math.min(d.reqM,M.length):0;
      const keptM=M.slice(0,minM), keptF=[];
      let i=minM,j=0;
      while(keptM.length+keptF.length<d.reqAny && (i<M.length||j<F.length)){
        if(j<F.length && keptM.length+keptF.length<d.reqAny) keptF.push(F[j++]);
        if(i<M.length && keptM.length+keptF.length<d.reqAny) keptM.push(M[i++]);
      }
      M=keptM; F=keptF;
    }
    return {m:M,f:F};
  }
  function commit(d,males,females){
    const capped=capLists(d,males,females); males=capped.m; females=capped.f;
    const slot=assign[d.key]={m:[],f:[],x:[]};
    (males||[]).forEach(m=>slot.m.push({id:m.id,name:m.name}));
    (females||[]).forEach(m=>slot.f.push({id:m.id,name:m.name}));
    (males||[]).concat(females||[]).forEach(m=>{ used.add(m.id); cnt[m.id]=(cnt[m.id]||0)+1; });
  }
  // seed manual duties (sacred — never touched by Regenerate/Generate All)
  for(const d of duties){
    if(manual[d.key]&&prev.assign&&prev.assign[d.key]){
      assign[d.key]=JSON.parse(JSON.stringify(prev.assign[d.key]));
      for(const p of people(assign[d.key])){ if(p.id==null)continue; used.add(p.id); cnt[p.id]=(cnt[p.id]||0)+1; }
    }
  }
  const groups={mA:mA,mY:mY,mC:mC,mN:mN,fA:fA,fY:fY,fC:fC,fN:fN,used:used,tier:pickTier};
  // REC duties ignore `used` so a youth can hold one core duty AND one REC duty.
  // That must not let the same person take TWO REC duties, so track them here.
  const recUsed=new Set(); const nR=a=>(a||[]).filter(m=>!recUsed.has(m.id));
  for(const d of duties){
    if(manual[d.key]) continue;
    if(d.section==='mph'){ // youth congregation (youth may double: one core + one MPH duty)
      let ms=[],fs=[];
      if(d.name==='MPH Hall Entrance'){ // 1 child/youth per gender
        ms=pick(nR(mC.length?mC:mY),1,d.name,true,true); fs=pick(nR(fC.length?fC:fY),1,d.name,true,true);
      } else if(d.name==='Seating & Discipline (Youth)'){ // 1 youth per gender
        ms=pick(nR(mY),1,d.name,true,true); fs=pick(nR(fY),1,d.name,true,true);
      } else if(d.name==='Sukreet & Ghatpaat Closing (Youth)'){ // 1 youth/adult per gender
        ms=pick(nR(mY),1,d.name,true,true); if(!ms.length) ms=pick(nR(mA),1,d.name,true,true);
        fs=pick(nR(fY),1,d.name,true,true); if(!fs.length) fs=pick(nR(fA),1,d.name,true,true);
      }
      ms.concat(fs).forEach(m=>recUsed.add(m.id));
      commit(d,ms,fs);
      continue;
    }
    const assigner=DUTY_ASSIGNMENT_CONFIG[d.name];
    if(!assigner){ console.warn('No assignment logic found for duty: '+d.name); assign[d.key]={m:[],f:[],x:[]}; continue; }
    const res=assigner(dutyTypeFor(ev.type),groups,pick)||{};
    commit(d,res.male||[],res.female||[]);
  }
  for(const name of relaxed.values()){
    const inf=DUTY_INFO[name];
    if(inf) (warn[inf.key]=warn[inf.key]||[]).push('no-repeat rule relaxed (pool exhausted)');
  }
  // preserve saved assignments for duty keys not in this event's duty list (legacy data / MPH toggled off)
  for(const key in (prev.assign||{})){ if(!assign[key]&&!duties.some(d=>d.key===key)&&people(prev.assign[key]).length) assign[key]=prev.assign[key]; }
  return {assign:assign,manual:manual,gen_at:new Date().toISOString(),warn:warn};
}
/* ── SAVING A ROSTER ─────────────────────────────────────────────────
   This used to swallow every failure into a console warning. The
   generated roster stayed on screen, the database kept nothing, and the
   next reload replaced what was on screen with what was stored — so a
   save that failed looked exactly like a roster that had been deleted,
   with nothing anywhere saying why.

   Three things now stop that. The error is shown rather than logged.
   The write is read back, because a rejected write is not the only way
   to lose one — a duplicate row for the same event would take the
   update and still leave the page reading the stale copy. And anything
   that did not store is remembered, so a reload cannot quietly replace
   work that only exists in this browser. */
/* Nearly every write on this page ended in catch(e){ console.warn(e) }.
   That is how a roster could fail to save and a confirmation could fail
   to publish while the screen showed success for both. This does the
   write, says out loud what went wrong when it does, and tells the
   caller so the screen can stop claiming otherwise. */
async function dbWrite(what, run){
  if(!sb || DB_MISSING){ toast(what + ' failed — no database connection', 'err'); return false; }
  try{
    const {error} = await run();
    if(error){ console.error(what, error); toast(what + ' failed — ' + (error.message || error), 'err'); return false; }
    return true;
  }catch(e){ console.error(what, e); toast(what + ' failed — ' + (e.message || e), 'err'); return false; }
}
let ROSTER_UNSAVED = {};        // event id -> the roster that is not safely stored
function unsavedCount(){ return Object.keys(ROSTER_UNSAVED).length; }
async function saveRoster(eventId, opts){
  const quiet = opts && opts.quiet;
  if(!sb || DB_MISSING){ ROSTER_UNSAVED[eventId] = ROSTERS[eventId]; return false; }
  const body = ROSTERS[eventId];
  if(!body){ console.warn('saveRoster: nothing to save for event', eventId); return false; }
  /* Long enough to cover the write and the read-back. The old 1.5s could
     lapse mid-save, letting our own change bounce back as a reload. */
  pauseRT(6000);
  let err = null;
  for(let attempt = 0; attempt < 2; attempt++){
    try{
      const {error} = await sb.from('iv_roster').upsert({event_id:eventId, data:body});
      if(!error){ err = null; break; }
      err = error;
    }catch(e){ err = e; }
    if(attempt === 0) await new Promise(r=>setTimeout(r, 500));   // one retry for a blip
  }
  if(!err){
    // Read it back. Sent and stored are not the same claim.
    try{
      const {data, error} = await sb.from('iv_roster').select('event_id,data').eq('event_id', eventId);
      if(error) err = error;
      else if(!data || !data.length) err = {message:'the row was accepted but is not there when read back'};
      else if(data.length > 1) err = {message:'there are ' + data.length + ' roster rows for this event — the unique index on iv_roster(event_id) is missing, so saves cannot replace cleanly. Re-run SETUP.sql.'};
      else if(JSON.stringify(data[0].data) !== JSON.stringify(body)) err = {message:'what came back does not match what was sent'};
    }catch(e){ err = e; }
  }
  if(err){
    ROSTER_UNSAVED[eventId] = body;
    const why = err.message || String(err);
    console.error('saveRoster failed for event', eventId, err);
    if(!quiet) toast('Roster NOT saved — ' + why, 'err');
    renderSaveWarning();
    return false;
  }
  delete ROSTER_UNSAVED[eventId];
  renderSaveWarning();
  return true;
}
/* Retries everything still unstored. Offered rather than done silently,
   because if the first attempt failed for a reason that has not changed
   the second will too, and a button says so honestly. */
async function retryUnsaved(){
  const ids = Object.keys(ROSTER_UNSAVED);
  if(!ids.length) return;
  let ok = 0;
  for(const id of ids){
    ROSTERS[id] = ROSTER_UNSAVED[id];
    if(await saveRoster(Number(id), {quiet:true})) ok++;
  }
  toast(ok === ids.length ? 'Saved — everything is stored now'
                          : ok + ' of ' + ids.length + ' saved. The rest are still not stored.',
        ok === ids.length ? 'ok' : 'err');
  renderCurrent();
}
function renderSaveWarning(){
