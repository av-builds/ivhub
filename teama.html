/* Summarises what a regenerate changed: how many duties gained, lost or
   swapped people. Names are compared rather than ids so a renamed member
   does not read as a swap. */
function rosterDelta(before,after){
  const A=(before&&before.assign)||{}, B=(after&&after.assign)||{};
  const names=o=>people(o||{}).map(p=>p.name).sort().join('|');
  const keys=new Set(Object.keys(A).concat(Object.keys(B)));
  let changed=0, unchanged=0;
  keys.forEach(k=>{ (names(A[k])===names(B[k])) ? unchanged++ : changed++; });
  if(!before||!before.assign) return 'first generation, '+keys.size+' duties filled';
  if(!changed) return 'no change';
  return changed+' of '+(changed+unchanged)+' duties changed';
}
async function generateEvent(id,silent){
  const ev=EVENTS.find(e=>e.id===id); if(!ev) return;
  if(evLocked(ev)) return toast('This event is locked','err');
  if(!MEMBERS.filter(m=>m.status==='active').length) return toast('No active members','err');
  if(ev.type==='friday'&&ev.youth&&!MEMBERS.some(m=>m.status==='active'&&m.age_group==='youth')&&!silent)
    toast('No Youth members tagged yet — MPH slots will be unfilled','err');
  // Compare against what was there, so the log says how much a regenerate
  // actually disturbed rather than merely that one happened. A regenerate
  // that changed nothing and one that reshuffled everybody are very
  // different events to read about afterwards.
  const _before=ROSTERS[id];
  ROSTERS[id]=generateEventData(ev);
  const stored=await saveRoster(id);
  if(!silent){
    auditLog('generate','roster',ev.name+' '+ev.date+' \u2014 '+rosterDelta(_before,ROSTERS[id]));
    renderRoster(); refreshBadges();
    // Only say it is generated if it is actually stored. saveRoster has
    // already said what went wrong when it has not.
    /* Says what still has to happen. "Generated" on its own reads as
       done, and a roster nobody publishes is a roster nobody sees. */
    if(stored) toast(ev.confirmed ? 'Roster generated and saved'
                                  : 'Generated and saved — now Confirm & Publish so everyone can see it');
  }
  return stored;
}
async function generateCycle(){
  const ev=selEvent(); if(!ev) return;
  const k=cycleForDate(ev.date);
  const evs=eventsInCycle(k).filter(e=>!e.confirmed&&!isHistoricEvent(e));
  if(!evs.length) return toast('No generatable events in this cycle','err');
  let stored=0;
  for(const e of evs){ ROSTERS[e.id]=generateEventData(e); if(await saveRoster(e.id,{quiet:true})) stored++; }
  auditLog('generate-all','roster',cycleLabel(k)+' — '+evs.length+' events, '+stored+' saved');
  renderRoster(); refreshBadges();
  /* Counted rather than assumed. Reporting the number generated when
     only some of them stored is how this went unnoticed for so long. */
  if(stored===evs.length) toast('Generated and saved '+evs.length+' events — publish each one to put it on the calendar');
  else toast('Generated '+evs.length+', but only '+stored+' saved — see the warning above', 'err');
}

/* ── ATTENDANCE HELPERS ── */
function attStatus(eventId,memberId){ const r=ATTEND[eventId]; return r&&r[memberId]?r[memberId].status:null; }
/* Lifetime, across every event this team has ever run — which is why it
   is counted in the database rather than here. Reading it off ATTEND
   would now silently mean "reliability over the last few cycles", since
   that is all the raw register still holds. */
function memberReliability(memberId){
  const t=ATT_TOTALS[memberId];
  const present=t?Number(t.present)||0:0, late=t?Number(t.late)||0:0,
        absent=t?Number(t.absent)||0:0, excused=t?Number(t.excused)||0:0;
  const total=present+late+absent+excused;
  const denom=present+late+absent;
  return {present,late,absent,excused,total,rate:denom?Math.round((present+late)/denom*100):null};
}
async function markAttendance(eventId,memberId,status){
  if(!IS_EDIT) return;
  const cur=attStatus(eventId,memberId);
  const rec=ATTEND[eventId]=ATTEND[eventId]||{};
  if(cur===status){ delete rec[memberId]; // toggle off
    try{ if(sb&&!DB_MISSING){ pauseRT(1200); await sb.from('iv_attendance').delete().eq('event_id',eventId).eq('member_id',memberId); } }catch(e){ console.warn(e); }
  } else {
    rec[memberId]={status:status,marked_by:CU.user,marked_at:new Date().toISOString()};
    try{ if(sb&&!DB_MISSING){ pauseRT(1200); const {error}=await sb.from('iv_attendance').upsert({event_id:eventId,member_id:memberId,status:status,marked_by:CU.user,marked_at:new Date().toISOString()});
      if(error){ console.warn('attendance:',error.message||error); toast(tableMissing(error)?'Run SETUP.sql to enable attendance':'Could not save attendance','err'); } } }
    catch(e){ console.warn(e); }
  }
  /* Keep the lifetime total in step. It is counted by the database on
     load, so without this the reliability figure on the member card
     would sit on whatever it was when the page opened — visibly wrong to
     the person who just marked the register. */
  bumpTotals(memberId, cur, cur===status ? null : status);
  auditLog('attendance','attendance',(memById(memberId)||{}).name+' → '+(cur===status?'cleared':status));
  renderAttendance();
}
function bumpTotals(memberId, from, to){
  const t=ATT_TOTALS[memberId]=ATT_TOTALS[memberId]||{member_id:memberId,present:0,late:0,excused:0,absent:0,marked:0};
  const step=(k,n)=>{ if(k && t[k]!=null) t[k]=Math.max(0,(Number(t[k])||0)+n); };
  if(from){ step(from,-1); t.marked=Math.max(0,(Number(t.marked)||0)-1); }
  if(to){   step(to,  +1); t.marked=(Number(t.marked)||0)+1; }
}

function slotCounts(ev){
  const data=ROSTERS[ev.id]; if(!data||!data.assign) return {assigned:0,missing:0,generated:false};
  let assigned=0,missing=0;
  for(const d of dutiesForEvent(ev)){
    const a=data.assign[d.key]||{m:[],f:[],x:[]};
    const nm=(a.m||[]).length,nf=(a.f||[]).length,nx=(a.x||[]).length,tot=nm+nf+nx;
    assigned+=tot;
    const mM=Math.max(0,(d.reqM||0)-nm),mF=Math.max(0,(d.reqF||0)-nf);
    missing+=mM+mF+Math.max(0,(d.reqAny||0)-tot-mM-mF);
  }
  return {assigned,missing,generated:!!(data.gen_at||assigned)};
}

      '<div class="btns"><button class="btn btn-bl" onclick="generateEvent('+ev.id+')">⚡ Generate</button>'+
      '<button class="btn btn-ol" onclick="generateCycle()">Generate All (cycle)</button></div>'+
      '<div class="rules-line">Rules: cycle fairness carried across three cycles · no duty repeats within a cycle · Nandi requires certification · children only at entrances &amp; Nandi Passing · away-dates skipped · age groups step up when a pool runs out · duty preferences honoured on ties · Seating &amp; Discipline doubles on formal occasions</div></div>';
  }

function renderLegacyRow(label,a){
  const male=(a.m||[]).map(p=>esc(p.name||'?')),female=(a.f||[]).map(p=>esc(p.name||'?'));
  (a.x||[]).forEach(p=>{ const mem=memById(p.id); ((mem&&mem.gender)==='Female'?female:male).push(esc(p.name||'?')); });

  return '<tr><td class="dn2">'+esc(label)+'<span class="lock" title="Saved under a previous duty set — read only">🗄</span></td>'+
    '<td><div class="cellwrap">'+(male.map(chip).join('')||'<span style="color:var(--dm)">—</span>')+'</div></td>'+
    '<td><div class="cellwrap">'+(female.map(chip).join('')||'<span style="color:var(--dm)">—</span>')+'</div></td></tr>';
}
function chipHTML(ev,dutyKey,arrName,idx,p,locked){
  const mem=memById(p.id); const away=mem&&isAway(mem,ev.date);
  const acts=locked?'':'<span class="acts">'+
    '<button title="Swap" onclick="event.stopPropagation();openPicker(\''+escJs(dutyKey)+'\',\''+escJs(arrName)+'\','+idx+')">↔</button>'+
    '<button class="rm" title="Remove" onclick="event.stopPropagation();removeSlot(\''+escJs(dutyKey)+'\',\''+escJs(arrName)+'\','+idx+')">×</button></span>';
  return '<span class="chip'+(away?' away':'')+'"'+(away?' title="On away-date for this event"':'')+'>'+esc(p.name||'?')+acts+'</span>';
}
function renderDutyRow(ev,d,data,locked){
  const a=(data.assign&&data.assign[d.key])||{m:[],f:[],x:[]};
  const manual=data.manual&&data.manual[d.key];
  const warns=(data.warn&&data.warn[d.key])||[];
  const maleChips=[],femaleChips=[];
  (a.m||[]).forEach((p,i)=>maleChips.push(chipHTML(ev,d.key,'m',i,p,locked)));
  (a.f||[]).forEach((p,i)=>femaleChips.push(chipHTML(ev,d.key,'f',i,p,locked)));
  (a.x||[]).forEach((p,i)=>{ const mem=memById(p.id); const g=(mem&&mem.gender)||'Male'; (g==='Female'?femaleChips:maleChips).push(chipHTML(ev,d.key,'x',i,p,locked)); });
  const total=(a.m||[]).length+(a.f||[]).length+(a.x||[]).length;
  let missM=Math.max(0,(d.reqM||0)-(a.m||[]).length);
  let missF=Math.max(0,(d.reqF||0)-(a.f||[]).length);
  let missX=Math.max(0,(d.reqAny||0)-total-missM-missF);
  for(let i=0;i<missM;i++) maleChips.push('<span class="chip un">UNASSIGNED</span>');
  for(let i=0;i<missF;i++) femaleChips.push('<span class="chip un">UNASSIGNED</span>');
  for(let i=0;i<missX;i++) (maleChips.length<=femaleChips.length?maleChips:femaleChips).push('<span class="chip un">UNASSIGNED</span>');
  if(!locked){
    maleChips.push('<button class="chip add" onclick="addToSlot(\''+escJs(d.key)+'\',\'m\')">+ Add</button>');
    femaleChips.push('<button class="chip add" onclick="addToSlot(\''+escJs(d.key)+'\',\'f\')">+ Add</button>');
  }
  const warnHtml=warns.length?'<div class="warns">'+warns.map(w=>'<span class="warn-chip">⚠ '+esc(w)+'</span>').join('')+'</div>':'';
  return '<tr><td class="dn2">'+esc(d.name)+(manual?'<span class="lock" title="Manually locked — Regenerate never touches this duty">🔒</span>':'')+warnHtml+'</td>'+
    '<td><div class="cellwrap">'+maleChips.join('')+'</div></td>'+
    '<td><div class="cellwrap">'+femaleChips.join('')+'</div></td></tr>';
}

let PICKER_CTX=null;
function ensureRoster(ev){ if(!ROSTERS[ev.id]) ROSTERS[ev.id]={assign:{},manual:{},warn:{}}; const r=ROSTERS[ev.id]; r.assign=r.assign||{}; r.manual=r.manual||{}; return r; }
function dutyDef(ev,key){ return dutiesForEvent(ev).find(d=>d.key===key)||null; }
function addToSlot(dutyKey,col){ const ev=selEvent(); if(!ev||evLocked(ev)) return; const d=dutyDef(ev,dutyKey); if(!d) return; ensureRoster(ev); PICKER_CTX={dutyKey:dutyKey,arr:col,idx:null,gender:col==='m'?'Male':'Female'}; openPickerModal(); }
function openPicker(dutyKey,arrName,idx){ const ev=selEvent(); if(!ev||evLocked(ev)) return; PICKER_CTX={dutyKey:dutyKey,arr:arrName,idx:idx,gender:arrName==='m'?'Male':(arrName==='f'?'Female':null)}; openPickerModal(); }
function openPickerModal(){
  const ev=selEvent(); if(!ev||!PICKER_CTX) return;
  const d=dutyDef(ev,PICKER_CTX.dutyKey); if(!d) return;
  oM('<h3>'+(PICKER_CTX.idx==null?'Assign to':'Swap in')+' — '+esc(d.name)+'</h3>'+
    '<input type="text" id="pickSearch" placeholder="Search members…" style="width:100%" oninput="renderPickList()">'+
    '<div class="pick-list" id="pickList"></div>'+
    '<div class="macts"><button class="btn btn-ol" onclick="cM()">Cancel</button></div>');

  const s=document.getElementById('pickSearch'); if(s) s.focus();
}
function renderPickList(){
  const ev=selEvent(); if(!ev||!PICKER_CTX) return;
  const box=document.getElementById('dcard'); const list=box?box.querySelector('#pickList'):null; if(!list) return;
  const d=dutyDef(ev,PICKER_CTX.dutyKey); if(!d) return;
  const qEl=box.querySelector('#pickSearch'); const q=(qEl&&qEl.value||'').trim().toLowerCase();
  const k=cycleForDate(ev.date); const counts=computeCounts(k,null);
  const r=ensureRoster(ev); const inEvent=new Set();
  for(const key in (r.assign||{})) for(const p of people(r.assign[key])) if(p.id!=null) inEvent.add(p.id);
  const dhist=cycleDutyHistory(k,ev.id);
  let cands=MEMBERS.filter(m=>m.status==='active'&&(m.age_group!=='child'||CHILD_ALLOWED.has(d.name))&&(!PICKER_CTX.gender||m.gender===PICKER_CTX.gender));
  if(q) cands=cands.filter(m=>m.name.toLowerCase().includes(q));
  cands.sort((a,b)=>(d.name==='Nandi'?((b.nandi?1:0)-(a.nandi?1:0)):0)||((counts.cyc[a.id]||0)-(counts.cyc[b.id]||0))||((counts.all[a.id]||0)-(counts.all[b.id]||0))||a.name.localeCompare(b.name));
  list.innerHTML=cands.length?cands.map(m=>{
    const flags=(isAway(m,ev.date)?'<span class="pick-flag" style="background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.4);color:var(--red-lt)">away</span>':'')+
      (inEvent.has(m.id)?'<span class="pick-flag">in this event</span>':'')+
      ((!REPEAT_ALLOWED_DUTIES.has(d.name)&&dhist[m.id]&&dhist[m.id].has(d.name))?'<span class="pick-flag">did this duty (cycle)</span>':'')+
      ((d.name==='Nandi'&&m.nandi)?'<span class="pick-flag" style="background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.45);color:var(--green-lt)">Nandi ✓</span>':'');
    return '<button class="pick-row" onclick="applyPick('+m.id+')"><span class="nm">'+esc(m.name)+'</span>'+flags+
      '<span class="meta num">cycle '+(counts.cyc[m.id]||0)+' · all '+(counts.all[m.id]||0)+'</span></button>';
  }).join(''):'<div style="padding:16px;font-size:13px;color:var(--dm)">No eligible members'+(q?' match “'+esc(q)+'”':'')+'.</div>';
}
async function applyPick(memberId){
  const ev=selEvent(); if(!ev||!PICKER_CTX) return;
  const m=memById(memberId); if(!m) return;
  const r=ensureRoster(ev);
  const a=r.assign[PICKER_CTX.dutyKey]=r.assign[PICKER_CTX.dutyKey]||{m:[],f:[],x:[]};
  const arr=a[PICKER_CTX.arr]=a[PICKER_CTX.arr]||[];
  const entry={id:m.id,name:m.name};
  // Capture the duty and anyone displaced before the arrays change — the
  // log's job here is to answer "who took me off this duty", which needs
  // the duty name and the person replaced, not just the new name.
  const _duty=legacyLabel(PICKER_CTX.dutyKey);
  const _replaced=(PICKER_CTX.idx==null)?null:(arr[PICKER_CTX.idx]&&arr[PICKER_CTX.idx].name);
  if(PICKER_CTX.idx==null) arr.push(entry); else arr[PICKER_CTX.idx]=entry;
  r.manual[PICKER_CTX.dutyKey]=true;
  cM(); PICKER_CTX=null;
  await saveRoster(ev.id);
  auditLog('manual-assign','roster',ev.name+' '+ev.date+' \u2014 '+_duty+': '+
    (_replaced ? _replaced+' \u2192 '+m.name : 'added '+m.name));
  renderRoster(); refreshBadges(); toast(m.name+' assigned');
}
async function removeSlot(dutyKey,arrName,idx){
  const ev=selEvent(); if(!ev||evLocked(ev)) return;
  const r=ensureRoster(ev); const a=r.assign[dutyKey]; if(!a||!a[arrName]||idx>=a[arrName].length) return;
  const rm=a[arrName].splice(idx,1)[0]; r.manual[dutyKey]=true;
  await saveRoster(ev.id);
  auditLog('manual-remove','roster',ev.name+' '+ev.date+' \u2014 '+legacyLabel(dutyKey)+
    ': removed '+(rm&&rm.name||'?'));
  renderRoster(); refreshBadges(); toast((rm&&rm.name||'Member')+' removed');
}
async function toggleYouth(){
  const ev=selEvent(); if(!ev||!IS_EDIT||isHistoricEvent(ev)) return;
  ev.youth=!ev.youth;
  pauseRT(4000);
  if(!await dbWrite('Changing the Youth setting', ()=>sb.from('iv_events').update({youth:ev.youth}).eq('id',ev.id))){
    ev.youth=!ev.youth;      // put it back; the database did not take it
  }
  auditLog('youth-toggle','events',ev.name+' '+ev.date+' → '+(ev.youth?'ON':'OFF'));
  renderRoster();
}
/* Publishing is the step that puts a roster in front of everybody: the
   Hub's calendar and My Duties both read confirmed events only. It used
   to set the flag locally and then write, ignoring the answer — so a
   refused write left the screen saying "Confirmed" over a database that
   still held a draft, and nobody outside the leads ever saw the roster.
   The flag is now set only once the database has taken it. */
async function toggleConfirm(){
  const ev=selEvent(); if(!ev||!IS_EDIT||isHistoricEvent(ev)) return;
  const want=!ev.confirmed;
  if(want && unsavedCount()){
    toast('Save the roster first — it is not stored yet, so there is nothing to publish.','err'); return;
  }
  pauseRT(4000);
  const ok=await dbWrite(want?'Publishing':'Unpublishing', ()=>
    sb.from('iv_events').update({confirmed:want}).eq('id',ev.id));
  if(!ok){ renderRoster(); return; }
  ev.confirmed=want;
  auditLog(want?'confirm':'unconfirm','events',ev.name+' '+ev.date);
  renderRoster();
  toast(want?'Published — it is on the calendar for everyone now':'Unpublished — hidden from the calendar again');
}

async function submitAddEvent(){
  const box=document.getElementById('dcard');
  const date=(box.querySelector('#aeDate')||{}).value; const type=(box.querySelector('#aeType')||{}).value||'custom';
  const name=((box.querySelector('#aeName')||{}).value||'').trim(); const uniform=(box.querySelector('#aeUniform')||{}).value||'Casual';

/* Opens the duties for one day, whichever team owns it.
   Team A's page only loads Team A's events, so a Team B day has to be
   fetched on demand rather than looked up locally. Reading is allowed for
   anyone signed in; writing still is not, so this is a view only. */
async function openDayDuties(iso){
  const owner=teamForCycle(cycleForDate(iso));
  const head='<h3>'+esc(fmtNice(iso))+'</h3>'+
    '<p style="font-size:13px;color:var(--dm);margin:-4px 0 14px">Team '+esc(owner)+
    (owner===PAGE_TEAM?' \u00b7 your team':' \u00b7 other team')+'</p>';
  oM(head+'<p style="font-size:14px;color:var(--dm)">Loading\u2026</p>');

  let evs=EVENTS.filter(e=>e.date===iso), rosters={};
  if(evs.length){ evs.forEach(e=>{ if(ROSTERS[e.id]) rosters[e.id]=ROSTERS[e.id]; }); }

  // Nothing local — either the other team's day, or simply not loaded.
  if(!evs.length && sb && !DB_MISSING){
    try{
      const {data:ev}=await sb.from('iv_events').select('*').eq('date',iso);
      evs=ev||[];
      if(evs.length){
        const {data:ro}=await sb.from('iv_roster').select('*').in('event_id',evs.map(e=>e.id));
        (ro||[]).forEach(r=>{ rosters[r.event_id]=r.data; });
      }
    }catch(e){ console.warn('openDayDuties:',e.message||e); }
  }

  if(!evs.length){
    oM(head+'<p style="font-size:14px;color:var(--dm)">No duties scheduled for this day.</p>'+
       '<div class="macts"><button class="btn btn-ol" onclick="cM()">Close</button></div>');
    return;
  }

  let h=head;
  for(const ev of evs){
    const data=rosters[ev.id]||{assign:{}};
    h+='<div style="margin-bottom:16px"><div style="font-size:15px;font-weight:900;margin-bottom:7px">'+
       esc(ev.name)+' <span style="font-weight:700;color:var(--dm);font-size:13px">\u00b7 '+
       esc(ev.uniform||'Casual')+' uniform'+(ev.confirmed?'':' \u00b7 draft')+'</span></div>'+
       '<table style="width:100%;border-collapse:collapse;font-size:13px">';
    let any=false;
    for(const d of dutiesForEvent(ev)){
      const a=(data.assign&&data.assign[d.key])||{m:[],f:[],x:[]};
      const names=people(a).map(p=>p.name);
      if(!names.length) continue;
      any=true;
      h+='<tr><td style="padding:4px 8px 4px 0;font-weight:800;white-space:nowrap;vertical-align:top">'+
         esc(recName(d.name))+'</td><td style="padding:4px 0;color:var(--dm)">'+esc(names.join(' / '))+'</td></tr>';
    }
    if(!any) h+='<tr><td style="padding:4px 0;color:var(--dm)">Not yet rostered.</td></tr>';
    h+='</table></div>';
  }
  h+='<div class="macts"><button class="btn btn-ol" onclick="cM()">Close</button></div>';
  oM(h);
}
function renderCalendar(){
  const el=document.getElementById('body-calendar'); if(!el) return;
  const y=CAL.y,m=CAL.m;
  const monthName=new Date(y,m,1).toLocaleDateString('en-NZ',{month:'long',year:'numeric'});
  const first=new Date(y,m,1); const off=(first.getDay()+6)%7; const dim=new Date(y,m+1,0).getDate(); const dimPrev=new Date(y,m,0).getDate();
  const today=nzTodayISO(); const evByDate={}; EVENTS.forEach(e=>{ (evByDate[e.date]=evByDate[e.date]||[]).push(e); });
  let h='<div class="ph"><div><h1>IV Duties Calendar</h1><p>Every day is owned by a team — '+esc(TEAM_NAME)+' cells are highlighted. Chandraat is computed from the new-moon + leader overrides.</p></div></div>';

  const cells=Math.ceil((off+dim)/7)*7;
  for(let i=0;i<cells;i++){

    if(cd<1){ out=true; cm=m-1; cd=dimPrev+cd; if(cm<0){cm=11;cy--;} }
    else if(cd>dim){ out=true; cd-=dim; cm=m+1; if(cm>11){cm=0;cy++;} }
    const iso=cy+'-'+pad2(cm+1)+'-'+pad2(cd);
    const owner=teamForCycle(cycleForDate(iso)); const mine=owner===PAGE_TEAM; const evs=evByDate[iso]||[];

/* Renders a patch as "field: old → new" so the log answers what changed
   rather than merely that something did. Captured before the patch is
   applied, since afterwards the previous value is gone. */
function describeChange(before, patch){
  const bits=[];
  for(const k in patch){
    const was=before[k], now=patch[k];
    const fmt=v=>{
      if(v===null||v===undefined||v==='') return '(empty)';
      if(Array.isArray(v)) return v.length? v.join(', ') : '(none)';
      if(typeof v==='object') return JSON.stringify(v);
      if(typeof v==='boolean') return v?'yes':'no';
      return String(v);
    };
    if(fmt(was)===fmt(now)) continue;      // nothing actually moved
    bits.push(k+': '+fmt(was)+' \u2192 '+fmt(now));
  }
  return bits.join(', ');
}
async function updateMember(id,patch){

    if(error){ console.warn('updateMember:',error.message||error); toast(tableMissing(error)||/column/i.test(error.message||'')?'Run the latest SETUP.sql to enable this field':'Could not save','err'); } } }
  catch(e){ console.warn(e); }
  const changed=describeChange(before,patch);
  if(changed) auditLog('update','members',m.name+' \u2014 '+changed);
  if(curPage==='members') renderMemberGrid();
}

function cyclePref(id,key){ const m=memById(id); if(!m) return; normMember(m); const pf=m.prefs.prefer,av=m.prefs.avoid;
  if(pf.indexOf(key)>=0){ m.prefs.prefer=pf.filter(k=>k!==key); m.prefs.avoid=av.concat([key]); }
  else if(av.indexOf(key)>=0){ m.prefs.avoid=av.filter(k=>k!==key); }
  else { m.prefs.prefer=pf.concat([key]); }

/* Ranks that run the team on the night. They belong in the attendance
   list whether or not the generator gave them a duty. */
const LEAD_RANKS=['Team Leader','Team Lead','Assistant Team Lead'];
/* Must be a lead OF THIS TEAM, and not the AV team's.
   Two separate tests, and the second is the one that matters. MEMBERS is
   already filtered to this page's team by loadAll(), so a team check alone
   changes nothing — an AV Team Lead who sits in Team A passes it. What
   marks somebody as AV is their specialized-team membership, set in the
   Hub's member directory, so that is what is read here.
   Nobody is hidden by this. An AV lead who is actually rostered on the
   night still appears with their duties, exactly like anyone else; they
   simply stop being added to Team A's roll as a supervisor they are not. */
function isAvMember(m){
  const s=m&&m.spec;
  return Array.isArray(s) && s.some(x=>String(x).toUpperCase()==='AV');
}
function isTeamLeadMember(m){
  if(LEAD_RANKS.indexOf(m.rank||'')<0) return false;
  if((m.team||'')!==PAGE_TEAM) return false;
  return !isAvMember(m);
}

/* Who should appear for an event: everyone the roster assigned, plus the
   leads. Returns each person with the duties they hold, so the list can
   show what each person is actually there to do. */
function attendanceRoll(ev){
  const data=(ROSTERS[ev.id]||{assign:{}}).assign||{};
  const byId={};
  for(const key in data){
    const label=legacyLabel(key);
    for(const q of people(data[key])){
      if(q.id==null) continue;
      (byId[q.id]=byId[q.id]||{duties:[]}).duties.push(label);
    }
  }
  const out=[];
  MEMBERS.forEach(m=>{
    if(m.status!=='active') return;
    const hit=byId[m.id];
    if(!hit && !isTeamLeadMember(m)) return;
    out.push({m:m, duties:hit?hit.duties:[], lead:isTeamLeadMember(m)});
  });
  // Rostered first, then leads who are only here to supervise.
  out.sort((a,b)=>(b.duties.length?1:0)-(a.duties.length?1:0)||a.m.name.localeCompare(b.m.name));
  return out;
}

const ATT_OPTS=[
  {k:'present', code:'P', label:'Present'},
  {k:'late',    code:'L', label:'Late'},
  {k:'excused', code:'J', label:'Justified'},
  {k:'absent',  code:'N', label:'Not present'},
];

/* ── COVER FOR ONE EVENT ──────────────────────────────────────────
   A Facilitator or above can hand a single event to somebody else when
   the Team Lead cannot make it. Scope is deliberately one event: it needs
   no expiry because a date in the past covers nothing.

   The stand-in never leaves their own team's page. Their dashboard grows
   a panel with that event's roster and attendance, and nothing else of
   the other team is reachable from it.

   Anyone with an account can be given cover, including a volunteer who
   would fail can_edit_roster(). The database grants them write access to
   exactly the rows of the event they are covering — see the *_cover
   policies in SETUP.sql — so this is not enforced in the browser alone. */
/* ════════════════════════════════════════════
   THE BELL — what needs a lead's attention
   Three things, and only three. Everything in here is something a lead
   can act on, and clicking it goes straight to the thing it is about.
   No sound, no pop-up, no email: it lights with a count and clears when
   the thing behind it is handled.
════════════════════════════════════════════ */
const BELL_HORIZON_DAYS = 14;   // unfilled slots inside a fortnight. Sooner
                                // and it is lit permanently, which is the
                                // same as being switched off.
function addDaysLocal(iso, n){
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function bellItems(){
  const out = [];
  if(!IS_EDIT) return out;
  const today = nzTodayISO();
  const horizon = addDaysLocal(today, BELL_HORIZON_DAYS);

  /* 1. Somebody marked themselves away for a duty they hold. This is why
        the bell exists — nothing takes a person off a confirmed roster,
        so a human has to see it and decide. */
  EVENTS.filter(e=>e.date >= today && e.confirmed).forEach(ev=>{
    const data = (ROSTERS[ev.id] || {assign:{}}).assign || {};
    const seen = {};
    for(const key in data){
      for(const q of people(data[key])){
        if(q.id == null || seen[q.id]) continue;
        const m = memById(q.id);
        if(m && isAway(m, ev.date)){
          seen[q.id] = true;
          out.push({kind:'away', sort:ev.date,
            title: m.name + ' is away on ' + fmtShort(ev.date),
            sub: 'Rostered for ' + (ev.name||'this event') + ' · ' + recName(legacyLabel(key)),
            go: ()=>{ selEventId = ev.id; nav('roster'); }});
        }
      }
    }
  });

  /* 2. Gaps on something coming up. */
  EVENTS.filter(e=>e.date >= today && e.date <= horizon).forEach(ev=>{
    const n = slotCounts(ev).missing;
    if(n > 0) out.push({kind:'gap', sort:ev.date,
      title: n + ' unfilled ' + (n === 1 ? 'slot' : 'slots') + ' on ' + fmtShort(ev.date),
      sub: ev.name || 'IV Event',
      go: ()=>{ selEventId = ev.id; nav('roster'); }});
  });

  /* 3. A day on the other team handed to you. Until now this was only
        discoverable by happening to open your dashboard. */
  COVERING.forEach((c, i)=>out.push({kind:'cover', sort:c.ev.date,
    title: 'You are covering ' + fmtShort(c.ev.date),
    sub: 'Team ' + c.ev.team + ' · ' + (c.ev.name || 'IV Event'),
    go: ()=>{ nav('dashboard'); setTimeout(()=>{
      const p = document.querySelector('.cover-pnl'); if(p) p.scrollIntoView({block:'center'}); }, 120); }}));

  out.sort((a,b)=>a.sort < b.sort ? -1 : a.sort > b.sort ? 1 : 0);
  return out;
}
let BELL = [];
function refreshBell(){
  const item = document.getElementById('bellItem');
  if(!item) return;
  BELL = bellItems();
  if(!BELL.length){
    item.style.display = 'none';
    item.classList.remove('lit');
    const pop = document.getElementById('bellPop'); if(pop) pop.classList.remove('open');
    return;
  }
  item.style.display = '';
  item.classList.add('lit');
  document.getElementById('bellCount').textContent = BELL.length;
}
function toggleBell(ev){
  if(ev) ev.stopPropagation();
  const pop = document.getElementById('bellPop');
  if(!pop) return;
  if(pop.classList.contains('open')){ pop.classList.remove('open'); return; }
  const anchor = document.getElementById('bellItem');
  if(document.body !== pop.parentNode) document.body.appendChild(pop);
  /* Anchored by its bottom edge rather than its top, so the list grows
     upward from the button and never runs off the bottom of the screen. */
  const r = anchor ? anchor.getBoundingClientRect()
                   : {right: window.innerWidth - 18, top: window.innerHeight - 76};
  pop.style.top    = 'auto';
  pop.style.left   = Math.max(12, Math.min(r.right - 320, window.innerWidth - 332)) + 'px';
  pop.style.bottom = Math.max(12, window.innerHeight - r.top + 8) + 'px';
  pop.innerHTML = BELL.map((b,i)=>
    '<button class="bell-row" onclick="bellGo(' + i + ')">' +
      '<span class="tag">' + (b.kind === 'away' ? 'Away clash' : b.kind === 'gap' ? 'Unfilled' : 'Cover') + '</span>' +
      '<b>' + esc(b.title) + '</b><small>' + esc(b.sub) + '</small></button>').join('');
  pop.classList.add('open');
}
function bellGo(i){
  const b = BELL[i]; if(!b) return;
  document.getElementById('bellPop').classList.remove('open');
  closeSidebar();
  b.go();
}
document.addEventListener('click', function(e){
  const pop = document.getElementById('bellPop');
  if(pop && pop.classList.contains('open') && !e.target.closest('#bellPop') && !e.target.closest('#bellItem')) pop.classList.remove('open');
});

/* Who has opened the Hub since this event was confirmed. Team Leads
   cannot read the accounts table at all — profiles is rank 5 and above —
   so this comes from roster_seen(), which answers that one question and
   returns member ids only: no addresses, no timestamps, and nothing
   about anybody who is not on this roster. */
let SEEN={};              // event id -> Set(member id)
async function loadSeen(eventId){
  if(!sb||DB_MISSING||eventId==null||SEEN[eventId]) return;
  try{
    const {data,error}=await sb.rpc('roster_seen',{p_event_id:eventId});
    if(!error) SEEN[eventId]=new Set(Array.isArray(data)?data:[]);
  }catch(e){ /* older database — the line simply does not appear */ }
}

let COVERING=[];          // events elsewhere that I have been asked to cover
const CAN_ASSIGN_COVER=()=>hasPerm(...MOVE_PERMS);   // Facilitator and above

async function loadCovering(){
  COVERING=[];
  if(!sb||DB_MISSING||!CU||!CU.uid) return;
  try{
    const today=nzTodayISO();
    const {data:evs}=await sb.from('iv_events').select('*')
      .eq('cover_uid',CU.uid).gte('date',today).order('date');
    /* Show the panel wherever the stand-in cannot already do the job
       through the normal roster screen. That is the other team's events
       always, and this team's too when the person is a volunteer here —
       the ordinary view is read-only for them, so filtering on team alone
       meant a volunteer asked to cover a day on their OWN team saw nothing
       at all and the cover silently did nothing. */
    const mine=(evs||[]).filter(e=>e.team!==PAGE_TEAM||!IS_EDIT);
    if(!mine.length) return;
    const ids=mine.map(e=>e.id);
    // Only the teams actually being covered — usually one.
    const teams=[...new Set(mine.map(e=>e.team).filter(Boolean))];
    const [{data:ro},{data:at},{data:me}] = await Promise.all([
      sb.from('iv_roster').select('*').in('event_id',ids),
      sb.from('iv_attendance').select('*').in('event_id',ids),
      sb.from('iv_members').select('*').in('team',teams),
    ]);
    const rosters={}; (ro||[]).forEach(r=>rosters[r.event_id]=r.data);
    const att={}; (at||[]).forEach(a=>{ (att[a.event_id]=att[a.event_id]||{})[a.member_id]={status:a.status}; });
    COVERING=mine.map(e=>({ev:e,roster:rosters[e.id]||{assign:{}},att:att[e.id]||{},members:me||[]}));
  }catch(e){ console.warn('loadCovering:',e.message||e); }
}

function renderCoverPanels(){
  if(!COVERING.length) return '';
  let h='';
  COVERING.forEach(function(c,ci){
    const ev=c.ev;
    h+='<div class="pnl cover-pnl" style="margin-bottom:16px">'+
       '<div class="pnl-h">\u{1F91D} Covering \u00b7 Team '+esc(ev.team)+' \u00b7 '+esc(fmtNice(ev.date))+
       ' <span class="ct">'+esc(ev.name)+'</span></div><div class="pnl-b">'+
       '<div class="ib" style="margin-bottom:12px">You are standing in for this event only. Marking attendance and swapping people here changes Team '+esc(ev.team)+'\u2019s roster for '+esc(fmtNice(ev.date))+' and nothing else.</div>';
    const roll=coverRoll(c);
    const marked=roll.filter(r=>c.att[r.m.id]&&c.att[r.m.id].status).length;
    h+='<div style="font-weight:800;margin-bottom:8px">'+marked+' of '+roll.length+' marked</div>';
    roll.forEach(function(r){
      const st=c.att[r.m.id]&&c.att[r.m.id].status;
      h+='<div class="att-row'+(st?'':' unmarked')+'"><div class="att-nm">'+esc(r.m.name)+
         '<div class="att-duties">'+(r.duties.length
            ? r.duties.map(d=>'<span class="duty-chip">'+esc(recName(d))+'</span>').join('')
            : '<span class="duty-chip none">No duty</span>')+'</div></div>'+
         '<div class="att-seg">'+ATT_OPTS.map(o=>
           '<button class="att-btn '+o.k+(st===o.k?' on':'')+'" title="'+o.label+
           '" onclick="markCoverAttendance('+ci+','+r.m.id+',\''+o.k+'\')">'+o.code+'</button>').join('')+
         '</div></div>';
    });
    h+='</div></div>';
  });
  return h;
}

/* Same shape as attendanceRoll, but reading the fetched copy of the other
   team's data rather than this page's globals. */
function coverRoll(c){
  const data=(c.roster||{assign:{}}).assign||{};
  const byId={};
  for(const key in data){
    const label=legacyLabel(key);
    for(const q of people(data[key])){
      if(q.id==null) continue;
      (byId[q.id]=byId[q.id]||{duties:[]}).duties.push(label);
    }
  }
  const out=[];
  (c.members||[]).forEach(m=>{
    if(m.status!=='active') return;
    const hit=byId[m.id];
    if(!hit) return;                       // rostered people only; their leads are not my business
    out.push({m:m,duties:hit.duties});
  });
  out.sort((a,b)=>a.m.name.localeCompare(b.m.name));
  return out;
}

async function markCoverAttendance(ci,memberId,status){
  const c=COVERING[ci]; if(!c) return;
  const cur=c.att[memberId]&&c.att[memberId].status;
  const next=(cur===status)?null:status;
  if(next) c.att[memberId]={status:next}; else delete c.att[memberId];
  renderDashboard();
  try{
    if(!sb||DB_MISSING) return;
    // Hold the realtime listener off, as markAttendance does. Without it
    // our own write echoes straight back, triggers a full reload and wipes
    // the mark that is still being tapped in.
    pauseRT(1200);
    if(!next) await sb.from('iv_attendance').delete().eq('event_id',c.ev.id).eq('member_id',memberId);
    else{
      const {error}=await sb.from('iv_attendance').upsert({event_id:c.ev.id,member_id:memberId,
        status:next,marked_by:CU.user,marked_at:new Date().toISOString()});
      if(error){ toast('Could not save: '+(error.message||error),'err'); return; }
    }
    auditLog('cover-attendance','attendance','Team '+c.ev.team+' '+c.ev.date+' \u2014 '+
      ((c.members.find(m=>m.id===memberId)||{}).name||memberId)+': '+(next||'cleared'));
  }catch(e){ console.warn(e); }
}

async function saveCover(eventId){
  const ev=EVENTS.find(e=>e.id===eventId); if(!ev) return;
  const sel=document.getElementById('coverPick');
  const uid=sel?sel.value:'';
  const name=uid&&sel.options[sel.selectedIndex]?sel.options[sel.selectedIndex].text:'';
  const patch={cover_uid:uid||null, cover_name:uid?name:null, cover_by:uid?(CU.display||CU.user):null};
  Object.assign(ev,patch);
  try{
    const {error}=await sb.from('iv_events').update(patch).eq('id',ev.id);
    if(error){ toast(/column/i.test(error.message||'')?'Run the latest SETUP.sql to enable cover':'Could not save: '+error.message,'err'); return; }
  }catch(e){ toast('Could not save cover','err'); return; }
  auditLog('cover','events',ev.name+' '+ev.date+' \u2014 '+(uid?('assigned to '+name):'cover removed'));
  cM(); toast(uid?('Cover assigned to '+name):'Cover removed'); renderRoster();
}

function renderAttendance(){
  const el=document.getElementById('body-attendance'); if(!el) return;
  const evs=EVENTS.slice().sort((a,b)=>a.date<b.date?1:-1);
  if(attEventId==null||!EVENTS.some(e=>e.id===attEventId)){
    const today=nzTodayISO();
    const near=EVENTS.filter(e=>e.date<=today).sort((a,b)=>a.date<b.date?1:-1)[0]||evs[0];
    attEventId=near?near.id:null;
  }
  let h='<div class="ph"><div><h1>Attendance</h1><p>'+
    (IS_EDIT?'Everyone rostered for this event, plus the team leads. Their duties are listed so you can see who is covering what.'
            :'Attendance is recorded by the team leads.')+'</p></div></div>';
  h+='<div class="pnl" style="margin-bottom:14px"><div class="pnl-b" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+
    '<label class="flabel" style="margin:0">Event</label><select onchange="attEventId=+this.value;renderAttendance()" style="min-width:260px">'+
    (evs.length?evs.map(e=>'<option value="'+e.id+'"'+(e.id===attEventId?' selected':'')+'>'+esc(fmtShort(e.date))+' \u00b7 '+esc(e.name)+'</option>').join(''):'<option>No events</option>')+
    '</select>'+
    '<button class="btn btn-ol btn-sm" onclick="nav(\'reports\')">\u{1F4CA} Analytics \u2192</button></div></div>';

  const ev=EVENTS.find(e=>e.id===attEventId);
  if(!ev){ h+='<div class="empty-note">No events to record attendance for.</div>'; el.innerHTML=h; return; }

  const roll=attendanceRoll(ev);
  if(ev.confirmed && !SEEN[ev.id]) loadSeen(ev.id).then(()=>{ if(curPage==='attendance') renderAttendance(); });
  const rec=ATTEND[ev.id]||{};
  if(!roll.length){
    h+='<div class="empty-note">Nobody is rostered for this event yet \u2014 generate the roster first.</div>';
    el.innerHTML=h; return;
  }

  const tally={present:0,late:0,excused:0,absent:0};
  let marked=0;
  roll.forEach(r=>{ const st=rec[r.m.id]&&rec[r.m.id].status; if(st&&tally[st]!=null){ tally[st]++; marked++; } });
  const missing=roll.length-marked;

  // What is done and what is left, which is the question a lead is asking
  // while standing in the hall.
  h+='<div class="ib" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">'+
    '<b>'+esc(ev.name)+'</b> \u00b7 '+esc(fmtNice(ev.date))+
    '<span style="margin-left:auto;font-weight:800">'+marked+' of '+roll.length+' marked</span>'+
    (missing?'<span style="color:var(--gold-lt);font-weight:800">'+missing+' still to mark</span>'
            :'<span style="color:var(--green-lt);font-weight:800">\u2713 all marked</span>')+
    '</div>';
  h+='<div class="att-bar" style="display:flex;height:8px;border-radius:5px;overflow:hidden;margin-bottom:14px;background:var(--ds2)">'+
    ATT_OPTS.map(o=>tally[o.k]?'<div class="att-seg-'+o.k+'" style="width:'+(tally[o.k]/roll.length*100)+'%" title="'+o.label+': '+tally[o.k]+'"></div>':'').join('')+
    '</div>';
  h+='<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;font-size:12.5px;font-weight:800">'+
    ATT_OPTS.map(o=>'<span class="att-key '+o.k+'">'+o.code+' \u00b7 '+o.label+': '+tally[o.k]+'</span>').join('')+'</div>';

  /* Deliberately worded as "opened the Hub", never "confirmed". It
     measures presence, not attention: somebody can open the Hub without
     ever looking at Friday. A lead should not act on a number that
     quietly means something weaker than it appears to. */
  if(ev.confirmed && SEEN[ev.id]){
    const seen=roll.filter(r=>SEEN[ev.id].has(r.m.id));
    const unseen=roll.filter(r=>!SEEN[ev.id].has(r.m.id));
    h+='<div class="ib" style="margin-bottom:12px">'+
       '<b>'+seen.length+' of '+roll.length+'</b> have opened the Hub since this roster was confirmed'+
       (unseen.length?' \u00b7 not yet: '+unseen.map(r=>esc(r.m.name)).join(', '):' \u2014 everyone has')+
       '</div>';
  }
  h+='<div class="tw"><div class="pnl-h">\u{1F465} On duty tonight <span class="ct">'+roll.length+'</span></div>';
  roll.forEach(r=>{
    const m=r.m, st=rec[m.id]&&rec[m.id].status;
    const btn=(o)=>IS_EDIT
      ? '<button class="att-btn '+o.k+(st===o.k?' on':'')+'" title="'+o.label+'" onclick="markAttendance('+ev.id+','+m.id+',\''+o.k+'\')">'+o.code+'</button>'
      : '<span class="att-btn '+o.k+(st===o.k?' on':'')+'">'+o.code+'</span>';
    const duties=r.duties.length
      ? r.duties.map(d=>'<span class="duty-chip">'+esc(recName(d))+'</span>').join('')
      : '<span class="duty-chip none">'+(r.lead?'Supervising':'No duty')+'</span>';
    h+='<div class="att-row'+(st?'':' unmarked')+'">'+
       '<div class="att-nm">'+esc(m.name)+(r.lead?' <span class="lead-tag">Lead</span>':'')+
         '<div class="att-duties">'+duties+'</div></div>'+
       '<div class="att-seg">'+ATT_OPTS.map(btn).join('')+'</div></div>';
  });
  h+='</div>';
  el.innerHTML=h;
}

  const cyclesForPick=CYCLES.slice();
  let h='<div class="ph"><div><h1>Analytics</h1><p>Attendance rates and duty-count fairness across a cycle.</p></div></div>';

      .map(function(t){ return '<button class="'+(repMode===t[0]?'on':'')+'" onclick="repMode=\''+t[0]+'\';repMember=null;renderReports()">'+t[1]+'</button>'; }).join('')+
    '</div>'+
    '<label class="flabel" style="margin:0">Cycle</label><select onchange="repCycleK=+this.value;renderReports()" style="min-width:220px">'+

/* ── ANALYTICS MATHS ──────────────────────────────────────────────
   Attendance rate  = (P + L) / (P + L + N)
     A justified absence is removed from the calculation entirely, so
     telling someone in advance costs nothing. Somebody who was never
     rostered has no rate at all rather than a misleading 0%.
   Lateness rate    = L / (P + L)
     Measured against the times they actually turned up, so missing an
     event cannot make someone look more punctual.
   Duty days        = the number of duty slots they have been given. A
     person on two duties at one event counts twice, because that is two
     duties done.                                                        */
function attendanceStats(memberId, k){
  let P=0,L=0,J=0,N=0;
  const evs = (k==null) ? EVENTS : eventsInCycle(k);
  evs.forEach(ev=>{
    const st=(ATTEND[ev.id]||{})[memberId]&&ATTEND[ev.id][memberId].status;
    if(st==='present') P++; else if(st==='late') L++;
    else if(st==='excused') J++; else if(st==='absent') N++;
  });
  const attDen=P+L+N, lateDen=P+L;
  return {P:P,L:L,J:J,N:N,
    marked:P+L+J+N,
    rate:      attDen ? Math.round((P+L)/attDen*100) : null,
    lateness:  lateDen ? Math.round(L/lateDen*100)   : null};
}
/* id -> { total, cyc, prev, byDuty:{dutyName:count} } */
function dutyStats(k){
  const out={};
  const bump=(id,key,duty)=>{
    const o=out[id]=out[id]||{total:0,cyc:0,prev:0,byDuty:{}};
    o.total++; if(key) o[key]++;
    if(duty) o.byDuty[duty]=(o.byDuty[duty]||0)+1;
  };
  EVENTS.forEach(ev=>{
    const r=ROSTERS[ev.id]; if(!r||!r.assign) return;
    const kk=cycleForDate(ev.date);
    const where = (k!=null && kk===k) ? 'cyc' : ((k!=null && kk===k-1) ? 'prev' : null);
    for(const key in r.assign){
      const label=recName(legacyLabel(key));
      for(const q of people(r.assign[key])){ if(q.id!=null) bump(q.id, where, label); }
    }
  });
  return out;
}
function cycleEventsSorted(k){ return eventsInCycle(k); }
function renderAttendanceReport(k){
  const active=MEMBERS.filter(m=>m.status==='active');
  if(!active.length) return '<div class="empty-note">No active members.</div>';
  /* Built once. This used to call dutyStats(k) inside the map, so the whole
     event and roster history was walked again for every single member —
     sixty members over a year of events is thousands of full passes, and
     the Analytics tab simply locked up while it ground through them. */
  const ds=dutyStats(k);
  const rows=active.map(m=>({m:m, s:attendanceStats(m.id,k), d:(ds[m.id]||{total:0})}))
    .sort((x,y)=>(y.s.rate==null?-1:y.s.rate)-(x.s.rate==null?-1:x.s.rate)||x.m.name.localeCompare(y.m.name));
  const pct=v=>v==null?'<span style="color:var(--dm)">\u2014</span>':v+'%';
  let h='<div class="tw"><div class="tw-scroll"><table><thead><tr>'+
    '<th>Member</th><th title="(Present + Late) as a share of Present, Late and Not present. Justified absences are excluded.">Attendance rate</th>'+
    '<th title="Late as a share of the times they turned up.">Lateness rate</th>'+
    '<th title="Total duty slots they have been given.">Duty days completed</th>'+
    '<th>P</th><th>L</th><th>J</th><th>N</th></tr></thead><tbody>';
  rows.forEach(r=>{
    const good=r.s.rate!=null&&r.s.rate>=90, bad=r.s.rate!=null&&r.s.rate<70;
    h+='<tr><td style="font-weight:800">'+esc(r.m.name)+'</td>'+
       '<td style="font-weight:900;color:'+(bad?'var(--red-lt)':good?'var(--green-lt)':'var(--dt)')+'">'+pct(r.s.rate)+'</td>'+
       '<td style="font-weight:800;color:'+((r.s.lateness||0)>25?'var(--gold-lt)':'var(--dt)')+'">'+pct(r.s.lateness)+'</td>'+
       '<td class="num" style="font-weight:800">'+r.d.total+'</td>'+

  });
  return h+'</tbody></table></div></div>'+
    '<div class="ib" style="margin-top:12px">A justified absence is left out of the attendance rate entirely \u2014 giving notice costs nothing. Lateness is measured against the times someone actually turned up, so missing an event cannot make them look more punctual. A dash means they have never been rostered.</div>';
}

function renderLeaderboard(){
  const ds=dutyStats(null);

  // rather than the full catalogue of duties that may never be used.

  else if(lbSort==='least') rows.sort((a,b)=>a.n-b.n||a.m.name.localeCompare(b.m.name));

  const max=Math.max.apply(null,rows.map(r=>r.n).concat([0]));

  h+='<div class="tw"><div class="pnl-h">'+esc(lbDuty)+' <span class="ct">'+
     rows.reduce((t,r)=>t+r.n,0)+' times, across '+rows.filter(r=>r.n).length+' people</span></div><div class="pnl-b">';
  rows.forEach(function(r,i){

       '<div class="num" style="width:36px;font-weight:900">'+r.n+'</div></div>';
  });

}

  return out;
}

function ensureH2C(){
  return new Promise((res,rej)=>{
    if(window.html2canvas) return res();
    const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    s.onload=()=>res(); s.onerror=()=>rej(new Error('html2canvas failed to load')); document.head.appendChild(s);
  });
}
function rosterLines(ev){
  const data=ROSTERS[ev.id]||{assign:{}}; const duties=dutiesForEvent(ev);
  const mk=(name,sec,a)=>{ a=a||{m:[],f:[],x:[]}; const male=(a.m||[]).map(p=>p.name),female=(a.f||[]).map(p=>p.name);
    (a.x||[]).forEach(p=>{ const mem=memById(p.id); ((mem&&mem.gender)==='Female'?female:male).push(p.name); }); return {sec:sec,name:name,male:male,female:female}; };
  const lines=duties.filter(d=>d.section!=='mph').map(d=>mk(d.name,'core',data.assign&&data.assign[d.key]));
  const known=new Set(duties.map(d=>d.key));
  for(const key in (data.assign||{})){ if(known.has(key)||!people(data.assign[key]).length) continue; lines.push(mk(legacyLabel(key),'core',data.assign[key])); }
  duties.filter(d=>d.section==='mph').forEach(d=>lines.push(mk(d.name,'mph',data.assign&&data.assign[d.key])));
  return lines;
}
function ordN(n){ const t=n%100; if(t>=11&&t<=13) return n+'th'; return n+({1:'st',2:'nd',3:'rd'}[n%10]||'th'); }
function sheetTitle(prefix,ev){
  const d=new Date(ev.date+'T12:00:00');
  return prefix+' - '+d.toLocaleDateString('en-NZ',{weekday:'long'})+', '+ordN(d.getDate())+' '+
         d.toLocaleDateString('en-NZ',{month:'long'})+' '+d.getFullYear()+': '+TEAM_NAME;
}
/* Title across the top of the exported sheet, matching the printed roster:
   "Team A - Friday Majlis - 11th September 2026 (Casual Uniform)" */
function rxTitle(ev){
  const d=new Date(ev.date+'T12:00:00');

         d.toLocaleDateString('en-NZ',{month:'long'})+' '+d.getFullYear()+
         ' ('+(ev.uniform||'Casual')+' Uniform)';
}

async function clip(text){ try{ if(navigator.clipboard&&navigator.clipboard.writeText) await navigator.clipboard.writeText(text); else { const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); } return true; }catch(e){ console.warn(e); return false; } }

async function copyMemberDuties(id){
  const m=memById(id); if(!m) return; const upc=memberUpcomingDuties(id);
  let out='*'+m.name+' — upcoming '+TEAM_NAME+' duties*\n';

  upc.forEach(u=>{ out+=fmtNice(u.ev.date)+' ('+u.ev.name+'): '+u.duties.join(', ')+'\n'; });
  toast(await clip(out)?'Member duties copied':'Copy failed',(await clip(out))?'ok':'err');

function memberUpcomingDuties(memberId){
  const today=nzTodayISO(); const out=[];
  EVENTS.filter(e=>e.date>=today).sort((a,b)=>a.date<b.date?-1:1).forEach(ev=>{
    const r=ROSTERS[ev.id]; if(!r||!r.assign) return; const duties=[];
    for(const key in r.assign){ for(const p of people(r.assign[key])){ if(p.id===memberId){ duties.push(KEY_TO_NAME[key]||legacyLabel(key)); } } }
    if(duties.length) out.push({ev:ev,duties:duties});
  });
  return out;
}

/* ── WIRE-UP ── */
document.getElementById('dlg').addEventListener('click',function(e){ if(e.target===this) cM(); });
document.getElementById('mo').addEventListener('click',function(e){ if(e.target===this) closeDrawer(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ cM(); closeDrawer(); closeSidebar(); } });
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();

/* The webfont must be rasterised, not merely requested, before a capture —
   html2canvas draws whatever is loaded at that instant, so a slow font
   would silently produce an image in the fallback face. Capped so a
   blocked CDN degrades to a fallback image rather than hanging. */
async function fontsSettled(ms){
  try{
    await Promise.race([(document.fonts&&document.fonts.ready)||Promise.resolve(),
                        new Promise(r=>setTimeout(r,ms||3000))]);
    if(document.fonts&&document.fonts.load){
      await Promise.race([
        Promise.all([400,500,600,700,800,900].map(w=>document.fonts.load(w+" 16px Archivo"))),
        new Promise(r=>setTimeout(r,ms||3000))]);
    }
  }catch(e){}
}

/* ── DESKTOP TOP NAVIGATION ──────────────────────────────────────────
   Reads the sidebar and mirrors it into the top bar. Items before the
   first section heading sit directly on the bar; each heading becomes a
   dropdown holding the items that follow it.

   Clicks are forwarded to the original sidebar element rather than
   reimplemented, so every existing handler, router and permission check
   keeps working untouched. A hidden sidebar item produces no top-nav
   entry, and a section whose items are all hidden produces no dropdown.

   A MutationObserver keeps the two in step: the pages toggle nav items as
   permissions load and as the active page changes, and there is no single
   hook in all four files to attach to. Reading only, so it cannot loop. */
(function(){
  var built=false, pending=null;
  // Deliberately NOT offsetParent: above 1101px the sidebar this reads from
  // is itself display:none, which would make every item look hidden and
  // leave the bar empty. A descendant of a hidden element still reports its
  // own computed display, so that is what the permission code's hiding
  // actually shows up in.
  function vis(el){ return !!el && !el.hidden && getComputedStyle(el).display!=='none'; }
  function mk(tag,cls,html){ var e=document.createElement(tag); e.className=cls; if(html!=null) e.innerHTML=html; return e; }

  function entry(src){
    var b=mk('button','tn-b'+(src.classList.contains('hub-link')?' tn-hub':''),src.innerHTML);
    if(src.classList.contains('active')) b.classList.add('on');
    b.addEventListener('click',function(ev){
      ev.stopPropagation(); closeAll();
      // Fire the real sidebar element so its own handler runs.
      if(src.tagName==='A'&&src.getAttribute('href')) location.href=src.getAttribute('href');
      else src.click();
    });
    return b;
  }

  function closeAll(){
    var g=document.querySelectorAll('.tn-group.open');
    for(var i=0;i<g.length;i++) g[i].classList.remove('open');
  }

  function build(){
    var bar=document.getElementById('topnav'), nav=document.querySelector('.sb-nav');
    if(!bar||!nav) return;
    var row=mk('div','tn-row'); var group=null, groupBtn=null, groupMenu=null, groupHas=false;

    function flush(){
      if(group&&groupHas) row.appendChild(group);
      group=null; groupBtn=null; groupMenu=null; groupHas=false;
    }
    var kids=nav.children;
    for(var i=0;i<kids.length;i++){
      var el=kids[i];
      if(el.classList.contains('nav-sec')){
        flush();
        if(!vis(el)) continue;
        group=mk('div','tn-group');
        var secName=el.textContent.trim();
        groupBtn=mk('button','tn-b'+(/^management$/i.test(secName)?' tn-mgmt':''),
                    secName+'<span class="tn-caret">▾</span>');
        groupMenu=mk('div','tn-menu');
        /* Opens on hover, and still on click for touch screens and
           keyboards, which have no hover at all. A short delay on leaving
           stops the menu snapping shut when the pointer clips a corner on
           its way down. */
        (function(g,b){
          var shut;
          function open(){ clearTimeout(shut); closeAll(); g.classList.add('open'); }
          function later(){ clearTimeout(shut); shut=setTimeout(function(){ g.classList.remove('open'); }, 220); }
          g.addEventListener('mouseenter', open);
          g.addEventListener('mouseleave', later);
          b.addEventListener('click', function(ev){
            ev.stopPropagation();
            g.classList.contains('open') ? g.classList.remove('open') : open();
          });
        })(group,groupBtn);
        group.appendChild(groupBtn); group.appendChild(groupMenu);
      } else if(el.classList.contains('nav-item')||el.classList.contains('hub-link')){
        // hub-link is the cross-page "Back to Hub" anchor. It lives in the
        // same nav but carries its own class, and skipping it left the AV
        // and Team pages with no way back to the Hub once the sidebar was
        // hidden — the only exit was the browser's back button.
        if(!vis(el)) continue;
        if(group){ groupMenu.appendChild(entry(el)); groupHas=true;
                   if(el.classList.contains('active')) groupBtn.classList.add('on'); }
        else row.appendChild(entry(el));
      }
    }
    flush();
    bar.innerHTML='';
    var brand=mk('div','tn-brand','');
    var logo=document.querySelector('.sb-logo-img, .sb-logo img, .sidebar img');
    if(logo){ var im=document.createElement('img'); im.src=logo.getAttribute('src')||''; im.alt=''; brand.appendChild(im); }
    var h2=document.querySelector('.sb-logo h2, .sidebar h2');
    brand.appendChild(document.createTextNode(h2?h2.textContent.trim():'IV Hub'));
    /* The brand doubles as the way home, so the pages do not each need a
       Dashboard item taking up a slot in the bar. */
    var home=document.querySelector('.sb-nav .nav-item[data-page="dashboard"]');
    if(home){
      brand.title='Go to the dashboard';
      brand.setAttribute('role','button'); brand.setAttribute('tabindex','0');
      brand.addEventListener('click',function(ev){ ev.stopPropagation(); closeAll(); home.click(); });
      brand.addEventListener('keydown',function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); home.click(); } });
    }
    bar.appendChild(brand); bar.appendChild(row);
    var right=mk('div','tn-right');

    /* Signing out lives in the sidebar footer, outside .sb-nav, and the
       three pages each do it differently — a button, an icon button, a
       span with an onclick. Hiding the sidebar took all of them with it,
       so a desktop user had no way to sign out at all. Whichever one this
       page has gets mirrored here and forwarded to the original, so the
       real handler still runs. */
    // Each page names this element differently; the last selector is the
    // structural fallback for any page that names it something new.
    var who=document.querySelector('.sidebar #tbName, .sidebar #unm,'
      +' .sidebar .uinfo .n, .sidebar .uchip .n, .sidebar .uinfo > div');
    var name=(who&&who.textContent.trim())||(window.CU&&(CU.display||CU.user))||'';
    if(name) right.appendChild(mk('span','tn-who',name));

    var out=document.querySelector('.sidebar #btnLogout, .sidebar .sb-signout, .sidebar .uout,'
      +' .sidebar [onclick*="signOut"], .sidebar [onclick*="logout"]');
    if(out){
      var so=mk('button','tn-out','Sign out');
      so.title='Sign out of the IV Hub';
      so.addEventListener('click',function(ev){ ev.stopPropagation(); out.click(); });
      right.appendChild(so);
    }

    var tog=mk('button','tn-tog','Hide menu \u2303');
    tog.title='Hide the menu bar';
    tog.addEventListener('click',function(ev){ ev.stopPropagation(); setHidden(true); });
    right.appendChild(tog);
    bar.appendChild(right);
    built=true;
  }

  /* Kept in localStorage so the choice survives a reload, but the bar is
     shown unless it was explicitly hidden — a missing or unreadable value
     always means visible. */
  var KEY='ivhub_topnav_hidden';
  function setHidden(h){
    document.body.classList.toggle('tn-hidden',!!h);
    try{ h?localStorage.setItem(KEY,'1'):localStorage.removeItem(KEY); }catch(e){}
  }
  function restore(){
    var h=false; try{ h=localStorage.getItem(KEY)==='1'; }catch(e){}
    document.body.classList.toggle('tn-hidden',h);
    if(!document.querySelector('.tn-show')){
      var s=mk('button','tn-show','\u2630 Menu');
      s.title='Show the menu bar';
      s.addEventListener('click',function(ev){ ev.stopPropagation(); setHidden(false); });
      document.body.appendChild(s);
    }
  }

  function schedule(){ clearTimeout(pending); pending=setTimeout(build,80); }

  function start(){
    var nav=document.querySelector('.sb-nav'); if(!nav) return;
    restore();
    build();
    try{
      new MutationObserver(schedule).observe(nav.closest('.sidebar')||nav,
        {childList:true,subtree:true,attributes:true,attributeFilter:['class','style','hidden']});
    }catch(e){}
    document.addEventListener('click',closeAll);
    window.addEventListener('resize',schedule);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start);
  else start();
})();
</script>
</body>
</html>
