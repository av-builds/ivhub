# Runs the regression suite on GitHub's runners so nobody has to install
# anything. The result is the tick or cross next to the commit.
name: Verify pages
on:
  push:
    paths: ['*.html', 'tools/**', 'tests/**', 'package.json', '.github/workflows/verify.yml']
  pull_request:
    paths: ['*.html', 'tools/**', 'tests/**', 'package.json', '.github/workflows/verify.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      # The cache is only a download shortcut. It was keyed on package.json, whose "^1.40.0" lets
      # Playwright move to a newer release that wants a newer browser build than the cached one,
      # so a cache hit could leave the browser missing. Installing every run is a no-op when the
      # right build is already there and fetches it when it is not.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm test
